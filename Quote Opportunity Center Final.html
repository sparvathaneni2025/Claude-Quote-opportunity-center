<style>
  :root {
    --bg: #FAF7F2;
    --nav: #2B2B2B;
    --accent: #C1541C;
    --card: #FFFFFF;
    --cream: #FFF9F2;
    --border: #E5DDD3;
    --text: #2B2B2B;
    --text-muted: #7A7267;
    --red: #C1392B;
    --orange: #C1541C;
    --yellow: #B8860B;
    --green: #4C7A3D;
    --gray: #9B9186;
  }
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #qoc { background: var(--bg); color: var(--text); border-radius: 12px; overflow: hidden; }
  .qoc-nav { background: var(--nav); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .qoc-nav .brand { font-weight: 700; font-size: 15px; margin-right: 16px; color: #fff; letter-spacing: 0.3px; }
  .qoc-tab { background: transparent; border: none; color: #cfc9c0; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .qoc-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .qoc-tab:hover:not(.active) { background: #3d3d3d; color: #fff; }
  .qoc-body { padding: 20px; }
  .qoc-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .val { font-size: 22px; font-weight: 700; color: var(--nav); }
  .kpi .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .kpi.warn .val { color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; }
  thead th { background: var(--cream); text-align: left; padding: 10px 8px; font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid var(--border); }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: #FFFBF6; }
  .flag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .flag.overdue { background: var(--red); }
  .flag.today { background: var(--orange); }
  .flag.missing { background: var(--yellow); }
  .flag.ok { background: var(--green); }
  .flag.lost { background: #6B4E7A; }
  .flag.ff-badge { cursor: pointer; }
  .flag.ff-badge:hover { outline: 2px solid var(--nav); outline-offset: 1px; }
  .flag.ff-on { outline: 2px solid var(--nav); outline-offset: 1px; }
  .kpi.clickable { cursor: pointer; transition: border-color 0.12s, box-shadow 0.12s; }
  .kpi.clickable:hover { border-color: var(--accent); box-shadow: 0 1px 6px rgba(193,84,28,0.18); }
  .kpi.kpi-on { border-color: var(--accent); border-width: 2px; background: #FFF3E8; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: #EFE6DA; color: var(--nav); font-weight: 600; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 32px; }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--nav); }
  .section-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .dq-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .dq-item:last-child { border-bottom: none; }
  .dq-sev { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 8px; }
  .roadmap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .roadmap-card { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--text-muted); font-size: 12px; background: var(--cream); }
  .roadmap-card b { display: block; color: var(--nav); font-size: 13px; margin-bottom: 4px; }
  .save-status { font-size: 11px; color: var(--green); margin-left: 8px; }
  .refresh-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .snapshot-note { font-size: 11px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
</style>

</div>

const TODAY = new Date("2026-10-03");
const STORAGE_KEY = "qoc-line-edits-v1";
let editState = {}; // key: quoteNo|lineNo -> {quoteType, targetPrice, comments}

function lineKey(q, l) { return q.quoteNo + "|" + l.lineNo; }
function daysBetween(dateStr) {
  const d = new Date(dateStr);
  return Math.round((d - TODAY) / 86400000);
}
function fmt$(n) { return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }

function computeFlags(q, edit) {
  const flags = [];
  if (!q.followUpDate) { flags.push({label: "Missing Follow-Up Date", cls: "missing", key: "missingfu"}); }
  else {
    const fu = daysBetween(q.followUpDate);
    if (fu < 0) flags.push({label: "Overdue " + Math.abs(fu) + "d", cls: "overdue", key: "overdue"});
    else if (fu === 0) flags.push({label: "Due today", cls: "today", key: "today"});
  }
  if (!q.followUpCode) flags.push({label: "Missing Follow-Up Code", cls: "missing", key: "missingcode"});
  if (!q.followUpSalesperson) flags.push({label: "Missing Follow-Up Rep", cls: "missing", key: "missingrep"});
  const exp = daysBetween(q.expirationDate);
  if (exp >= 0 && exp <= 5) flags.push({label: "Expires in " + exp + "d", cls: "today", key: "expiring"});
  else if (q.expirationDate && exp < 0) flags.push({label: "Expired " + Math.abs(exp) + "d ago", cls: "overdue", key: "expired"});
  if (normalizeOwner(q.owner) !== q.bcSalesperson) {
    flags.push({label: "Owner \u2260 BC Salesperson", cls: "missing", key: "ownermismatch"});
  }
  if (q.lostCode) flags.push({label: "Lost code: " + q.lostCode, cls: "lost", key: "lostcode"});
  if (edit && !edit.quoteType) flags.push({label: "Missing Bid/Buy", cls: "missing", key: "missingbidbuy"});
  return flags;
}

// ---- Interactive flag filters. One active filter at a time (v1): clicking a KPI tile or an inline flag badge
// filters the table to matching rows; clicking the same one again clears it.
const FLAG_FILTERS = {
  overdue:       { label: "Overdue",                    test: (q,l,e) => !!q.followUpDate && daysBetween(q.followUpDate) < 0 },
  today:         { label: "Due today",                  test: (q,l,e) => !!q.followUpDate && daysBetween(q.followUpDate) === 0 },
  missingfu:     { label: "Missing follow-up date",     test: (q,l,e) => !q.followUpDate },
  expiring:      { label: "Expiring \u22645 days",       test: (q,l,e) => { const x = daysBetween(q.expirationDate); return x >= 0 && x <= 5; } },
  expired:       { label: "Already past expiration",    test: (q,l,e) => !!q.expirationDate && daysBetween(q.expirationDate) < 0 },
  missingcode:   { label: "Missing follow-up code",     test: (q,l,e) => !q.followUpCode },
  missingrep:    { label: "Missing follow-up rep",      test: (q,l,e) => !q.followUpSalesperson },
  ownermismatch: { label: "Owner \u2260 BC salesperson",  test: (q,l,e) => normalizeOwner(q.owner) !== q.bcSalesperson },
  lostcode:      { label: "Lost code set",              test: (q,l,e) => !!q.lostCode },
  missingbidbuy: { label: "Missing Bid/Buy",            test: (q,l,e) => !(e && e.quoteType) },
  zerostock:     { label: "Zero stock",                 test: (q,l,e) => l && l.stock === 0 }
};
const flagFilters = {}; // containerId -> FLAG_FILTERS key, or null

function filterChip(containerId, key, quoteCount, lineCount) {
  const f = FLAG_FILTERS[key];
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#FFF3E8;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;">

    <span style="font-size:11px;color:var(--text-muted)">${lineCount} line${lineCount===1?'':'s'}</span>
    <button class="ff-clear" data-container="${containerId}" title="Clear filter" style="margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:6px;width:20px;height:20px;line-height:1;cursor:pointer;font-size:13px;">&times;</button>
  </div>`;
}
function normalizeOwner(owner) {
  const map = {"Adam Purcell":"APURCELL","Kelli Jones":"KJONES","Jerik Wong":"JWONG","Spencer Doty":"SDOTY"};
  return map[owner] || owner;
}

async function loadEdits() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) editState = JSON.parse(result.value);
  } catch (e) { editState = {}; }
}
async function saveEdits() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(editState)); } catch (e) {}
}
function getEdit(key) {
  return editState[key] || { quoteType: "", targetPrice: "", comments: "" };
}

const tableFilters = {}; // containerId -> { quoteType: 'All', classification: 'All', customer: 'All' }

function renderQuoteTable(containerId, quoteList, titleHtml, subHtml) {
  const panel = document.getElementById(containerId);
  if (!tableFilters[containerId]) tableFilters[containerId] = { quoteType: 'All', classification: 'All', customer: 'All' };
  const filt = tableFilters[containerId];

  let rows = [];
  quoteList.forEach(q => {
    q.lines.forEach(l => {
      const edit = getEdit(lineKey(q,l));
      rows.push({q, l, flags: computeFlags(q, edit), edit});
    });
  });

  // apply filters
  if (filt.quoteType !== 'All') {
    rows = rows.filter(({edit}) => (edit.quoteType || '(blank)') === filt.quoteType);
  }
  if (filt.classification !== 'All') {
    rows = rows.filter(({l}) => l.itemClassification === filt.classification);
  }
  if (filt.customer !== 'All') {
    rows = rows.filter(({q}) => q.custNo === filt.customer);
  }
  const ffKey = flagFilters[containerId] || null;
  if (ffKey && FLAG_FILTERS[ffKey]) {
    rows = rows.filter(({q,l,edit}) => FLAG_FILTERS[ffKey].test(q,l,edit));
  }

  const customerOptions = [...new Map(quoteList.map(q => [q.custNo, q.customer])).entries()]
    .sort((a,b) => a[1].localeCompare(b[1]));

  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  rows.sort((a,b) => rank(a.flags) - rank(b.flags) || b.l.lineAmount - a.l.lineAmount);

  const overdueCount = quoteList.filter(q => q.followUpDate && daysBetween(q.followUpDate) < 0).length;
  const missingFUCount = quoteList.filter(q => !q.followUpDate).length;
  const todayCount = quoteList.filter(q => q.followUpDate && daysBetween(q.followUpDate) === 0).length;
  const totalValue = quoteList.reduce((s,q)=>s+q.quoteTotal,0);
  const expiringCount = quoteList.filter(q => { const e = daysBetween(q.expirationDate); return e >= 0 && e <= 5; }).length;
  const expiredCount = quoteList.filter(q => q.expirationDate && daysBetween(q.expirationDate) < 0).length;
  const lostCodeCount = quoteList.filter(q => q.lostCode).length;
  const ownerMismatchCount = quoteList.filter(q => normalizeOwner(q.owner) !== q.bcSalesperson).length;
  const filteredValue = rows.reduce((s,{l})=>s+l.lineAmount,0);

  panel.innerHTML = `
    ${titleHtml}
    ${subHtml}
    <div class="qoc-kpis">
      <div class="kpi clickable ${overdueCount?'warn':''} ${ffKey==='overdue'?'kpi-on':''}" data-ff="overdue"><div class="val">${overdueCount}</div><div class="lbl">Overdue follow-up</div></div>

// ---- Lost Quotes -------------------------------------------------------------------------------------------
// Every quote on the team's accounts with a lostCode populated, pulled per rep (same method as the active pull).
// Status deliberately shown as-is: it still reads "Quote Issued"/"Quote WIP" because BC never formally closes
// these. That is the known limitation, not a bug in this view.
let lostFilter = null; // FLAG_FILTERS-style key, or a 'code:XXX' key. One at a time.

function lostFlagged(r) { return (!!r.lostCode) !== (!!r.reasonCode); } // one set, the other blank

function renderLost() {
  const panel = document.getElementById('panel-lost');
  const all = LOST_QUOTES;
  const missingReason = all.filter(r => r.lostCode && !r.reasonCode);
  const missingLost   = all.filter(r => r.reasonCode && !r.lostCode);
  const flagged       = all.filter(lostFlagged);
  const byCode = {};
  all.forEach(r => { byCode[r.lostCode || '(none)'] = (byCode[r.lostCode || '(none)'] || 0) + 1; });
  const codeRows = Object.entries(byCode).sort((a,b) => b[1]-a[1]);

  let rows = all;
  if (lostFilter === 'missingreason') rows = missingReason;
  else if (lostFilter === 'missinglost') rows = missingLost;
  else if (lostFilter === 'flagged') rows = flagged;
  else if (lostFilter && lostFilter.startsWith('code:')) rows = all.filter(r => (r.lostCode || '(none)') === lostFilter.slice(5));

  // flagged rows first, then quote value descending
  rows = rows.slice().sort((a,b) => (lostFlagged(b)?1:0) - (lostFlagged(a)?1:0) || b.quoteTotal - a.quoteTotal);

  const totalValue = all.reduce((s,r)=>s+r.quoteTotal, 0);
  const shownValue = rows.reduce((s,r)=>s+r.quoteTotal, 0);
  const label = lostFilter === 'missingreason' ? 'Lost code set, reason code blank'
              : lostFilter === 'missinglost' ? 'Reason code set, lost code blank'
              : lostFilter === 'flagged' ? 'Mismatched lost/reason code'
              : lostFilter && lostFilter.startsWith('code:') ? ('Lost code ' + lostFilter.slice(5)) : '';

  panel.innerHTML = `
    <div class="section-title">Lost Quotes</div>
    <div class="section-sub">Every quote on the team's accounts carrying a <b>lostCode</b>, pulled per rep against each rep's assigned-account list. <b>Status still reads "Quote Issued" / "Quote WIP" on all of them &mdash; that is expected.</b> Business Central never formally closes these out, so the status column is not a mistake in this view; it is the finding. Counts below are clickable filters &mdash; click once to filter, click again to clear.</div>
    <div class="qoc-kpis">
      <div class="kpi clickable ${lostFilter===null?'kpi-on':''}" data-lf="all"><div class="val">${all.length}</div><div class="lbl">Lost-coded quotes</div></div>
      <div class="kpi clickable warn ${lostFilter==='missingreason'?'kpi-on':''}" data-lf="missingreason"><div class="val">${missingReason.length}</div><div class="lbl">Lost code, no reason code</div></div>
      <div class="kpi clickable ${missingLost.length?'warn':''} ${lostFilter==='missinglost'?'kpi-on':''}" data-lf="missinglost"><div class="val">${missingLost.length}</div><div class="lbl">Reason code, no lost code</div></div>
      <div class="kpi clickable warn ${lostFilter==='flagged'?'kpi-on':''}" data-lf="flagged"><div class="val">${flagged.length}</div><div class="lbl">Flagged (one side blank)</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Value carrying a lost code</div></div>
    </div>
    <div class="card" style="padding:12px 14px;margin-bottom:14px">
      <b style="font-size:12px;color:var(--text-muted)">LOST CODE BREAKDOWN</b>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
        ${codeRows.map(([c,n]) => `<span class="flag lost ff-badge${lostFilter==='code:'+c?' ff-on':''}" data-lf="code:${c}" title="Filter to ${c}">${c} &middot; ${n}</span>`).join('')}
      </div>
    </div>
    ${lostFilter ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#FFF3E8;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;">
      <span style="font-size:12px;font-weight:700;color:var(--accent)">Showing: ${label} (${rows.length})</span>
      <span style="font-size:11px;color:var(--text-muted)">${fmt$(shownValue)}</span>
      <button class="lf-clear" title="Clear filter" style="margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:6px;width:20px;height:20px;line-height:1;cursor:pointer;font-size:13px;">&times;</button>
    </div>` : ''}
    <div style="overflow-x:auto"><table>
      <thead><tr><th>Flags</th><th>Quote</th><th>Customer</th><th>Owner</th><th>Quote Total</th><th>Lost Code</th><th>Reason Code</th><th>Status</th></tr></thead>
      <tbody>
        ${rows.length ? rows.map(r => `<tr>
          <td>${lostFlagged(r) ? `<span class="flag missing ff-badge${lostFilter==='flagged'?' ff-on':''}" data-lf="flagged">${r.lostCode ? 'No reason code' : 'No lost code'}</span>` : '<span class="flag ok">Both set</span>'}</td>
          <td>${r.quoteNo}<br/><span style="color:var(--text-muted);font-size:11px">${r.dueDate || '\u2014'}</span></td>
          <td>${r.customer}<br/><span style="color:var(--text-muted);font-size:11px">${r.custNo}</span></td>
          <td>${r.owner}</td>
          <td>${fmt$(r.quoteTotal)}</td>
          <td><span class="flag lost ff-badge${lostFilter==='code:'+r.lostCode?' ff-on':''}" data-lf="code:${r.lostCode}">${r.lostCode || '\u2014'}</span></td>
          <td>${r.reasonCode ? r.reasonCode : '<span style="color:var(--red);font-weight:600">blank</span>'}</td>
          <td><span class="badge">${r.status}</span></td>
        </tr>`).join('') : '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px">No quotes match this filter.</td></tr>'}
      </tbody>
    </table></div>
  `;
  panel.querySelectorAll('[data-lf]').forEach(el => {
    el.addEventListener('click', () => {
      const k = el.dataset.lf;
      if (k === 'all') { lostFilter = null; }
      else { lostFilter = (lostFilter === k) ? null : k; } // click again to toggle off
      renderLost();
    });
  });
  const c = panel.querySelector('.lf-clear');
  if (c) c.addEventListener('click', () => { lostFilter = null; renderLost(); });
}

let conversionDateFilter = { from: '', to: '' };

function renderConversion() {
  const panel = document.getElementById('panel-conversion');

  // combine active + archive, tag each with outcome
  const activeRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => activeRows.push({q, l, outcome:'Open', edit:getEdit(lineKey(q,l))})));
  const archiveRows = [];
  ARCHIVE.forEach(q => q.lines.forEach(l => archiveRows.push({q, l, outcome:q.outcome, edit:{quoteType:''}})));
  let allRows = activeRows.concat(archiveRows);

  // date range filter on dueDate
  if (conversionDateFilter.from) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate >= conversionDateFilter.from);
  if (conversionDateFilter.to) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate <= conversionDateFilter.to);

  const wonRows = allRows.filter(r => r.outcome === 'Won');
  const wonValue = wonRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const totalValue = allRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const wonQuoteNos = new Set(ARCHIVE.filter(q=>q.outcome==='Won').map(q=>q.quoteNo));
  const totalQuoteNos = new Set([...QUOTES.map(q=>q.quoteNo), ...ARCHIVE.map(q=>q.quoteNo)]);

  // rep leaderboard: most quoted (all-time, all statuses) + win rate
  const byRep = {};
  allRows.forEach(({q,l,outcome}) => {
    byRep[q.owner] = byRep[q.owner] || {quotedLines:0, quotedValue:0, wonLines:0, wonValue:0, quoteNos:new Set()};
    byRep[q.owner].quotedLines += 1;
    byRep[q.owner].quotedValue += l.lineAmount;
    byRep[q.owner].quoteNos.add(q.quoteNo);
    if (outcome === 'Won') { byRep[q.owner].wonLines += 1; byRep[q.owner].wonValue += l.lineAmount; }
  });
  const repRows = Object.entries(byRep).map(([rep,d]) => ({
    rep, quotes: d.quoteNos.size, quotedValue: d.quotedValue,
    winRateValue: d.quotedValue ? (d.wonValue/d.quotedValue*100) : 0,
    wonValue: d.wonValue
  })).sort((a,b) => b.quotedValue - a.quotedValue);

  // conversion by quote type (Bid/Buy/blank)
  const byType = {};
  allRows.forEach(({l,edit,outcome}) => {
    const t = edit.quoteType || '(not set)';
    byType[t] = byType[t] || {quoted:0, won:0};
    byType[t].quoted += l.lineAmount;
    if (outcome === 'Won') byType[t].won += l.lineAmount;
  });

  // conversion by classification
  const byClass = {};
  allRows.forEach(({l,outcome}) => {
    byClass[l.itemClassification] = byClass[l.itemClassification] || {quoted:0, won:0};
    byClass[l.itemClassification].quoted += l.lineAmount;
    if (outcome === 'Won') byClass[l.itemClassification].won += l.lineAmount;
  });

  const pct = (num, den) => den ? ((num/den)*100).toFixed(1)+'%' : '\u2014';

  panel.innerHTML = `
    <div class="section-title">Conversion</div>
    <div class="section-sub">Active + Archive combined. Date range filters by Due Date (the closest proxy available to a true quote-creation date in this pull). <b>Read the win rate below as a floor, not a measurement.</b> Only ${wonQuoteNos.size} quotes still carry the status "Converted to Order", because Business Central deletes a quote out of <code>salesQuotes</code> once it converts \u2014 1,037 of the 1,041 SQIE quotes that actually produced invoiced revenue for these accounts are gone from that entity entirely. The real figure, read from <code>invoices.quoteNo</code> instead of the status field: <b>1,041 SQIE quotes have produced $3,203,985 of invoiced revenue since April 2026</b>, against 736 still open \u2014 roughly 59% of everything visible. The prior build's "0.33% conversion" was an artifact of counting the stragglers; it is corrected in Data Quality. The tables below still only see the status field, so treat them as directional until this view is rebuilt on the invoice link.</div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted)">DATE RANGE (Due Date):</span>
      <label style="font-size:12px;color:var(--text-muted)">From <input type="date" id="conv-date-from" value="${conversionDateFilter.from}" style="margin-left:4px"/></label>
      <label style="font-size:12px;color:var(--text-muted)">To <input type="date" id="conv-date-to" value="${conversionDateFilter.to}" style="margin-left:4px"/></label>
      ${(conversionDateFilter.from||conversionDateFilter.to) ? `<a href="#" id="conv-date-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear</a>` : ''}
    </div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total tracked value</div></div>
      <div class="kpi"><div class="val">${fmt$(wonValue)}</div><div class="lbl">Won value</div></div>
      <div class="kpi"><div class="val">${pct(wonValue,totalValue)}</div><div class="lbl">$ conversion (Won \u00f7 total)</div></div>
      <div class="kpi"><div class="val">${wonQuoteNos.size}</div><div class="lbl">Won quotes</div></div>
    </div>

    <div class="card">
      <b style="font-size:13px">Rep leaderboard \u2014 most quoted &amp; win rate by value</b>
      <table style="margin-top:8px"><thead><tr><th>Rep</th><th>Quotes</th><th>Quoted Value</th><th>Won Value</th><th>Win Rate ($)</th></tr></thead>
      <tbody>${repRows.map(r=>`<tr><td>${r.rep}</td><td>${r.quotes}</td><td>${fmt$(r.quotedValue)}</td><td>${fmt$(r.wonValue)}</td><td>${r.winRateValue.toFixed(1)}%</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Quote Type</b>
      <table style="margin-top:8px"><thead><tr><th>Quote Type</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byType).sort((a,b)=>b[1].quoted-a[1].quoted).map(([t,d])=>`<tr><td><span class="badge">${t}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Classification (Existing / Winback / New Business)</b>
      <table style="margin-top:8px"><thead><tr><th>Classification</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byClass).sort((a,b)=>b[1].quoted-a[1].quoted).map(([c,d])=>`<tr><td><span class="badge">${c}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="roadmap-card" style="margin-top:14px"><b>Why there's still no "Lost" conversion rate</b>Re-verified 2026-10-03 across every quote on all 133 accounts: ${LOST_QUOTES.length} carry a lostCode and <b>not one is closed</b> \u2014 they all still read "Quote Issued", "Quote WIP" or "Pending Approval". None of them produced an invoice either, so the codes are accurate; only the closing step is missing. A true Lost rate needs reps to actually close quotes out in BC. See the Lost Quotes tab and Data Quality.</div>
  `;
  document.getElementById('conv-date-from').addEventListener('change', e => { conversionDateFilter.from = e.target.value; renderConversion(); });
  document.getElementById('conv-date-to').addEventListener('change', e => { conversionDateFilter.to = e.target.value; renderConversion(); });
  const clearBtn = document.getElementById('conv-date-clear');
  if (clearBtn) clearBtn.addEventListener('click', (e) => { e.preventDefault(); conversionDateFilter = {from:'',to:''}; renderConversion(); });
}

function funnelStage(q) {
  if (q.invoiced) return { label: 'Shipped/Invoiced', color: '#D9EAD3' };
  if (q.orderExists) return { label: 'Order Created \u2014 not yet shipped', color: '#FFF3CD' };
  return { label: 'Won (order not found)', color: '#D9EAD3' };
}

function buildCoachingPanel(q) {
  const edit0 = getEdit(lineKey(q, q.lines[0]));
  const topLine = q.lines.slice().sort((a,b)=>b.lineAmount-a.lineAmount)[0];
  const fu = q.followUpDate ? daysBetween(q.followUpDate) : null;

  const qQuestions = [];
  qQuestions.push(edit0.quoteType ? `Confirmed as a <b>${edit0.quoteType}</b> \u2014 does the evidence on file still support that?` : `Is this a <b>Bid or a Buy</b>? Quote Type isn't set yet.`);
  qQuestions.push(q.classification === 'Winback' || q.lines.some(l=>l.itemClassification==='Winback') ? `This has Winback lines \u2014 what changed, and why did we stop getting this business?` : `What's the project or application driving this quote? (Confirm [Application/Project] with the customer \u2014 not captured in this pull.)`);
  qQuestions.push(`When is the expected award date? Expiration on file is <b>${q.expirationDate}</b>.`);

  const uQuestions = [];
  uQuestions.push(`How will ${q.customer} decide who wins this? Confirm price vs. other criteria with the customer.`);
  uQuestions.push(topLine.stock === 0 ? `Top line (<b>${topLine.item}</b>) shows <b>zero stock</b> \u2014 confirm lead time before presenting.` : `Stock on the top line (<b>${topLine.item}</b>) is ${topLine.stock}. Confirm that still covers the quoted quantity.`);

  const oQuestions = [];
  oQuestions.push(`Have all lines worth escalating been reviewed? Highest-value line here is <b>${fmt$(topLine.lineAmount)}</b> (${topLine.item}).`);
  if (q.moreLinesValue) oQuestions.push(`${fmt$(q.moreLinesValue)} on this quote isn't itemized in this view (freight or lines outside this pull) \u2014 confirm the full picture in BC directly.`);

  const tQuestions = [];
  tQuestions.push(`What's the value story beyond price for ${q.customer}? (Availability, lead time, support \u2014 confirm which applies with the customer.)`);

  const eQuestions = [];
  eQuestions.push(fu === null ? `<b>No Follow Up Date set.</b> Establish one before the next contact \u2014 never leave without a scheduled next step.` : fu < 0 ? `Follow-up is <b>overdue by ${Math.abs(fu)} day${Math.abs(fu)===1?'':'s'}</b>. What's the next action, and by when?` : fu === 0 ? `Follow-up is <b>due today</b>. What's the next action?` : `Follow-up scheduled for ${q.followUpDate}. Confirm that's still the right date.`);
  eQuestions.push(`Has the outcome been documented? Current BC status: <b>${q.status}</b>.`);

  return `
    <div class="card" style="margin-top:18px;background:var(--cream)">
      <b style="font-size:13px;color:var(--nav)">QUOTE + VALUE coaching \u2014 grounded in what's on file for this quote</b>
      <div class="section-sub" style="margin-top:4px">Phrased as questions to confirm with the customer or in BC \u2014 nothing here is invented.</div>
      <div style="margin-top:10px;font-size:12px">
        <div style="margin-bottom:8px"><b>Q \u2014 Qualify</b><ul style="margin:4px 0 0 18px">${qQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>U \u2014 Understand</b><ul style="margin:4px 0 0 18px">${uQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>O \u2014 Optimize</b><ul style="margin:4px 0 0 18px">${oQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>T \u2014 Tailor</b><ul style="margin:4px 0 0 18px">${tQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><b>E \u2014 Execute</b><ul style="margin:4px 0 0 18px">${eQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
    </div>
  `;
}

function renderManager() {
  const panel = document.getElementById('panel-manager');
  const byOwner = {};
  QUOTES.forEach(q => {
    byOwner[q.owner] = byOwner[q.owner] || { value: 0, count: 0, overdue: 0, missingFU: 0, zeroActivity: 0 };
    byOwner[q.owner].value += q.quoteTotal;
    byOwner[q.owner].count += 1;
    if (q.followUpDate && daysBetween(q.followUpDate) < 0) byOwner[q.owner].overdue += 1;
    if (!q.followUpDate) byOwner[q.owner].missingFU += 1;
  });
  const activeCustNos = new Set(QUOTES.map(q => q.custNo));
  ALL_ACCOUNTS.forEach(a => { if (!activeCustNos.has(a.custNo)) { byOwner[a.owner] = byOwner[a.owner] || { value:0, count:0, overdue:0, missingFU:0, zeroActivity:0 }; byOwner[a.owner].zeroActivity += 1; } });
  const repRows = Object.entries(byOwner).sort((a,b)=>b[1].value-a[1].value);

  // exception-based coaching queue: every line with at least one real flag, ranked by severity then value
  let queueRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => {
    const edit = getEdit(lineKey(q,l));
    const flags = computeFlags(q, edit);
    if (flags.length) queueRows.push({q, l, flags});
  }));
  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  queueRows.sort((a,b) => rank(a.flags)-rank(b.flags) || b.l.lineAmount-a.l.lineAmount);

  const totalQueueRows = queueRows.length;
  let mfLabel = '';
  if (managerFilter && managerFilter.startsWith('rep:')) {
    const who = managerFilter.slice(4);
    queueRows = queueRows.filter(({q}) => q.owner === who);
    mfLabel = who;
  } else if (managerFilter && FLAG_FILTERS[managerFilter]) {
    queueRows = queueRows.filter(({q,l}) => FLAG_FILTERS[managerFilter].test(q, l, getEdit(lineKey(q,l))));
    mfLabel = FLAG_FILTERS[managerFilter].label;
  }
  const topQueue = managerFilter ? queueRows.slice(0, 60) : queueRows.slice(0, 15);
  const queueValue = queueRows.reduce((sum,r)=>sum+r.l.lineAmount, 0);

  panel.innerHTML = `
    <div class="section-title">Manager View</div>
    <div class="section-sub">Team rollup and exception-based coaching queue across Adam, Kelli, Jerik, and Spencer's assigned accounts.</div>
    <div class="card">
      <b style="font-size:13px">Team rollup by rep</b>
      <table style="margin-top:10px"><thead><tr><th>Rep</th><th>$5K+ Quotes</th><th>Active Value</th><th>Overdue</th><th>Missing Follow-Up</th><th>Zero-Activity Accounts</th></tr></thead>
      <tbody>${repRows.map(([owner,d])=>`<tr><td><a href="#" class="mgr-filter" data-mf="rep:${owner}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${owner}</a></td><td>${d.count}</td><td>${fmt$(d.value)}</td><td>${d.overdue ? '<span class="flag overdue ff-badge'+(managerFilter==='overdue'?' ff-on':'')+'" data-mf="overdue">'+d.overdue+'</span>' : '0'}</td><td>${d.missingFU ? '<span class="flag missing ff-badge'+(managerFilter==='missingfu'?' ff-on':'')+'" data-mf="missingfu">'+d.missingFU+'</span>' : '0'}</td><td>${d.zeroActivity || 0}</td></tr>`).join('')}</tbody></table>
      <div style="font-size:11px;color:var(--text-muted);margin-top:8px">Rep names and the red/amber counts are clickable &mdash; they filter the coaching queue below. Click the same one again to clear.</div>
    </div>
    <div class="qoc-kpis">
      <div class="kpi clickable warn ${managerFilter==='overdue'?'kpi-on':''}" data-mf="overdue"><div class="val">${QUOTES.filter(q=>q.followUpDate && daysBetween(q.followUpDate)<0).length}</div><div class="lbl">Overdue quotes</div></div>
      <div class="kpi clickable warn ${managerFilter==='missingfu'?'kpi-on':''}" data-mf="missingfu"><div class="val">${QUOTES.filter(q=>!q.followUpDate).length}</div><div class="lbl">No follow-up date</div></div>
      <div class="kpi clickable warn ${managerFilter==='expired'?'kpi-on':''}" data-mf="expired"><div class="val">${QUOTES.filter(q=>q.expirationDate && daysBetween(q.expirationDate)<0).length}</div><div class="lbl">Past expiration</div></div>
      <div class="kpi clickable warn ${managerFilter==='lostcode'?'kpi-on':''}" data-mf="lostcode"><div class="val">${QUOTES.filter(q=>q.lostCode).length}</div><div class="lbl">Lost code, still open</div></div>
      <div class="kpi clickable ${managerFilter==='ownermismatch'?'kpi-on':''}" data-mf="ownermismatch"><div class="val">${QUOTES.filter(q=>normalizeOwner(q.owner)!==q.bcSalesperson).length}</div><div class="lbl">Owner &ne; BC rep</div></div>
      <div class="kpi clickable ${managerFilter==='zerostock'?'kpi-on':''}" data-mf="zerostock"><div class="val">${QUOTES.reduce((n,q)=>n+q.lines.filter(l=>l.stock===0).length,0)}</div><div class="lbl">Lines at zero stock</div></div>
    </div>
    ${managerFilter ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#FFF3E8;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;">
      <span style="font-size:12px;font-weight:700;color:var(--accent)">Showing: ${mfLabel} (${queueRows.length} flagged lines)</span>
      <span style="font-size:11px;color:var(--text-muted)">${fmt$(queueValue)} of line value</span>
      <button class="mf-clear" title="Clear filter" style="margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:6px;width:20px;height:20px;line-height:1;cursor:pointer;font-size:13px;">&times;</button>
    </div>` : ''}
    <div class="card">
      <b style="font-size:13px">Coaching queue &mdash; exceptions only, highest dollar value first (showing ${topQueue.length} of ${queueRows.length}${managerFilter ? ' filtered' : ''}, out of ${totalQueueRows} flagged lines)</b>
      <div class="section-sub" style="margin-top:4px">The 5 Manager Review questions: (1) Is this a Bid or a Buy, and what's the evidence? (2) How will the customer decide who wins? (3) What supports the pricing or discount being asked? (4) What's the story and value proposition? (5) What's the next action, by when, and what outcome are we trying to achieve?</div>
      ${topQueue.map(({q,l,flags}) => `
        <div style="border-top:1px solid var(--border);padding:10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <a href="#" class="mgr-quote-link" data-quote="${q.quoteNo}" data-line="${l.lineNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.customer}</a>
            &mdash; ${q.quoteNo} &mdash; ${fmt$(l.lineAmount)} (${l.item}) &mdash; ${q.owner}<br/>
            <span style="font-size:12px;color:var(--text-muted)">Follow-up: ${q.followUpDate || 'none set'} (${q.followUpCode||'no code'}) &middot; Classification: ${l.itemClassification} &middot; Quote Type: ${getEdit(lineKey(q,l)).quoteType || 'not set'}</span>
          </div>
          <div style="text-align:right;white-space:nowrap">${flags.map(f=>`<span class="flag ${f.cls}">${f.label}</span>`).join(' ')}</div>
        </div>`).join('')}
    </div>
  `;
  panel.querySelectorAll('.mgr-quote-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.quote, Number(a.dataset.line)); });
  });
  panel.querySelectorAll('[data-mf]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.preventDefault();
      const k = el.dataset.mf;
      managerFilter = (managerFilter === k) ? null : k; // click again to toggle off
      renderManager();
    });
  });
  const mfc = panel.querySelector('.mf-clear');
  if (mfc) mfc.addEventListener('click', () => { managerFilter = null; renderManager(); });
}

    byCust[q.custNo].lineCount += q.lines.length;
    byCust[q.custNo].quotedValue += q.quoteTotal;
    byCust[q.custNo].quoteNos.add(q.quoteNo);
  });
  ARCHIVE.forEach(q => {
    byCust[q.custNo] = byCust[q.custNo] || { name: q.customer, owner: q.owner, lineCount: 0, quotedValue: 0, wonValue: 0, quoteNos: new Set() };
    byCust[q.custNo].lineCount += q.lines.length;
    byCust[q.custNo].quotedValue += q.quoteTotal;
    byCust[q.custNo].quoteNos.add(q.quoteNo);

      <div style="margin-bottom:10px;font-size:12px;color:var(--text-muted)">By owner: ${Object.entries(zeroByOwner).sort((a,b)=>b[1]-a[1]).map(([o,c])=>`${o}: <b>${c}</b>`).join(' &nbsp;|&nbsp; ')}</div>
      <div style="max-height:320px;overflow-y:auto">

function renderDQ() {
  const panel = document.getElementById('panel-dq');
  const issues = [];

  // --- per-quote issues, computed live from this pull ---
  QUOTES.forEach(q => {
    if (!q.followUpDate) issues.push({sev:'high', text:`${q.quoteNo} (${q.customer}, ${fmt$(q.quoteTotal)}) has no Follow Up Date set at all.`});
    if (q.followUpDate && !q.followUpCode) issues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has a Follow Up Date but no Follow Up Code set.`});
    if (!q.followUpSalesperson) issues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has no Follow Up Salesperson assigned.`});
    if (normalizeOwner(q.owner) !== q.bcSalesperson) issues.push({sev:'high', text:`${q.quoteNo} (${q.customer}) is owned by ${q.owner} on the account package, but BC's Salesperson Code is ${q.bcSalesperson} — worth confirming who's actually working this.`});
  });

  // --- structural findings, re-verified 2026-10-03 ---
  const findings = [
    {sev:'high', when:'NEW', title:'"Converted to Order" is not a Won archive — converted quotes are deleted out of salesQuotes entirely',
     text:`Evidence from this pull: <b>1,041 distinct SQIE quote numbers</b> on the team's 133 accounts appear as the <code>quoteNo</code> on a posted invoice since April 2026, totalling <b>$3,203,985</b> of real invoiced revenue. Of those 1,041, only <b>4</b> are still present in the <code>salesQuotes</code> entity at all — the other <b>1,037 are gone from it completely</b>. So <code>salesQuotes</code> holds open work plus a handful of stragglers; it is not where won business lives. This is why the prior build's headline ("$30,609.74 of confirmed Won vs. $9.34M of revenue — 0.33%") read as a catastrophic conversion failure: it was counting the stragglers. It was a measurement artifact, not a sales problem. <b>The reliable Won signal is <code>invoices.quoteNo</code>, not the quote's own status field.</b> Counting what is visible: 1,041 SQIE quotes converted to invoiced revenue versus 736 still open for these accounts — roughly 59% of all SQIE quotes we can see for this team have produced invoiced revenue.`},

    {sev:'high', when:'STILL TRUE', title:'Lost quotes are still never formally closed — now measured across the whole roster',
     text:`Re-verified and now quantified over every quote on all 133 accounts, not a sample. <b>${LOST_QUOTES.length} quotes carry a lostCode</b> (DEMANDCHG ${LOST_QUOTES.filter(r=>r.lostCode==='DEMANDCHG').length}, NORESPX4 ${LOST_QUOTES.filter(r=>r.lostCode==='NORESPX4').length}, PROJ-LOST ${LOST_QUOTES.filter(r=>r.lostCode==='PROJ-LOST').length}, BUDGETARY ${LOST_QUOTES.filter(r=>r.lostCode==='BUDGETARY').length} and nine other codes). <b>Not one of them is closed:</b> ${LOST_QUOTES.filter(r=>r.status==='Quote Issued').length} still read "Quote Issued", ${LOST_QUOTES.filter(r=>r.status==='Quote WIP').length} read "Quote WIP", ${LOST_QUOTES.filter(r=>r.status==='Pending Approval').length} reads "Pending Approval". Cross-checked the other way as well: <b>zero</b> of these ${LOST_QUOTES.length} quotes produced an invoice, so the lost codes are accurate — the business really is dead. Only the closing step is missing. Still a process fix, not a data fix. See the Lost Quotes tab.`},

    {sev:'high', when:'NEW', title:'Every single lost-coded quote has a blank Reason Code',
     text:`<b>${LOST_QUOTES.filter(r=>r.lostCode && !r.reasonCode).length} of ${LOST_QUOTES.length}</b> — 100% — have <code>lostCode</code> populated and <code>reasonCode</code> completely blank. The reverse case (reason code set, lost code blank) occurs <b>${LOST_QUOTES.filter(r=>r.reasonCode && !r.lostCode).length}</b> times. Across all 736 quotes pulled for these accounts, <code>reasonCode</code> is populated exactly <b>zero</b> times. Either the field is not being used at all or it is not wired into the entry screen reps actually see — worth one question to the BC admin before asking reps to fill it in.`},

    {sev:'high', when:'NEW', title:'Not one active $5K+ quote has a follow-up date in the future',
     text:`Of the ${QUOTES.length} active $5,000+ quotes, <b>${QUOTES.filter(q=>q.followUpDate && daysBetween(q.followUpDate)<0).length} are overdue</b> (median ${(() => { const d = QUOTES.filter(q=>q.followUpDate).map(q=>-daysBetween(q.followUpDate)).sort((a,b)=>a-b); return d.length ? d[Math.floor(d.length/2)] : 0; })()} days past, oldest ${(() => { const d = QUOTES.filter(q=>q.followUpDate).map(q=>q.followUpDate).sort(); return d[0] || '—'; })()}) and <b>${QUOTES.filter(q=>!q.followUpDate).length} have no follow-up date at all</b>. ${QUOTES.filter(q=>q.followUpDate && daysBetween(q.followUpDate)===0).length} are due today. That accounts for all ${QUOTES.length} — the latest follow-up date anywhere in the active book is ${(() => { const d = QUOTES.filter(q=>q.followUpDate).map(q=>q.followUpDate).sort(); return d[d.length-1] || '—'; })()}, which is already in the past. Separately, <b>${QUOTES.filter(q=>q.expirationDate && daysBetween(q.expirationDate)<0).length} of ${QUOTES.length}</b> are past their own expiration date and still sitting open.`},

    {sev:'high', when:'NEW', title:'Quantity-break tiers are inflating the pipeline by $1.83M',
     text:`Ten quotes price the same part at several quantity breaks on separate lines — the customer will buy one tier, not all of them, but BC's quote <code>amount</code> sums every line. Worst case: <b>SQIE0029470 (Anduril Industries)</b> quotes TRD695DSZ-BLK-7 at 5,000 / 10,000 / 15,000 / 20,000 / 25,000 units for a headline total of <b>$2,519,335</b>, of which <b>$1,694,420 is the same part counted again</b>. Same pattern on SQIE0014361 (Epic Technologies, SDG400XS ×5 tiers, $37,887 duplicated), SQIE0032479, SQIE0028890, SQIE0026377, SQIE0010681, SQIE0030543, SQIE0010565, SQIE0024994 and SQIE0015117. Total overstatement across the ten: <b>$1,828,025</b>. The ${fmt$(QUOTES.reduce((a,q)=>a+q.quoteTotal,0))} headline active pipeline is realistically about <b>$5.6M</b>. Nothing was dropped from this view — the lines are genuine — but anyone quoting the pipeline number to leadership should net the tiers out first.`},

    {sev:'high', when:'NEW', title:'$1.98M of the "active" pipeline is already flagged dead',
     text:`<b>${QUOTES.filter(q=>q.lostCode).length} of the ${QUOTES.length}</b> active $5K+ quotes, worth <b>${fmt$(QUOTES.filter(q=>q.lostCode).reduce((a,q)=>a+q.quoteTotal,0))}</b>, carry a lostCode while still showing an open status. They are counted as active here because BC says they are open — that is the honest read of the source — but they are flagged with a purple "Lost code" badge in every table, and the "Lost code set" tile filters straight to them. Clearing these in BC would cut the reported pipeline by about a quarter and make the rest of these numbers trustworthy.`},

    {sev:'high', when:'CHANGED', title:'The connector row cap is 2,500, not 2,000 — and it still fails silently',
     text:`Measured directly this pull: a broad <code>invoices</code> query returned exactly <b>2,500 rows</b> and stopped, with no error and no <code>@odata.nextLink</code>. Running it <code>$orderby=documentDate asc</code> and <code>desc</code> returned 2,500 each with <b>zero overlap</b> — together covering 2023-01-03 to 2023-02-17 and 2026-08-13 to 2026-10-02, and <b>silently omitting everything between 2023-02-17 and 2026-08-13</b>. That is the failure mode in one picture: it looks like a complete answer. Every pull behind this refresh was therefore filtered per rep against that rep's own account list. Row counts came back at Adam 219, Jerik 194, Kelli 179, Spencer 144 — all far under the cap, so nothing was truncated this time.`},

    {sev:'high', when:'BLOCKED', title:'Classification could not be refreshed — PowerBI connector not authorised',
     text:`The SalesModel semantic model (GUID bce6ee25-e19f-4b95-acdd-01ed7d1e666a) drives the Existing / Winback / New Business split and the "days since this customer last ordered this part" figures. The PowerBI connector required an interactive sign-in this session and could not be reached, so <b>no classification figure in this app was refreshed on 2026-10-03.</b> What you are seeing: last-order dates carried forward from the 2026-08-05 pull, with days-since recomputed against today — accurate for the ${QUOTES.filter(q=>q.classification!=='Data unavailable').length} quotes that had a prior reading, and shown as <b>"Data unavailable"</b> on the other ${QUOTES.filter(q=>q.classification==='Data unavailable').length} rather than guessed. Because any order placed since 2026-08-05 is invisible to this carry-forward, the bias runs one way: a customer may be shown as staler than they really are, never fresher. <b>The Winback and Repeated No-Win tabs are therefore reading partly stale input and should not be worked from until PowerBI is reconnected.</b>`},

    {sev:'med', when:'STILL TRUE', title:'"Converted to Order" still does not mean shipped — and absence from salesOrders does not mean not shipped',
     text:`Of the ${ARCHIVE.length} quotes currently showing "Converted to Order", ${ARCHIVE.filter(q=>q.invoiced).length} are invoiced and ${ARCHIVE.filter(q=>!q.invoiced).length} have an order created but nothing shipped. New wrinkle found this pull: <b>SQIE0015839 and SQIE0025898 returned nothing from <code>salesOrders</code> at all</b>, which on the prior build's logic would have read as "Won, order not found". Checking <code>invoices.quoteNo</code> showed both are fully invoiced (IESIN1076443 on 2026-09-10, IESIN1066590 on 2026-08-26) — completed orders drop out of the <code>salesOrders</code> list. Reading <code>salesOrders.shipped</code> alone understates fulfilment; this build now treats an invoice as proof of shipment. Also seen: SQIE0021139 split into two orders (SOIE0029271 and SOIE0029272) off one quote, so quote-to-order is not always one-to-one.`},

    {sev:'med', when:'STILL TRUE', title:'The SQ / SQIE legacy split is real and the legacy tail is winding down',
     text:`Confirmed again, and now with a fuller date range. <b>${LEGACY_WON.length} invoices</b> for the team's accounts, worth <b>${fmt$(LEGACY_WON.reduce((a,w)=>a+w.amount,0))}</b>, posted between ${LEGACY_WON[0].documentDate} and ${LEGACY_WON[LEGACY_WON.length-1].documentDate} against old "SQ"-numbered quotes from before the upgrade. The monthly shape tells the story: Jan 256 invoices, Feb 283, Mar 280, Apr 274 — then May 103, Jun 70, Jul 40, Aug 20, Sep 22, Oct 1. The pre-upgrade backlog is genuinely clearing. Over the same window, SQIE-quoted invoices run the other way: Apr 97, May 241, Jun 289, Jul 274, Aug 268, Sep 287. New-system business has fully taken over; the prior build's reading that legacy was masking a failing new process no longer holds, and on this evidence never did.`},

    {sev:'med', when:'NEW', title:'Owner vs. BC salesperson disagrees on half the book',
     text:`<b>${QUOTES.filter(q=>normalizeOwner(q.owner)!==q.bcSalesperson).length} of ${QUOTES.length}</b> active $5K+ quotes (${Math.round(QUOTES.filter(q=>normalizeOwner(q.owner)!==q.bcSalesperson).length/QUOTES.length*100)}%) have a BC Salesperson Code that is not the rep who owns the account on the July 2026 account package. Frequent stand-ins: SBOYDEN, LMENDENHAL, JNORMAND, JSIELICKI, KAGUIRRE, SNUTTER. Two different things are probably mixed in here — genuine shared coverage, and quotes raised by whoever happened to pick up the phone — and they need different fixes. The "Owner &ne; BC rep" tile filters to them.`},

    {sev:'med', when:'STILL TRUE', title:'Customer number collisions in SalesModel',
     text:`Carried forward from the prior pull and not re-testable this session (PowerBI unavailable): C132371 resolved to both "Epirus" (active) and an unrelated dormant "Environmental Dimensions Inc" (last order 2017); C129074 to both "Anduril Industries" and a dormant "Hope College" record. Any join on customer number alone, without also checking the name, risks silently picking the wrong record. Both customers carry live quotes in this refresh, so this still matters.`},

    {sev:'med', when:'NEW', title:'Nearly half of all quoted lines show zero stock',
     text:`<b>${QUOTES.reduce((n,q)=>n+q.lines.filter(l=>l.stock===0).length,0)} of ${QUOTES.reduce((n,q)=>n+q.lines.length,0)}</b> displayed lines show zero on-hand inventory. That is not automatically a problem — plenty of these are made-to-order or drop-ship — but it does mean a lead-time answer is needed before most of these quotes can be closed, and it is worth knowing before a rep promises a date on a call.`}
  ];

  const sevColor = x => x === 'high' ? 'var(--red)' : 'var(--yellow)';
  const whenColor = w => w === 'NEW' ? 'var(--accent)' : w === 'CHANGED' ? 'var(--yellow)' : w === 'BLOCKED' ? 'var(--red)' : 'var(--gray)';

  panel.innerHTML = `
    <div class="section-title">Data Quality</div>
    <div class="section-sub">Refreshed 2026-10-03. Everything below was measured in this pull, with the evidence shown rather than just the conclusion. Tags: <b style="color:var(--accent)">NEW</b> found this cycle &middot; <b style="color:var(--yellow)">CHANGED</b> prior finding revised &middot; <b style="color:var(--gray)">STILL TRUE</b> re-verified &middot; <b style="color:var(--red)">BLOCKED</b> could not be checked. These are fixes for Business Central and for team process — not for this app.</div>
    <div class="card">
      ${findings.map(f => `<div class="dq-item">
        <div style="margin-bottom:4px">
          <span class="dq-sev" style="background:${sevColor(f.sev)}">${f.sev.toUpperCase()}</span>
          <span class="dq-sev" style="background:${whenColor(f.when)}">${f.when}</span>
          <b>${f.title}</b>
        </div>
        <div style="color:var(--text);line-height:1.5">${f.text}</div>
      </div>`).join('')}
    </div>
    <div class="card">
      <b style="font-size:13px">Per-quote field gaps in this pull (${issues.length})</b>
      <div class="section-sub" style="margin-top:4px">Individual records missing a field. These are the rows behind the counts above.</div>
      <div style="max-height:380px;overflow-y:auto;margin-top:8px">
        ${issues.map(i => `<div class="dq-item"><span class="dq-sev" style="background:${sevColor(i.sev)}">${i.sev.toUpperCase()}</span>${i.text}</div>`).join('') || '<div class="dq-item">No issues found in this snapshot.</div>'}
      </div>
    </div>
    <div class="card">
      <b style="font-size:13px">Known unavailable fields (not invented)</b>
      <div class="dq-item">"Describe the Opportunity" — not present on salesHeader2 in this BC instance.</div>
      <div class="dq-item">Customer Part No., NCNR/freight flags, brand/region/department fields — not present on salesQuoteLine; these only appear once a quote converts to salesOrderLine.</div>
      <div class="dq-item">Demand Creation flag — no reliable connected source yet.</div>
      <div class="dq-item"><code>reasonCode</code> — present on the entity, but populated on zero of the 736 quotes pulled.</div>
      <div class="dq-item">Fresh classification / last-order history — requires the PowerBI SalesModel connector, not authorised this session.</div>
    </div>
  `;
}

function renderRoadmap() {
  const panel = document.getElementById('panel-roadmap');
  panel.innerHTML = `
    <div class="section-title">Roadmap</div>
    <div class="section-sub">Built so far: Queue, Rep View, dropdown filters (Quote Type, Classification, Customer) plus clickable KPI/flag filters across Queue, Rep View, Manager View and Lost Quotes, Stock, quote-line drill-down, customer drill-down, item-level classification, Winback, Repeated No-Win, Lost Quotes, Conversion with date range and rep leaderboard, Customers (including zero-activity accounts), exception-based Manager coaching queue, QUOTE+VALUE coaching panel, Archive, Data Quality.</div>
    <div class="roadmap-grid">
      <div class="roadmap-card"><b style="color:var(--red)">Reconnect PowerBI \u2014 blocking</b>The SalesModel connector was not authorised for the 2026-10-03 refresh, so classification, Winback and Repeated No-Win are all running on carried-forward data. This is the single highest-value fix: two whole tabs are currently unsafe to work from.</div>
      <div class="roadmap-card"><b>Rebuild Conversion on the invoice link</b>Won should be computed from <code>invoices.quoteNo</code>, not the quote status field, which loses 1,037 of 1,041 real conversions. The data is already reachable through the same connector; it needs an embedded array and a reworked Archive/Conversion view.</div>
      <div class="roadmap-card"><b>Net quantity-break tiers out of the pipeline total</b>Ten quotes count the same part at several quantity breaks, overstating the active pipeline by $1.83M. Needs a rule for collapsing tier lines to one representative line, agreed with the team — probably the tier the rep expects to land.</div>
      <div class="roadmap-card"><b>Real Lost tracking</b>Needs a BC process change (closing quotes as Lost) and a wired-up <code>reasonCode</code> field \u2014 it is populated on zero of 736 quotes. Not something this app can fix on its own.</div>
      <div class="roadmap-card"><b>Broader Repeated No-Win detection</b>Still limited to what is visible across active quotes in this snapshot; a full historical quote log would catch more genuine repeat-and-lose patterns.</div>
      <div class="roadmap-card"><b>Multi-filter and saved views</b>The clickable filters are deliberately one-at-a-time for v1. Combining them (overdue AND zero stock, say), and letting a rep save their own view, is the obvious next step.</div>
    </div>
  `;
}

document.querySelectorAll('.qoc-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.qoc-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['queue','reps','winback','norewin','lost','conversion','manager','customers','dq','archive','roadmap'].forEach(t => {
      document.getElementById('panel-'+t).style.display = (t === btn.dataset.tab) ? 'block' : 'none';
    });
  });
});

document.getElementById('snapshot-note').innerHTML =
  "<b>Snapshot refreshed 2026-10-03</b> &mdash; " + QUOTES.length + " active $5,000+ quotes (" +
  fmt$(QUOTES.reduce((a,q)=>a+q.quoteTotal,0)) + " headline, realistically ~$5.6M once quantity-break tiers are netted out) across " +
  new Set(QUOTES.map(q=>q.custNo)).size + " of " + ALL_ACCOUNTS.length + " assigned accounts. Pulled per rep from Business Central Explorer, never as one broad query. " +
  "<b>" + (QUOTES.filter(q=>q.followUpDate && daysBetween(q.followUpDate)<0).length + QUOTES.filter(q=>!q.followUpDate).length) +
  " of these need a call today</b> (overdue or no follow-up date at all) and <b>" + LOST_QUOTES.length +
  " quotes across the roster carry a lost code with no reason code</b>. " +
  "<b>Classification was not refreshed this cycle</b> &mdash; the PowerBI SalesModel connector was not authorised, so Winback figures are carried forward from 2026-08-05. See Data Quality.";

(async () => {
  await loadEdits();
  renderQueue();
  renderReps();
  renderWinback();
  renderNoRewin();
  renderLost();
  renderConversion();
  renderManager();
  renderCustomers();
  renderDQ();
  renderArchive();
  renderRoadmap();
})();
</script>
