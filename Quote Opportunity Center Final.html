<style>
  :root {
    --bg: #FAF7F2;
    --nav: #2B2B2B;
    --accent: #C1541C;
    --card: #FFFFFF;
    --cream: #FFF9F2;
    --border: #E5DDD3;
    --text: #2B2B2B;
    --text-muted: #7A7267;
    --red: #C1392B;
    --orange: #C1541C;
    --yellow: #B8860B;
    --green: #4C7A3D;
    --gray: #9B9186;
  }
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #qoc { background: var(--bg); color: var(--text); border-radius: 12px; overflow: hidden; }
  .qoc-nav { background: var(--nav); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .qoc-nav .brand { font-weight: 700; font-size: 15px; margin-right: 16px; color: #fff; letter-spacing: 0.3px; }
  .qoc-tab { background: transparent; border: none; color: #cfc9c0; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .qoc-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .qoc-tab:hover:not(.active) { background: #3d3d3d; color: #fff; }
  .qoc-body { padding: 20px; }
  .qoc-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .val { font-size: 22px; font-weight: 700; color: var(--nav); }
  .kpi .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .kpi.warn .val { color: var(--red); }
  .kpi.clickable { cursor: pointer; transition: border-color .12s, box-shadow .12s, transform .12s; }
  .kpi.clickable:hover { border-color: var(--accent); box-shadow: 0 2px 6px rgba(193,84,28,0.18); transform: translateY(-1px); }
  .kpi.clickable .lbl::after { content: " \2022 filter"; color: var(--accent); font-weight: 600; opacity: 0; transition: opacity .12s; }
  .kpi.clickable:hover .lbl::after { opacity: 1; }
  .kpi.kpi-active { border-color: var(--accent); border-width: 2px; background: #FDF0E6; }
  .flag.flag-click { cursor: pointer; }
  .flag.flag-click:hover { filter: brightness(1.15); text-decoration: underline; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; }
  thead th { background: var(--cream); text-align: left; padding: 10px 8px; font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid var(--border); }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: #FFFBF6; }
  .flag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .flag.overdue { background: var(--red); }
  .flag.today { background: var(--orange); }
  .flag.missing { background: var(--yellow); }
  .flag.ok { background: var(--green); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: #EFE6DA; color: var(--nav); font-weight: 600; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 32px; }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--nav); }
  .section-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .dq-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .dq-item:last-child { border-bottom: none; }
  .dq-sev { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 8px; }
  .roadmap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .roadmap-card { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--text-muted); font-size: 12px; background: var(--cream); }
  .roadmap-card b { display: block; color: var(--nav); font-size: 13px; margin-bottom: 4px; }
  .save-status { font-size: 11px; color: var(--green); margin-left: 8px; }
  .refresh-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .snapshot-note { font-size: 11px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
</style>

const TODAY = new Date("2026-10-02");
const STORAGE_KEY = "qoc-line-edits-v1";
let editState = {}; // key: quoteNo|lineNo -> {quoteType, targetPrice, comments}

function lineKey(q, l) { return q.quoteNo + "|" + l.lineNo; }
function daysBetween(dateStr) {
  const d = new Date(dateStr);
  return Math.round((d - TODAY) / 86400000);
}
function fmt$(n) { return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }

function computeFlags(q, edit) {
  const flags = [];
  if (!q.followUpDate) { flags.push({label: "Missing Follow-Up Date", cls: "missing", key: "missingFU"}); }
  else {
    const fu = daysBetween(q.followUpDate);
    if (fu < 0) flags.push({label: "Overdue " + Math.abs(fu) + "d", cls: "overdue", key: "overdue"});
    else if (fu === 0) flags.push({label: "Due today", cls: "today", key: "today"});
  }
  if (!q.followUpCode) flags.push({label: "Missing Follow-Up Code", cls: "missing", key: "missingCode"});
  if (!q.followUpSalesperson) flags.push({label: "Missing Follow-Up Rep", cls: "missing", key: "missingRep"});
  const exp = daysBetween(q.expirationDate);
  if (exp >= 0 && exp <= 5) flags.push({label: "Expires in " + exp + "d", cls: "today", key: "expiring"});
  else if (exp < 0) flags.push({label: "Expired " + Math.abs(exp) + "d ago", cls: "overdue", key: "expired"});
  if (normalizeOwner(q.owner) !== q.bcSalesperson) {
    flags.push({label: "Owner \u2260 BC Salesperson", cls: "missing", key: "mismatch"});
  }
  if (q.lostCode) flags.push({label: "Lost code: " + q.lostCode, cls: "missing", key: "lostCoded"});
  if (q.tierOverstated > 0) flags.push({label: "Volume tiers ×" + q.tierCount, cls: "missing", key: "volumeTiers"});
  if (edit && !edit.quoteType) flags.push({label: "Missing Bid/Buy", cls: "missing", key: "missingType"});
  return flags;
}

// ---- Interactive flag filters -------------------------------------------------
// KPI tiles and inline flag badges act as one-click filters. v1 rule: exactly one
// active filter at a time, so clicking a different chip replaces the current one
// and clicking the active chip again clears it.
const FLAG_DEFS = {
  overdue:     { label: "Overdue",              test: (q, e) => !!q.followUpDate && daysBetween(q.followUpDate) < 0 },
  today:       { label: "Due today",            test: (q, e) => !!q.followUpDate && daysBetween(q.followUpDate) === 0 },
  missingFU:   { label: "Missing follow-up",    test: (q, e) => !q.followUpDate },
  missingCode: { label: "Missing follow-up code", test: (q, e) => !q.followUpCode },
  missingRep:  { label: "Missing follow-up rep",  test: (q, e) => !q.followUpSalesperson },
  expiring:    { label: "Expiring \u22645 days", test: (q, e) => { const d = daysBetween(q.expirationDate); return d >= 0 && d <= 5; } },
  expired:     { label: "Already expired",    test: (q, e) => daysBetween(q.expirationDate) < 0 },
  mismatch:    { label: "Owner \u2260 BC rep",   test: (q, e) => normalizeOwner(q.owner) !== q.bcSalesperson },
  lostCoded:   { label: "Has lost code",        test: (q, e) => !!q.lostCode },
  volumeTiers: { label: "Volume-tier quote",    test: (q, e) => q.tierOverstated > 0 },
  missingType: { label: "Missing Bid/Buy",      test: (q, e) => !!e && !e.quoteType }
};
const flagFilter = {}; // containerId -> flag key, or null

// Count of QUOTES matching a flag (quote-level, which is what the KPI tiles show).
function countQuotesByFlag(quoteList, key) {
  const def = FLAG_DEFS[key];
  if (!def) return 0;
  if (key === "missingType") {
    // edit-level: a quote counts if any of its lines is missing a Quote Type
    return quoteList.filter(q => q.lines.some(l => !getEdit(lineKey(q, l)).quoteType)).length;
  }
  return quoteList.filter(q => def.test(q, null)).length;
}

function setFlagFilter(containerId, key, rerender) {
  flagFilter[containerId] = (flagFilter[containerId] === key) ? null : key;
  rerender();
}

// Renders the "Showing: Overdue (12) - 34 lines  x" indicator.
function activeFilterBar(containerId, quoteList, shownRows) {
  const key = flagFilter[containerId];
  if (!key) return "";
  const def = FLAG_DEFS[key];
  return `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#FDF0E6;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;">
      <span style="font-size:12px;font-weight:700;color:var(--accent)">Showing: ${def.label} (${countQuotesByFlag(quoteList, key)})</span>
      <span style="font-size:12px;color:var(--text-muted)">${shownRows} line${shownRows === 1 ? "" : "s"}</span>
      <button id="${containerId}-flag-clear" title="Clear filter" style="margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:50%;width:20px;height:20px;line-height:1;cursor:pointer;font-size:13px;font-weight:700">&times;</button>
    </div>`;
}
function normalizeOwner(owner) {
  const map = {"Adam Purcell":"APURCELL","Kelli Jones":"KJONES","Jerik Wong":"JWONG","Spencer Doty":"SDOTY"};
  return map[owner] || owner;
}

async function loadEdits() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) editState = JSON.parse(result.value);
  } catch (e) { editState = {}; }
}
async function saveEdits() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(editState)); } catch (e) {}
}
function getEdit(key) {
  return editState[key] || { quoteType: "", targetPrice: "", comments: "" };
}

const tableFilters = {}; // containerId -> { quoteType: 'All', classification: 'All', customer: 'All' }

function renderQuoteTable(containerId, quoteList, titleHtml, subHtml) {
  const panel = document.getElementById(containerId);
  if (!tableFilters[containerId]) tableFilters[containerId] = { quoteType: 'All', classification: 'All', customer: 'All' };
  const filt = tableFilters[containerId];

  let rows = [];
  quoteList.forEach(q => {
    q.lines.forEach(l => {
      const edit = getEdit(lineKey(q,l));
      rows.push({q, l, flags: computeFlags(q, edit), edit});
    });
  });

  // apply filters
  if (filt.quoteType !== 'All') {
    rows = rows.filter(({edit}) => (edit.quoteType || '(blank)') === filt.quoteType);
  }
  if (filt.classification !== 'All') {
    rows = rows.filter(({l}) => l.itemClassification === filt.classification);

  if (filt.customer !== 'All') {

  }
  // one-click flag filter (independent of the dropdowns above, and limited to one at a time)
  const activeFlag = flagFilter[containerId] || null;
  if (activeFlag && FLAG_DEFS[activeFlag]) {
    rows = rows.filter(({q, edit}) => FLAG_DEFS[activeFlag].test(q, edit));
  }

  const customerOptions = [...new Map(quoteList.map(q => [q.custNo, q.customer])).entries()]

  rows.sort((a,b) => rank(a.flags) - rank(b.flags) || b.l.lineAmount - a.l.lineAmount);

      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Active quote value</div></div>

// ---- Lost Quotes ---------------------------------------------------------------
// Rows where BC has a lostCode set. Status deliberately shown as-is: it still reads
// Quote Issued / Quote WIP because these quotes are never formally closed in BC.
let lostFilter = null; // null | {kind:'missingReason'} | {kind:'code', code:'PRICING'} | {kind:'owner', owner:'...'}

function lostFlagged(r) {
  // exactly one of the two codes populated -- the pairing is incomplete either way
  return (!!r.lostCode) !== (!!r.reasonCode);
}

function renderLostQuotes() {
  const panel = document.getElementById('panel-lost');
  let rows = LOST.slice();

  const flaggedCount = LOST.filter(lostFlagged).length;
  const missingReason = LOST.filter(r => r.lostCode && !r.reasonCode).length;
  const missingLost = LOST.filter(r => !r.lostCode && r.reasonCode).length;
  const totalValue = LOST.reduce((s, r) => s + r.quoteTotal, 0);
  // "closed" would be a Lost/Cancelled status -- no such value exists in this BC instance,
  // so every lost-coded quote is still open. Computed rather than assumed, so it self-corrects
  // if BC ever gains a real closing status.
  const CLOSED = ['Lost', 'Cancelled', 'Canceled', 'Closed'];
  const stillOpen = LOST.filter(r => !CLOSED.includes(r.status)).length;

  const codeTally = {};
  LOST.forEach(r => { const c = r.lostCode || '(none)'; codeTally[c] = (codeTally[c] || 0) + 1; });
  const codeRows = Object.entries(codeTally).sort((a, b) => b[1] - a[1]);

  if (lostFilter) {
    if (lostFilter.kind === 'missingReason') rows = rows.filter(r => lostFlagged(r));
    else if (lostFilter.kind === 'code') rows = rows.filter(r => (r.lostCode || '(none)') === lostFilter.code);
    else if (lostFilter.kind === 'owner') rows = rows.filter(r => r.owner === lostFilter.owner);
  }

  // flagged rows first, then value descending
  rows.sort((a, b) => (lostFlagged(b) - lostFlagged(a)) || (b.quoteTotal - a.quoteTotal));

  const filterLabel = !lostFilter ? '' :
    lostFilter.kind === 'missingReason' ? 'Missing reason code' :
    lostFilter.kind === 'code' ? ('Lost code: ' + lostFilter.code) : ('Owner: ' + lostFilter.owner);
  const filterCount = !lostFilter ? 0 :
    lostFilter.kind === 'missingReason' ? flaggedCount :
    lostFilter.kind === 'code' ? (codeTally[lostFilter.code] || 0) :
    LOST.filter(r => r.owner === lostFilter.owner).length;

  const ownerTally = {};
  LOST.forEach(r => ownerTally[r.owner] = (ownerTally[r.owner] || 0) + 1);
  // Only quotes in the active $5K+ set have lines pulled, so only those can drill down.
  const drillable = new Set(QUOTES.map(q => q.quoteNo));
  const underGate = LOST.filter(r => !drillable.has(r.quoteNo)).length;

  panel.innerHTML = `
    <div class="section-title">Lost Quotes</div>
    <div class="section-sub">Every quote across the team's 133 accounts carrying a <b>lostCode</b> in Business Central &mdash; pulled per rep, with no $5,000 gate so nothing is hidden. <b>Status still reads Quote Issued / Quote WIP / Pending Approval on purpose:</b> that is the known BC limitation, not a bug in this view. There is no Lost or Cancelled status value in this instance, so a quote tagged with a loss reason is never actually closed. Click any KPI tile, loss-reason code, or rep name to filter; click it again to clear. ${underGate ? `${underGate} of these ${LOST.length} sit below the $5,000 gate, so their lines were not pulled — they show as "header only" and have no drill-down. Their header data is complete.` : ''}</div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${LOST.length}</div><div class="lbl">Lost-coded quotes</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Value carrying a lost code</div></div>
      <div class="kpi clickable ${lostFilter && lostFilter.kind==='missingReason' ? 'kpi-active' : ''} ${flaggedCount?'warn':''}" data-lost="missingReason"><div class="val">${flaggedCount}</div><div class="lbl">Incomplete code pairing</div></div>
      <div class="kpi ${stillOpen?'warn':''}"><div class="val">${stillOpen}</div><div class="lbl">Still open in BC</div></div>
      <div class="kpi"><div class="val">${rows.length}</div><div class="lbl">Rows shown</div></div>
    </div>
    ${lostFilter ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#FDF0E6;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;">
        <span style="font-size:12px;font-weight:700;color:var(--accent)">Showing: ${filterLabel} (${filterCount})</span>
        <button id="lost-flag-clear" title="Clear filter" style="margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:50%;width:20px;height:20px;line-height:1;cursor:pointer;font-size:13px;font-weight:700">&times;</button>
      </div>` : ''}
    <div class="card">
      <b style="font-size:13px">Loss reasons on file</b>
      <div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">
        ${codeRows.map(([c, n]) => `<span class="badge lost-code-chip" data-code="${c}" style="cursor:pointer;${lostFilter && lostFilter.kind==='code' && lostFilter.code===c ? 'background:var(--accent);color:#fff;' : ''}">${c} &middot; ${n}</span>`).join('')}
      </div>
      <div style="margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center">
        <span style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.4px">By rep:</span>
        ${Object.entries(ownerTally).sort((a,b)=>b[1]-a[1]).map(([o, n]) => `<span class="badge lost-owner-chip" data-owner="${o}" style="cursor:pointer;${lostFilter && lostFilter.kind==='owner' && lostFilter.owner===o ? 'background:var(--accent);color:#fff;' : ''}">${o} &middot; ${n}</span>`).join('')}
      </div>
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th>Flag</th><th>Quote</th><th>Customer</th><th>Owner</th><th>Quote Total</th><th>Lost Code</th><th>Reason Code</th><th>Status</th>
      </tr></thead>
      <tbody>
        ${rows.length ? rows.map(r => `<tr>
          <td>${lostFlagged(r) ? `<span class="flag missing" title="${r.lostCode ? 'Lost code set but Reason Code is blank' : 'Reason Code set but Lost Code is blank'}">Incomplete pair</span>` : '<span class="flag ok">Both set</span>'}</td>
          <td>${drillable.has(r.quoteNo)
              ? `<a href="#" class="lost-quote-link" data-quote="${r.quoteNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${r.quoteNo}</a>`
              : `<span style="font-weight:600" title="No line-level detail in this snapshot: this quote is under the $5,000 gate, so its lines were not pulled. The header data shown here is complete.">${r.quoteNo}<br/><span style="color:var(--text-muted);font-size:10px;font-weight:400">header only</span></span>`}</td>
          <td><a href="#" class="lost-cust-link" data-custno="${r.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${r.customer}</a><br/><span style="color:var(--text-muted);font-size:11px">${r.custNo}</span></td>
          <td>${r.owner}</td>
          <td>${fmt$(r.quoteTotal)}</td>
          <td>${r.lostCode ? `<span class="badge">${r.lostCode}</span>` : '<span style="color:var(--red);font-weight:600">blank</span>'}</td>
          <td>${r.reasonCode ? `<span class="badge">${r.reasonCode}</span>` : '<span style="color:var(--red);font-weight:600">blank</span>'}</td>
          <td>${r.status}</td>
        </tr>`).join('') : `<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:20px">No lost-coded quotes match this filter.</td></tr>`}
      </tbody>
    </table>
    </div>
  `;

  panel.querySelectorAll('.kpi.clickable').forEach(k => k.addEventListener('click', () => {
    lostFilter = (lostFilter && lostFilter.kind === 'missingReason') ? null : { kind: 'missingReason' };
    renderLostQuotes();
  }));
  panel.querySelectorAll('.lost-code-chip').forEach(c => c.addEventListener('click', () => {
    lostFilter = (lostFilter && lostFilter.kind === 'code' && lostFilter.code === c.dataset.code) ? null : { kind: 'code', code: c.dataset.code };
    renderLostQuotes();
  }));
  panel.querySelectorAll('.lost-owner-chip').forEach(c => c.addEventListener('click', () => {
    lostFilter = (lostFilter && lostFilter.kind === 'owner' && lostFilter.owner === c.dataset.owner) ? null : { kind: 'owner', owner: c.dataset.owner };
    renderLostQuotes();
  }));
  const lc = document.getElementById('lost-flag-clear');
  if (lc) lc.addEventListener('click', () => { lostFilter = null; renderLostQuotes(); });
  panel.querySelectorAll('.lost-quote-link').forEach(a => a.addEventListener('click', e => {
    e.preventDefault();
    const q = findQuote(a.dataset.quote);
    if (q) openDetail(q.quoteNo, q.lines.length ? q.lines[0].lineNo : null);
  }));
  panel.querySelectorAll('.lost-cust-link').forEach(a => a.addEventListener('click', e => {
    e.preventDefault(); openCustomerDetail(a.dataset.custno);
  }));
}

let conversionDateFilter = { from: '', to: '' };

function renderConversion() {
  const panel = document.getElementById('panel-conversion');

  // combine active + archive, tag each with outcome
  const activeRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => activeRows.push({q, l, outcome:'Open', edit:getEdit(lineKey(q,l))})));
  const archiveRows = [];
  ARCHIVE.forEach(q => q.lines.forEach(l => archiveRows.push({q, l, outcome:q.outcome, edit:{quoteType:''}})));
  let allRows = activeRows.concat(archiveRows);

  // date range filter on dueDate
  if (conversionDateFilter.from) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate >= conversionDateFilter.from);
  if (conversionDateFilter.to) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate <= conversionDateFilter.to);

  const wonRows = allRows.filter(r => r.outcome === 'Won');
  const wonValue = wonRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const totalValue = allRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const wonQuoteNos = new Set(ARCHIVE.filter(q=>q.outcome==='Won').map(q=>q.quoteNo));
  const totalQuoteNos = new Set([...QUOTES.map(q=>q.quoteNo), ...ARCHIVE.map(q=>q.quoteNo)]);

  // rep leaderboard: most quoted (all-time, all statuses) + win rate
  const byRep = {};
  allRows.forEach(({q,l,outcome}) => {
    byRep[q.owner] = byRep[q.owner] || {quotedLines:0, quotedValue:0, wonLines:0, wonValue:0, quoteNos:new Set()};
    byRep[q.owner].quotedLines += 1;
    byRep[q.owner].quotedValue += l.lineAmount;
    byRep[q.owner].quoteNos.add(q.quoteNo);
    if (outcome === 'Won') { byRep[q.owner].wonLines += 1; byRep[q.owner].wonValue += l.lineAmount; }
  });
  const repRows = Object.entries(byRep).map(([rep,d]) => ({
    rep, quotes: d.quoteNos.size, quotedValue: d.quotedValue,
    winRateValue: d.quotedValue ? (d.wonValue/d.quotedValue*100) : 0,
    wonValue: d.wonValue
  })).sort((a,b) => b.quotedValue - a.quotedValue);

  // conversion by quote type (Bid/Buy/blank)
  const byType = {};
  allRows.forEach(({l,edit,outcome}) => {
    const t = edit.quoteType || '(not set)';
    byType[t] = byType[t] || {quoted:0, won:0};
    byType[t].quoted += l.lineAmount;
    if (outcome === 'Won') byType[t].won += l.lineAmount;
  });

  // conversion by classification
  const byClass = {};
  allRows.forEach(({l,outcome}) => {
    byClass[l.itemClassification] = byClass[l.itemClassification] || {quoted:0, won:0};
    byClass[l.itemClassification].quoted += l.lineAmount;
    if (outcome === 'Won') byClass[l.itemClassification].won += l.lineAmount;
  });

  const pct = (num, den) => den ? ((num/den)*100).toFixed(1)+'%' : '\u2014';

  panel.innerHTML = `
    <div class="section-title">Conversion</div>
    <div class="section-sub">Active + Archive combined. Date range filters by Due Date (the closest proxy available to a true quote-creation date in this pull). Real conversion is thin right now: only ${wonQuoteNos.size} of ${totalQuoteNos.size} tracked quotes have a confirmed Won outcome in Business Central. Measured against real revenue for the same accounts over the same window (since the ERP upgrade to the current SQIE quote numbering, ${DQ_EVIDENCE.cutoverLabel}): <b>${fmt$(DQ_EVIDENCE.revSinceCutover)}</b> in actual revenue versus <b>${fmt$(ARCHIVE.reduce((s,a)=>s+a.quoteTotal,0))}</b> in confirmed Won SQIE quotes. <b>Do not read that ratio as a win rate.</b> Most of the gap is structural, not performance: BC drops a quote from the live table once its order completes, so confirmed wins disappear from view, and a large share of current revenue is still legacy pre-upgrade backlog booked against old "SQ" quote numbers. See Data Quality.</div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted)">DATE RANGE (Due Date):</span>
      <label style="font-size:12px;color:var(--text-muted)">From <input type="date" id="conv-date-from" value="${conversionDateFilter.from}" style="margin-left:4px"/></label>
      <label style="font-size:12px;color:var(--text-muted)">To <input type="date" id="conv-date-to" value="${conversionDateFilter.to}" style="margin-left:4px"/></label>
      ${(conversionDateFilter.from||conversionDateFilter.to) ? `<a href="#" id="conv-date-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear</a>` : ''}
    </div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total tracked value</div></div>
      <div class="kpi"><div class="val">${fmt$(wonValue)}</div><div class="lbl">Won value</div></div>
      <div class="kpi"><div class="val">${pct(wonValue,totalValue)}</div><div class="lbl">$ conversion (Won \u00f7 total)</div></div>
      <div class="kpi"><div class="val">${wonQuoteNos.size}</div><div class="lbl">Won quotes</div></div>
    </div>

    <div class="card">
      <b style="font-size:13px">Rep leaderboard \u2014 most quoted &amp; win rate by value</b>
      <table style="margin-top:8px"><thead><tr><th>Rep</th><th>Quotes</th><th>Quoted Value</th><th>Won Value</th><th>Win Rate ($)</th></tr></thead>
      <tbody>${repRows.map(r=>`<tr><td>${r.rep}</td><td>${r.quotes}</td><td>${fmt$(r.quotedValue)}</td><td>${fmt$(r.wonValue)}</td><td>${r.winRateValue.toFixed(1)}%</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Quote Type</b>

    </div>

    <div class="card">

      <tbody>${Object.entries(byClass).sort((a,b)=>b[1].quoted-a[1].quoted).map(([c,d])=>`<tr><td><span class="badge">${c}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="roadmap-card" style="margin-top:14px"><b>Why there's no "Lost" conversion rate</b>Business Central's lostCode field is populated on quotes that are still open (status stays "Quote Issued"/"Quote WIP") &mdash; reps are tagging a risk reason without ever closing the quote. There's no reliable way to compute a true Lost bucket until quotes actually get closed out in BC. See Data Quality for the full note.</div>
  `;
  document.getElementById('conv-date-from').addEventListener('change', e => { conversionDateFilter.from = e.target.value; renderConversion(); });
  document.getElementById('conv-date-to').addEventListener('change', e => { conversionDateFilter.to = e.target.value; renderConversion(); });

}

function funnelStage(q) {
  if (q.invoiced) return { label: 'Shipped/Invoiced', color: '#D9EAD3' };
  if (q.orderExists) return { label: 'Order Created \u2014 not yet shipped', color: '#FFF3CD' };
  return { label: 'Won (order not found)', color: '#D9EAD3' };
}

let archiveDateFilter = { from: '', to: '' };

function renderArchive() {
  const panel = document.getElementById('panel-archive');

  // unify current (SQIE, from ARCHIVE) and legacy (pre-upgrade, from LEGACY_WON) into one row shape
  let rows = ARCHIVE.map(q => ({

    amount: q.quoteTotal, date: q.dueDate, stage: funnelStage(q), orderNo: q.orderNo, drillable: true, ref: q.quoteNo
  }));
  rows = rows.concat(LEGACY_WON.map(w => ({
    system: 'Legacy', quoteRef: w.quoteNo, customer: w.customer, custNo: w.custNo, owner: w.owner,

  })));

  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  const totalValue = filtered.reduce((s,r)=>s+r.amount,0);
  const currentCount = filtered.filter(r=>r.system==='Current').length;

      <label style="font-size:12px;color:var(--text-muted)">To <input type="date" id="archive-date-to" value="${archiveDateFilter.to}" style="margin-left:4px"/></label>
      ${(archiveDateFilter.from||archiveDateFilter.to) ? `<a href="#" id="archive-date-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear</a>` : ''}
      ${allDates.length ? `<span style="font-size:11px;color:var(--text-muted)">Data on file spans ${allDates[0]} to ${allDates[allDates.length-1]}.</span>` : ''}
    </div>
    <div class="qoc-kpis">

      <div class="kpi"><div class="val">${currentCount}</div><div class="lbl">Current system (SQIE)</div></div>
      <div class="kpi"><div class="val">${legacyCount}</div><div class="lbl">Legacy (pre-upgrade)</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Won value in range</div></div>
    </div>
    <div style="overflow-x:auto"><table>

function buildCoachingPanel(q) {
  const edit0 = getEdit(lineKey(q, q.lines[0]));
  const topLine = q.lines.slice().sort((a,b)=>b.lineAmount-a.lineAmount)[0];
  const fu = q.followUpDate ? daysBetween(q.followUpDate) : null;

  const qQuestions = [];
  qQuestions.push(edit0.quoteType ? `Confirmed as a <b>${edit0.quoteType}</b> \u2014 does the evidence on file still support that?` : `Is this a <b>Bid or a Buy</b>? Quote Type isn't set yet.`);
  qQuestions.push(q.classification === 'Winback' || q.lines.some(l=>l.itemClassification==='Winback') ? `This has Winback lines \u2014 what changed, and why did we stop getting this business?` : `What's the project or application driving this quote? (Confirm [Application/Project] with the customer \u2014 not captured in this pull.)`);
  qQuestions.push(`When is the expected award date? Expiration on file is <b>${q.expirationDate}</b>.`);

  const uQuestions = [];
  uQuestions.push(`How will ${q.customer} decide who wins this? Confirm price vs. other criteria with the customer.`);
  uQuestions.push(topLine.stock === 0 ? `Top line (<b>${topLine.item}</b>) shows <b>zero stock</b> \u2014 confirm lead time before presenting.` : `Stock on the top line (<b>${topLine.item}</b>) is ${topLine.stock}. Confirm that still covers the quoted quantity.`);

  const oQuestions = [];
  oQuestions.push(`Have all lines worth escalating been reviewed? Highest-value line here is <b>${fmt$(topLine.lineAmount)}</b> (${topLine.item}).`);
  if (q.moreLinesValue) oQuestions.push(`${fmt$(q.moreLinesValue)} on this quote isn't itemized in this view (freight or lines outside this pull) \u2014 confirm the full picture in BC directly.`);

  const tQuestions = [];
  tQuestions.push(`What's the value story beyond price for ${q.customer}? (Availability, lead time, support \u2014 confirm which applies with the customer.)`);

  const eQuestions = [];
  eQuestions.push(fu === null ? `<b>No Follow Up Date set.</b> Establish one before the next contact \u2014 never leave without a scheduled next step.` : fu < 0 ? `Follow-up is <b>overdue by ${Math.abs(fu)} day${Math.abs(fu)===1?'':'s'}</b>. What's the next action, and by when?` : fu === 0 ? `Follow-up is <b>due today</b>. What's the next action?` : `Follow-up scheduled for ${q.followUpDate}. Confirm that's still the right date.`);
  eQuestions.push(`Has the outcome been documented? Current BC status: <b>${q.status}</b>.`);

  return `
    <div class="card" style="margin-top:18px;background:var(--cream)">
      <b style="font-size:13px;color:var(--nav)">QUOTE + VALUE coaching \u2014 grounded in what's on file for this quote</b>
      <div class="section-sub" style="margin-top:4px">Phrased as questions to confirm with the customer or in BC \u2014 nothing here is invented.</div>
      <div style="margin-top:10px;font-size:12px">
        <div style="margin-bottom:8px"><b>Q \u2014 Qualify</b><ul style="margin:4px 0 0 18px">${qQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>U \u2014 Understand</b><ul style="margin:4px 0 0 18px">${uQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>O \u2014 Optimize</b><ul style="margin:4px 0 0 18px">${oQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>T \u2014 Tailor</b><ul style="margin:4px 0 0 18px">${tQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><b>E \u2014 Execute</b><ul style="margin:4px 0 0 18px">${eQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
    </div>
  `;
}

  const byOwner = {};
  QUOTES.forEach(q => {
    byOwner[q.owner] = byOwner[q.owner] || { value: 0, count: 0, overdue: 0, missingFU: 0, zeroActivity: 0 };
    byOwner[q.owner].value += q.quoteTotal;
    byOwner[q.owner].count += 1;
    if (q.followUpDate && daysBetween(q.followUpDate) < 0) byOwner[q.owner].overdue += 1;
    if (!q.followUpDate) byOwner[q.owner].missingFU += 1;
  });
  const activeCustNos = new Set(QUOTES.map(q => q.custNo));
  ALL_ACCOUNTS.forEach(a => { if (!activeCustNos.has(a.custNo)) { byOwner[a.owner] = byOwner[a.owner] || { value:0, count:0, overdue:0, missingFU:0, zeroActivity:0 }; byOwner[a.owner].zeroActivity += 1; } });
  const repRows = Object.entries(byOwner).sort((a,b)=>b[1].value-a[1].value);

  // exception-based coaching queue: every line with at least one real flag, ranked by severity then value
  let queueRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => {
    const edit = getEdit(lineKey(q,l));
    const flags = computeFlags(q, edit);
    if (flags.length) queueRows.push({q, l, flags});
  }));
  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  queueRows.sort((a,b) => rank(a.flags)-rank(b.flags) || b.l.lineAmount-a.l.lineAmount);

  // one active filter at a time: a flag, optionally scoped to one rep
  const totalExceptions = queueRows.length;
  if (managerFilter) {
    const def = FLAG_DEFS[managerFilter.flag];
    if (def) queueRows = queueRows.filter(({q,l}) => def.test(q, getEdit(lineKey(q,l))));
    if (managerFilter.owner) queueRows = queueRows.filter(({q}) => q.owner === managerFilter.owner);
  }
  const topQueue = queueRows.slice(0, 15);

  const teamOverdue = countQuotesByFlag(QUOTES, 'overdue');
  const teamToday = countQuotesByFlag(QUOTES, 'today');
  const teamMissingFU = countQuotesByFlag(QUOTES, 'missingFU');
  const teamExpiring = countQuotesByFlag(QUOTES, 'expiring');
  const teamExpired = countQuotesByFlag(QUOTES, 'expired');
  const teamMismatch = countQuotesByFlag(QUOTES, 'mismatch');
  const mk = (flag, val, label) => `<div class="kpi clickable ${managerFilter && managerFilter.flag===flag && !managerFilter.owner ? 'kpi-active' : ''} ${val?'warn':''}" data-mflag="${flag}"><div class="val">${val}</div><div class="lbl">${label}</div></div>`;

  panel.innerHTML = `
    <div class="section-title">Manager View</div>
    <div class="section-sub">Team rollup and exception-based coaching queue across Adam, Kelli, Jerik, and Spencer's assigned accounts. Click a KPI tile, or a rep's Overdue / Missing Follow-Up badge, to filter the coaching queue; click again to clear.</div>
    <div class="qoc-kpis">
      ${mk('overdue', teamOverdue, 'Overdue follow-up')}
      ${mk('today', teamToday, 'Due today')}
      ${mk('missingFU', teamMissingFU, 'Missing follow-up')}
      ${mk('expiring', teamExpiring, 'Expiring &le;5 days')}
      ${mk('expired', teamExpired, 'Already expired')}
      ${mk('mismatch', teamMismatch, 'Owner &ne; BC rep')}
    </div>
    ${managerFilter ? `<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;background:#FDF0E6;border:1px solid var(--accent);border-radius:8px;padding:8px 14px;">
        <span style="font-size:12px;font-weight:700;color:var(--accent)">Showing: ${FLAG_DEFS[managerFilter.flag] ? FLAG_DEFS[managerFilter.flag].label : managerFilter.flag}${managerFilter.owner ? ' — ' + managerFilter.owner : ''} (${queueRows.length})</span>
        <span style="font-size:12px;color:var(--text-muted)">of ${totalExceptions} flagged lines</span>
        <button id="mgr-flag-clear" title="Clear filter" style="margin-left:auto;background:var(--accent);color:#fff;border:none;border-radius:50%;width:20px;height:20px;line-height:1;cursor:pointer;font-size:13px;font-weight:700">&times;</button>
      </div>` : ''}
    <div class="card">
      <b style="font-size:13px">Team rollup by rep</b>
      <table style="margin-top:10px"><thead><tr><th>Rep</th><th>$5K+ Quotes</th><th>Active Value</th><th>Overdue</th><th>Missing Follow-Up</th><th>Zero-Activity Accounts</th></tr></thead>
      <tbody>${repRows.map(([owner,d])=>`<tr><td>${owner}</td><td>${d.count}</td><td>${fmt$(d.value)}</td><td>${d.overdue ? '<span class="flag overdue mgr-cell" data-mflag="overdue" data-owner="'+owner+'" style="cursor:pointer">'+d.overdue+'</span>' : '0'}</td><td>${d.missingFU ? '<span class="flag missing mgr-cell" data-mflag="missingFU" data-owner="'+owner+'" style="cursor:pointer">'+d.missingFU+'</span>' : '0'}</td><td>${d.zeroActivity || 0}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <b style="font-size:13px">Coaching queue &mdash; exceptions only, highest dollar value first (showing ${topQueue.length} of ${queueRows.length}${managerFilter ? ' filtered' : ''})</b>
      <div class="section-sub" style="margin-top:4px">The 5 Manager Review questions: (1) Is this a Bid or a Buy, and what's the evidence? (2) How will the customer decide who wins? (3) What supports the pricing or discount being asked? (4) What's the story and value proposition? (5) What's the next action, by when, and what outcome are we trying to achieve?</div>
      ${topQueue.map(({q,l,flags}) => `
        <div style="border-top:1px solid var(--border);padding:10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <a href="#" class="mgr-quote-link" data-quote="${q.quoteNo}" data-line="${l.lineNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.customer}</a>
            &mdash; ${q.quoteNo} &mdash; ${fmt$(l.lineAmount)} (${l.item}) &mdash; ${q.owner}<br/>
            <span style="font-size:12px;color:var(--text-muted)">Follow-up: ${q.followUpDate || 'none set'} (${q.followUpCode||'no code'}) &middot; Classification: ${l.itemClassification} &middot; Quote Type: ${getEdit(lineKey(q,l)).quoteType || 'not set'}</span>
          </div>
          <div style="text-align:right;white-space:nowrap">${flags.map(f=>`<span class="flag ${f.cls}">${f.label}</span>`).join(' ')}</div>
        </div>`).join('')}
    </div>
  `;
  panel.querySelectorAll('.mgr-quote-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.quote, Number(a.dataset.line)); });
  });
  panel.querySelectorAll('.kpi.clickable').forEach(k => k.addEventListener('click', () => {
    const f = k.dataset.mflag;
    managerFilter = (managerFilter && managerFilter.flag === f && !managerFilter.owner) ? null : { flag: f };
    renderManager();
  }));
  panel.querySelectorAll('.mgr-cell').forEach(c => c.addEventListener('click', () => {
    const f = c.dataset.mflag, o = c.dataset.owner;
    managerFilter = (managerFilter && managerFilter.flag === f && managerFilter.owner === o) ? null : { flag: f, owner: o };
    renderManager();
  }));
  const mc = document.getElementById('mgr-flag-clear');
  if (mc) mc.addEventListener('click', () => { managerFilter = null; renderManager(); });
}

function renderDQ() {
  const panel = document.getElementById('panel-dq');
  const issues = [];
  const rowIssues = [];
  QUOTES.forEach(q => {
    if (!q.followUpDate) rowIssues.push({sev:'high', text:`${q.quoteNo} (${q.customer}, ${fmt$(q.quoteTotal)}) has no Follow Up Date set at all.`});
    if (q.followUpDate && !q.followUpCode) rowIssues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has a Follow Up Date but no Follow Up Code set.`});
    if (!q.followUpSalesperson) rowIssues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has no Follow Up Salesperson assigned.`});
    if (normalizeOwner(q.owner) !== q.bcSalesperson) rowIssues.push({sev:'high', text:`${q.quoteNo} (${q.customer}) is owned by ${q.owner} on the account package, but BC's Salesperson Code is ${q.bcSalesperson} \u2014 worth confirming who's actually working this.`});
  });
  rowIssues.sort((a,b) => (a.sev==='high'?0:1) - (b.sev==='high'?0:1));
  // ---- Re-verified findings. Each one states the evidence from THIS pull, not a stored conclusion.
  const E = DQ_EVIDENCE;

  // Finding 1 (re-verified): lost quotes never formally close.
  const DQ_CLOSED = ['Lost', 'Cancelled', 'Canceled', 'Closed'];
  const lostStillOpen = LOST.filter(r => !DQ_CLOSED.includes(r.status)).length;
  const lostStatuses = {};
  LOST.forEach(r => lostStatuses[r.status] = (lostStatuses[r.status] || 0) + 1);
  issues.push({sev:'high', confirm:'STILL TRUE', text:`<b>Lost quotes are still never formally closed in BC.</b> This pull found ${LOST.length} quotes across the team's accounts carrying a lostCode. Status breakdown of those ${LOST.length}: ${Object.entries(lostStatuses).map(([s,n])=>`${n} &times; "${s}"`).join(', ')}. That is ${lostStillOpen} of ${LOST.length} (${LOST.length ? Math.round(lostStillOpen/LOST.length*100) : 0}%) still sitting open despite having a documented loss reason. Not one carries a Lost or Cancelled status, because <b>no such status value exists in this BC instance</b>. Reps tag a reason and move on without closing the quote. This remains a process fix, not a data fix \u2014 see the Lost Quotes tab for the full list.`});

  // Finding (new this pull): reasonCode is dead company-wide.
  issues.push({sev:'high', confirm:'NEW', text:`<b>The Reason Code field is unused across the entire LCOM business, not just this team.</b> Evidence: a direct query for <code>responsibilityCenter eq 'LCOM' and reasonCode ne ''</code> against all sales quotes returns <b>zero rows</b> \u2014 company-wide, with no account filter and no dollar threshold. So every one of the ${LOST.length} lost-coded quotes here has a lostCode with a blank reasonCode, and the reverse case (reasonCode set, lostCode blank) is currently impossible anywhere in LCOM. The Lost Quotes tab flags all ${LOST.filter(lostFlagged).length} of them. Until Reason Code is actually populated, lostCode is the only loss signal there is, and it carries no "why" beyond its own short code.`});

  // Finding (new this pull): most of the "active" book is already past its expiration date.
  const expiredQ = QUOTES.filter(q => daysBetween(q.expirationDate) < 0);
  if (expiredQ.length) {
    const expVal = expiredQ.reduce((s, q) => s + q.quoteTotal, 0);
    const worst = Math.max(...expiredQ.map(q => -daysBetween(q.expirationDate)));
    issues.push({sev:'high', confirm:'NEW', text:`<b>${expiredQ.length} of the ${QUOTES.length} active quotes (${Math.round(expiredQ.length/QUOTES.length*100)}%, ${fmt$(expVal)}) are already past their expiration date</b> — the oldest by ${worst} days — yet BC still carries them as open. Combined with the lost-code finding above, this says the same thing from a second angle: quotes in this instance are not closed out, they are abandoned in place. Practical consequence for this dashboard: the previous build only flagged "Expiring ≤5 days", so a quote that expired months ago carried <i>no</i> expiry warning at all and looked healthier than one expiring tomorrow. An <b>"Already expired"</b> flag and KPI tile have been added this refresh. Treat the active-pipeline total as needing re-qualification, not as a forecastable number.`});
  }

  // Finding (new this pull): volume-tier quotes inflate the pipeline total.
  if (E.tierQuotes) {
    issues.push({sev:'high', confirm:'NEW', text:`<b>The headline pipeline number is inflated by volume-tier quotes — read ${fmt$(E.pipeline)} with care.</b> ${E.tierQuotes} of the ${QUOTES.length} active quotes repeat the <i>same part</i> across several lines at an <i>identical unit price</i> with a <i>different quantity</i> on each — the signature of a "price me these quantities" tier list, where the customer buys one tier, not all of them. BC's header <code>amount</code> sums every tier. Worked example: <code>${E.tierExamples[0].quoteNo}</code> (${E.tierExamples[0].customer}) carries ${E.tierExamples[0].tiers} lines of one part at one unit price for 5,000 / 10,000 / 15,000 / 20,000 / 25,000 pieces, totalling ${fmt$(E.tierExamples[0].quoteTotal)} — but the largest single tier is ${fmt$(E.tierExamples[0].quoteTotal - E.tierExamples[0].overstated)}. Across all ${E.tierQuotes}, summing every tier overstates the book by <b>${fmt$(E.tierOverstated)}</b>; a one-tier-per-quote reading gives <b>${fmt$(E.tierAdjusted)}</b>. These are <b>flagged, not silently corrected</b> — filter the queue by the "Volume tiers" badge and have the rep confirm which tier is live before this number goes in a forecast.`});
  }

  // Finding 2 (re-verified): Converted to Order != shipped/invoiced.
  const wonShipped = ARCHIVE.filter(a => a.shipped).length;
  const wonInvoiced = ARCHIVE.filter(a => a.invoiced).length;
  const wonNoOrder = ARCHIVE.filter(a => !a.orderExists).length;
  issues.push({sev:'high', confirm:'STILL TRUE', text:`<b>"Converted to Order" still does not mean shipped or invoiced.</b> Of the ${ARCHIVE.length} Converted-to-Order quotes on the team's accounts in this pull, only ${wonShipped} have an order marked <code>shipped = true</code> and ${wonInvoiced} have a posted invoice. Track the funnel stage (Order Created &rarr; Shipped &rarr; Invoiced) shown in Archive, not a flat Won/Lost binary.`});

  // Finding (new this pull): the order/invoice mismatch runs both directions.
  if (wonNoOrder) {
    issues.push({sev:'high', confirm:'NEW', text:`<b>The order cross-check is unreliable in the other direction too \u2014 don't join on salesOrders alone.</b> ${wonNoOrder} of the ${ARCHIVE.length} Won quotes (${ARCHIVE.filter(a=>!a.orderExists).map(a=>a.quoteNo).join(', ')}) have <b>no row at all in salesOrders</b>, yet they <b>do</b> have posted invoices. Their orders shipped, invoiced, and dropped out of the live <code>salesOrders</code> entity. So "no order row" can mean "never ordered" OR "already completed and gone" \u2014 the two are indistinguishable from salesOrders alone. Judge real conversion from the <code>invoices.quoteNo</code> cross-check, which was the stronger signal in this pull.`});
  }

  // Finding (new this pull): the live quote table loses Won history.
  issues.push({sev:'high', confirm:'NEW', text:`<b>The Won archive is structurally incomplete, and it shrank since the last refresh.</b> Only ${ARCHIVE.length} Converted-to-Order quotes remain visible for the team's 133 accounts. BC removes a quote from the live <code>salesQuotes</code> table once its order completes, so the live table systematically loses Won history over time \u2014 meaning this count is "wins still lingering in the quote table", <b>not</b> "wins the team actually booked". Any win-rate computed from it is biased low. Reading full Won history needs the archive entity (<code>salesQuoteArchives</code> / <code>salesHeaderArchives</code>), which this build does not yet pull \u2014 see Roadmap.`});

  // Finding 3 (re-verified): SQ / SQIE legacy split.
  const legacyValue = LEGACY_WON.reduce((s,r)=>s+r.amount,0);
  const legacyDates = LEGACY_WON.map(r=>r.documentDate).sort();
  const currentWonValue = ARCHIVE.reduce((s,a)=>s+a.quoteTotal,0);
  issues.push({sev:'med', confirm:'STILL TRUE', text:`<b>The SQ / SQIE split is still live and still matters.</b> BC's upgrade (~April 2026) changed quote numbering from the old "SQ" prefix to today's "SQIE". This pull found ${LEGACY_WON.length} invoices totalling ${fmt$(legacyValue)} posting against legacy SQ-numbered quotes${legacyDates.length ? `, dated ${legacyDates[0]} through ${legacyDates[legacyDates.length-1]}` : ''} \u2014 versus ${fmt$(currentWonValue)} across the ${ARCHIVE.length} current-system Won quotes. So legacy business is still the larger share of what closes for these accounts by dollar value — but it is shrinking fast, and the earlier reading of this finding has been corrected (see the next item). Keep the two populations visually distinct (Archive's "System" column) rather than merging them into one number, and remember the Archive date filter returns nothing before ${E.legacyWindow}, which is where this pull is deliberately bounded.`});

  // Finding (new this pull): the previous legacy figure was a truncation artifact, and the backlog is winding down.
  if (E.legacyAllTimeCount) {
    const months = Object.keys(E.legacyMonthly || {}).sort();
    const first = months[0], last = months[months.length - 1];
    const fm = (E.legacyMonthly || {})[first] || {count:0}, lm = (E.legacyMonthly || {})[last] || {count:0};
    const drop = fm.count ? Math.round((1 - lm.count / fm.count) * 100) : 0;
    issues.push({sev:'high', confirm:'NEW', text:`<b>The previous refresh's legacy figure was a truncation artifact — and the legacy backlog is in fact winding down, not holding steady.</b> Two corrections. (1) <b>Scale:</b> an unbounded pull of SQ-numbered invoices for these accounts returns <b>${E.legacyAllTimeCount.toLocaleString()}</b> rows reaching back to <b>${E.legacyEarliest}</b> — not the few hundred since April 2026 previously reported. The earlier "272 invoices / $1.06M" was simply where the connector's 2,000-row cap cut the data off, read as if it were the whole population. (2) <b>Direction:</b> bounding the pull to post-cutover invoicing (on/after ${E.legacyWindow}) gives ${LEGACY_WON.length} invoices, and the monthly trend is a steep decline — ${months.map(m => `${m}: ${E.legacyMonthly[m].count}`).join(', ')}. That is a <b>${drop}% fall</b> from ${first} to ${last}. The earlier conclusion that this "isn't a one-time transition blip — it's still happening" <b>no longer holds</b>: the pre-upgrade backlog is nearly cleared, so from here on, Won business genuinely does have to come through the current SQIE process.${E.legacyMissingAmounts ? ` <i>Caveat: ${E.legacyMissingAmounts} of these invoices could not be priced in this pull and are carried at $0, so legacy dollar totals are a floor.</i>` : ''}`});
    issues.push({sev:'med', confirm:'NEW', text:`<b>Operational note for the next refresh — <code>postedSalesInvoices</code> is far slower than it looks.</b> That entity renders a PDF document blob per returned row (roughly 1.5 seconds each), so a 40-invoice chunk times out rather than erroring cleanly, and an attempt to price all ${E.legacyAllTimeCount.toLocaleString()} legacy invoices through it cannot complete. Chunk invoice-amount lookups at about 10 numbers per call, and bound the invoice pull by <code>documentDate</code> first so the set stays small. This is the practical reason the legacy archive is scoped to post-cutover invoicing rather than all history.`});
  }

  // Finding (re-verified + quantified): SalesModel customer-number collisions.
  issues.push({sev:'high', confirm:'STILL TRUE', text:`<b>Customer numbers are still not unique in SalesModel \u2014 and it is far more widespread than two examples.</b> Checking all 133 assigned accounts against <code>d_SellToCustomer</code>, <b>${E.dupeAccounts} of them return more than one customer record for the same customer number</b>. In ${E.dupeFlipping} of those cases the wrong pick would flip the account's classification outright. Worked examples from this pull: ${E.dupeExamples.map(x=>`<code>${x.custNo}</code> resolves to both "${x.picked}" (last order ${x.pickedDate}) and "${x.rejected}" (last order ${x.rejectedDate})`).join('; ')}. This dashboard resolves the collision by matching on customer <i>name</i> and preferring the most recent order date \u2014 a join on customer number alone would silently mark active accounts dormant.`});

  // Item-level classification status.
  if (E.itemLevelLines != null) {
    issues.push({sev:'med', confirm:'RESOLVED', text:`<b>The SalesModel item-key join bug is fixed.</b> The previously documented failure \u2014 grouping by <code>f_Transaction[ItemKey]</code> while resolving <code>d_Item[ItemNumber]</code> returned null for every row \u2014 was avoided by grouping on the <i>dimension</i> columns (<code>d_SellToCustomer[CustomerNumber]</code>, <code>d_Item[ItemNumber]</code>) and aggregating <code>CALCULATE(MAX(f_Transaction[OrderDate]))</code>. Item-level classification now covers <b>${E.itemLevelLines} of ${E.totalLines} active quote lines</b> (${E.totalLines ? Math.round(E.itemLevelLines/E.totalLines*100) : 0}%), across all four reps rather than the original 28 quotes. The remaining ${E.totalLines - E.itemLevelLines} lines are parts with no purchase history for that customer, so they fall back to customer-level classification \u2014 correctly, since there is no item history to read.`});
  }

  // Pull integrity.
  issues.push({sev:'med', confirm:'STILL TRUE', text:`<b>The 2,000-row cap remains the most dangerous failure mode, and this refresh was pulled per rep to avoid it.</b> Every quote, lost-code, and legacy-invoice query in this refresh was filtered by explicit customer number, one rep at a time. Largest single response in the entire refresh: ${E.maxRows} rows \u2014 nowhere near the 2,000 cap, so nothing was silently truncated. A broad company-wide pull would not have had that guarantee. Note also that <code>not</code> filters are rejected outright by this BC OData endpoint, so exclusions (e.g. separating SQ from SQIE) must be done client-side.`});

  if (E.oddities && E.oddities.length) {
    issues.push({sev:'med', confirm:'NEW', text:`<b>Field-level oddities worth a human look:</b> ${E.oddities.join(' ')}`});
  }

  panel.innerHTML = `
    <div class="section-title">Data Quality</div>
    <div class="section-sub">Every item below was re-verified against the live pull on ${E.pullDate}, with the evidence shown rather than just the conclusion. These are fixed in Business Central, not in this app.</div>
    <div class="card">
      ${issues.map(i => `<div class="dq-item"><span class="dq-sev" style="background:${i.sev==='high'?'var(--red)':'var(--yellow)'}">${i.sev.toUpperCase()}</span>${i.confirm ? `<span class="dq-sev" style="background:${i.confirm==='NEW'?'var(--accent)':i.confirm==='RESOLVED'?'var(--green)':'var(--gray)'}">${i.confirm}</span>` : ''}${i.text}</div>`).join('') || '<div class="dq-item">No issues found in this snapshot.</div>'}
    </div>
    <div class="card">
      <b style="font-size:13px">Per-quote field gaps in this pull (${rowIssues.length})</b>
      <div class="section-sub" style="margin-top:4px">Individual records missing a follow-up date, code, or salesperson, or whose BC salesperson disagrees with the account package. Each one is a single-record fix in BC.</div>
      <details>
        <summary style="cursor:pointer;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:6px">Show all ${rowIssues.length} records</summary>
        ${rowIssues.map(i => `<div class="dq-item"><span class="dq-sev" style="background:${i.sev==='high'?'var(--red)':'var(--yellow)'}">${i.sev.toUpperCase()}</span>${i.text}</div>`).join('') || '<div class="dq-item">No per-quote gaps found.</div>'}
      </details>
    </div>
    <div class="card">
      <b style="font-size:13px">Known unavailable fields (not invented)</b>
      <div class="dq-item">"Describe the Opportunity" \u2014 not present on salesHeader2 in this BC instance.</div>
      <div class="dq-item">Customer Part No., NCNR/freight flags, brand/region/department fields \u2014 not present on salesQuoteLine; these only appear once a quote converts to salesOrderLine.</div>
      <div class="dq-item">Demand Creation flag \u2014 no reliable connected source yet.</div>
    </div>
  `;
}

  panel.innerHTML = `
    <div class="section-title">Roadmap</div>
    <div class="section-sub">Built so far: Queue, Rep View, Lost Quotes, dropdown filters (Quote Type, Classification, Customer), one-click KPI and flag-badge filters, Stock, quote-line drill-down, customer drill-down, item-level classification, Winback, Repeated No-Win, Conversion with date range and rep leaderboard, Customers (including zero-activity accounts), exception-based Manager coaching queue, QUOTE+VALUE coaching panel, Archive, Data Quality.</div>
    <div class="roadmap-grid">
      <div class="roadmap-card"><b>Full Won history from the archive tables</b>The live <code>salesQuotes</code> table drops a quote once its order completes, so the Won archive here only holds wins still lingering in that table and any win rate from it is biased low. Pulling <code>salesQuoteArchives</code> / <code>salesHeaderArchives</code> is the fix.</div>
      <div class="roadmap-card"><b>Broader Repeated No-Win detection</b>Still limited to what's visible across active quotes in this snapshot. The same archive-table pull above is what would make genuine repeat-and-lose patterns detectable.</div>
      <div class="roadmap-card"><b>Real Lost tracking</b>Needs a BC process change (actually closing quotes as Lost, and populating Reason Code &mdash; currently unused across all of LCOM). Covered in the separate instructional document; this app cannot fix it.</div>
      <div class="roadmap-card"><b>Legacy SQ reach-back</b>The legacy invoice pull is now filtered by customer number rather than paging a capped date sweep, so it covers the team's accounts fully &mdash; but only as far back as BC retains those invoice records.</div>
      <div class="roadmap-card"><b>Multi-select filters</b>v1 deliberately allows one active click-filter at a time per view. Combining several (e.g. Overdue <i>and</i> Missing Bid/Buy) is the natural next step.</div>
    </div>
  `;
}

document.querySelectorAll('.qoc-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.qoc-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['queue','reps','lost','winback','norewin','conversion','manager','customers','dq','archive','roadmap'].forEach(t => {
      document.getElementById('panel-'+t).style.display = (t === btn.dataset.tab) ? 'block' : 'none';
    });
  });
});

document.getElementById('snapshot-note').innerHTML =
  `<b>Live data snapshot &mdash; refreshed ${DQ_EVIDENCE.pullDate}.</b> ` +
  `${QUOTES.length} active $5,000+ quotes (${fmt$(QUOTES.reduce((s,q)=>s+q.quoteTotal,0))}, ${QUOTES.reduce((s,q)=>s+q.lines.length,0)} lines) across Adam, Kelli, Jerik, and Spencer's 133 assigned accounts, ` +
  `plus ${LOST.length} quotes carrying a lost code and ${ARCHIVE.length + LEGACY_WON.length} closed-won records. ` +
  `Pulled from Business Central Explorer <b>one rep at a time</b> &mdash; filtered by explicit customer number so the connector's silent 2,000-row cap could not truncate anyone's book &mdash; and cross-checked against SalesModel order history for per-part classification. ` +
  `Rep-entered Quote Type, Target Price, and Comments are preserved across refreshes and were not overwritten. See Data Quality for what this pull re-verified and what is new.`;

(async () => {
  await loadEdits();
  renderQueue();
  renderReps();
  renderLostQuotes();
  renderWinback();
  renderNoRewin();
  renderConversion();
  renderManager();
  renderCustomers();
  renderDQ();
  renderArchive();
  renderRoadmap();
})();
</script>
