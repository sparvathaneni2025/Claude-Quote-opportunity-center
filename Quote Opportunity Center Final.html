<style>
  :root {
    --bg: #FAF7F2;
    --nav: #2B2B2B;
    --accent: #C1541C;
    --card: #FFFFFF;
    --cream: #FFF9F2;
    --border: #E5DDD3;
    --text: #2B2B2B;
    --text-muted: #7A7267;
    --red: #C1392B;
    --orange: #C1541C;
    --yellow: #B8860B;
    --green: #4C7A3D;
    --gray: #9B9186;
  }
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #qoc { background: var(--bg); color: var(--text); border-radius: 12px; overflow: hidden; }
  .qoc-nav { background: var(--nav); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .qoc-nav .brand { font-weight: 700; font-size: 15px; margin-right: 16px; color: #fff; letter-spacing: 0.3px; }
  .qoc-tab { background: transparent; border: none; color: #cfc9c0; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .qoc-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .qoc-tab:hover:not(.active) { background: #3d3d3d; color: #fff; }
  .qoc-body { padding: 20px; }
  .qoc-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .val { font-size: 22px; font-weight: 700; color: var(--nav); }
  .kpi .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .kpi.warn .val { color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; }
  thead th { background: var(--cream); text-align: left; padding: 10px 8px; font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid var(--border); }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: #FFFBF6; }
  .flag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .flag.overdue { background: var(--red); }
  .flag.today { background: var(--orange); }
  .flag.missing { background: var(--yellow); }
  .flag.ok { background: var(--green); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: #EFE6DA; color: var(--nav); font-weight: 600; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 32px; }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--nav); }
  .section-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .dq-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .dq-item:last-child { border-bottom: none; }
  .dq-sev { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 8px; }
  .roadmap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .roadmap-card { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--text-muted); font-size: 12px; background: var(--cream); }
  .roadmap-card b { display: block; color: var(--nav); font-size: 13px; margin-bottom: 4px; }
  .save-status { font-size: 11px; color: var(--green); margin-left: 8px; }
  .refresh-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .snapshot-note { font-size: 11px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
  .qoc-quick { cursor: pointer; transition: box-shadow 0.1s; }
  .qoc-quick:hover { box-shadow: 0 0 0 2px var(--accent) inset; }
  .qoc-quick-active { box-shadow: 0 0 0 2px var(--accent) inset; background: #FFF3E8; }
  .flag-clickable { cursor: pointer; }
  .flag-clickable:hover { opacity: 0.75; }
  .showing-indicator { display: inline-flex; align-items: center; gap: 8px; background: var(--accent); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; margin-bottom: 12px; }
  .showing-indicator a { color: #fff; text-decoration: none; font-weight: 700; font-size: 14px; }
</style>

<div id="qoc">
  <div class="qoc-nav">
    <span class="brand">INFINITE ELECTRONICS &mdash; QUOTE OPPORTUNITY CENTER</span>

    <button class="qoc-tab" data-tab="manager">Manager View</button>
    <button class="qoc-tab" data-tab="lost">Lost Quotes</button>
    <button class="qoc-tab" data-tab="dq">Data Quality</button>
    <button class="qoc-tab" data-tab="archive">Archive</button>
    <button class="qoc-tab" data-tab="roadmap">Roadmap</button>
  </div>
  <div class="qoc-body">
    <div class="snapshot-note" id="snapshot-note"></div>
    <div id="panel-queue"></div>
    <div id="panel-reps" style="display:none"></div>
    <div id="panel-winback" style="display:none"></div>
    <div id="panel-norewin" style="display:none"></div>
    <div id="panel-conversion" style="display:none"></div>
    <div id="panel-manager" style="display:none"></div>
    <div id="panel-lost" style="display:none"></div>
    <div id="panel-customers" style="display:none"></div>
    <div id="panel-dq" style="display:none"></div>
    <div id="panel-archive" style="display:none"></div>
    <div id="panel-roadmap" style="display:none"></div>
  </div>
</div>
<div id="qoc-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(30,26,22,0.55);z-index:9999;align-items:center;justify-content:center;padding:24px;">

const TODAY = new Date("2026-08-25");
const STORAGE_KEY = "qoc-line-edits-v1";
let editState = {}; // key: quoteNo|lineNo -> {quoteType, targetPrice, comments}

function lineKey(q, l) { return q.quoteNo + "|" + l.lineNo; }
function daysBetween(dateStr) {
  const d = new Date(dateStr);
  return Math.round((d - TODAY) / 86400000);
}
function fmt$(n) { return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }

function computeFlags(q, edit) {
  const flags = [];
  if (!q.followUpDate) { flags.push({label: "Missing Follow-Up Date", cls: "missing"}); }
  else {
    const fu = daysBetween(q.followUpDate);
    if (fu < 0) flags.push({label: "Overdue " + Math.abs(fu) + "d", cls: "overdue"});
    else if (fu === 0) flags.push({label: "Due today", cls: "today"});
  }
  if (!q.followUpCode) flags.push({label: "Missing Follow-Up Code", cls: "missing"});
  if (!q.followUpSalesperson) flags.push({label: "Missing Follow-Up Rep", cls: "missing"});
  const exp = daysBetween(q.expirationDate);
  if (exp >= 0 && exp <= 5) flags.push({label: "Expires in " + exp + "d", cls: "today"});
  if (normalizeOwner(q.owner) !== q.bcSalesperson) {
    flags.push({label: "Owner \u2260 BC Salesperson", cls: "missing"});
  }
  if (edit && !edit.quoteType) flags.push({label: "Missing Bid/Buy", cls: "missing"});
  return flags;
}
function normalizeOwner(owner) {
  const map = {"Adam Purcell":"APURCELL","Kelli Jones":"KJONES","Jerik Wong":"JWONG","Spencer Doty":"SDOTY"};
  return map[owner] || owner;
}

async function loadEdits() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) editState = JSON.parse(result.value);
  } catch (e) { editState = {}; }
}
async function saveEdits() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(editState)); } catch (e) {}
}
function getEdit(key) {
  return editState[key] || { quoteType: "", targetPrice: "", comments: "" };
}

const tableFilters = {}; // containerId -> { quoteType: 'All', classification: 'All', customer: 'All' }

function renderQuoteTable(containerId, quoteList, titleHtml, subHtml) {
  const panel = document.getElementById(containerId);
  if (!tableFilters[containerId]) tableFilters[containerId] = { quoteType: 'All', classification: 'All', customer: 'All', quick: null };
  const filt = tableFilters[containerId];

  let rows = [];
  quoteList.forEach(q => {
    q.lines.forEach(l => {
      const edit = getEdit(lineKey(q,l));
      rows.push({q, l, flags: computeFlags(q, edit), edit});
    });
  });

  // apply filters
  if (filt.quoteType !== 'All') {
    rows = rows.filter(({edit}) => (edit.quoteType || '(blank)') === filt.quoteType);
  }
  if (filt.classification !== 'All') {
    rows = rows.filter(({l}) => l.itemClassification === filt.classification);
  }
  if (filt.customer !== 'All') {
    rows = rows.filter(({q}) => q.custNo === filt.customer);
  }
  if (filt.quick) {
    if (filt.quick.kind === 'overdue') rows = rows.filter(({q}) => q.followUpDate && daysBetween(q.followUpDate) < 0);
    else if (filt.quick.kind === 'today') rows = rows.filter(({q}) => q.followUpDate && daysBetween(q.followUpDate) === 0);
    else if (filt.quick.kind === 'missingFU') rows = rows.filter(({q}) => !q.followUpDate);
    else if (filt.quick.kind === 'expiring') rows = rows.filter(({q}) => { const e = daysBetween(q.expirationDate); return e >= 0 && e <= 5; });
    else if (filt.quick.kind === 'flag') rows = rows.filter(({flags}) => flags.some(f => f.label === filt.quick.label));
  }

  const customerOptions = [...new Map(quoteList.map(q => [q.custNo, q.customer])).entries()]
    .sort((a,b) => a[1].localeCompare(b[1]));

  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  rows.sort((a,b) => rank(a.flags) - rank(b.flags) || b.l.lineAmount - a.l.lineAmount);

  const overdueCount = quoteList.filter(q => q.followUpDate && daysBetween(q.followUpDate) < 0).length;
  const missingFUCount = quoteList.filter(q => !q.followUpDate).length;
  const todayCount = quoteList.filter(q => q.followUpDate && daysBetween(q.followUpDate) === 0).length;
  const totalValue = quoteList.reduce((s,q)=>s+q.quoteTotal,0);
  const expiringCount = quoteList.filter(q => { const e = daysBetween(q.expirationDate); return e >= 0 && e <= 5; }).length;
  const filteredValue = rows.reduce((s,{l})=>s+l.lineAmount,0);
  const quickLabels = {overdue:'Overdue', today:'Due Today', missingFU:'Missing Follow-Up', expiring:'Expiring ≤5 days'};
  const quickLabel = filt.quick ? (filt.quick.kind === 'flag' ? filt.quick.label : quickLabels[filt.quick.kind]) : null;

  panel.innerHTML = `
    ${titleHtml}
    ${subHtml}
    <div class="qoc-kpis">
      <div class="kpi qoc-quick ${overdueCount?'warn':''} ${filt.quick && filt.quick.kind==='overdue'?'qoc-quick-active':''}" data-quick-kind="overdue"><div class="val">${overdueCount}</div><div class="lbl">Overdue follow-up</div></div>
      <div class="kpi qoc-quick ${todayCount?'warn':''} ${filt.quick && filt.quick.kind==='today'?'qoc-quick-active':''}" data-quick-kind="today"><div class="val">${todayCount}</div><div class="lbl">Due today</div></div>
      <div class="kpi qoc-quick ${missingFUCount?'warn':''} ${filt.quick && filt.quick.kind==='missingFU'?'qoc-quick-active':''}" data-quick-kind="missingFU"><div class="val">${missingFUCount}</div><div class="lbl">Missing follow-up</div></div>
      <div class="kpi qoc-quick ${expiringCount?'warn':''} ${filt.quick && filt.quick.kind==='expiring'?'qoc-quick-active':''}" data-quick-kind="expiring"><div class="val">${expiringCount}</div><div class="lbl">Expiring &le;5 days</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Active quote value</div></div>
      <div class="kpi"><div class="val">${quoteList.length}</div><div class="lbl">Quotes ($5K+)</div></div>
      <div class="kpi"><div class="val">${rows.length}</div><div class="lbl">Lines shown</div></div>
    </div>
    ${quickLabel ? `<div class="showing-indicator">Showing: ${quickLabel} (${rows.length}) <a href="#" id="${containerId}-quick-clear" title="Clear this filter">&times;</a></div>` : ''}
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted)">FILTER:</span>
      <label style="font-size:12px;color:var(--text-muted)">Quote Type
        <select id="${containerId}-filter-type" style="margin-left:6px">
          <option value="All" ${filt.quoteType==='All'?'selected':''}>All</option>
          <option value="Bid" ${filt.quoteType==='Bid'?'selected':''}>Bid</option>
          <option value="Buy" ${filt.quoteType==='Buy'?'selected':''}>Buy</option>
          <option value="(blank)" ${filt.quoteType==='(blank)'?'selected':''}>Not set</option>
        </select>
      </label>
      <label style="font-size:12px;color:var(--text-muted)">Classification
        <select id="${containerId}-filter-class" style="margin-left:6px">
          <option value="All" ${filt.classification==='All'?'selected':''}>All</option>
          <option value="Existing Business" ${filt.classification==='Existing Business'?'selected':''}>Existing Business</option>
          <option value="Winback" ${filt.classification==='Winback'?'selected':''}>Winback</option>
          <option value="New Business" ${filt.classification==='New Business'?'selected':''}>New Business</option>
        </select>
      </label>
      <label style="font-size:12px;color:var(--text-muted)">Customer
        <select id="${containerId}-filter-customer" style="margin-left:6px;max-width:220px">
          <option value="All" ${filt.customer==='All'?'selected':''}>All</option>
          ${customerOptions.map(([custNo,name]) => `<option value="${custNo}" ${filt.customer===custNo?'selected':''}>${name}</option>`).join('')}
        </select>
      </label>
      ${(filt.quoteType!=='All'||filt.classification!=='All'||filt.customer!=='All') ? `<span style="font-size:12px;color:var(--accent);font-weight:600">${fmt$(filteredValue)} in filtered view</span> <a href="#" id="${containerId}-filter-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear filters</a>` : ''}
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th></th><th>Flags</th><th>Customer</th><th>Quote / Line</th><th>Item</th><th>Qty</th><th>Line Value</th>
        <th>Stock</th><th>Classification</th><th>Owner</th><th>Follow-Up</th><th>Quote Type</th><th>Target Price</th><th>Comments</th>
      </tr></thead>
      <tbody id="${containerId}-tbody"></tbody>
    </table>
    </div>
  `;
  panel.querySelectorAll('.qoc-quick').forEach(el => {
    el.addEventListener('click', () => {
      const kind = el.dataset.quickKind;
      const cur = tableFilters[containerId].quick;
      tableFilters[containerId].quick = (cur && cur.kind === kind) ? null : { kind };
      renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
    });
  });
  const quickClearBtn = document.getElementById(containerId+'-quick-clear');
  if (quickClearBtn) quickClearBtn.addEventListener('click', (e) => {
    e.preventDefault();
    tableFilters[containerId].quick = null;
    renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
  });
  document.getElementById(containerId+'-filter-type').addEventListener('change', e => {
    tableFilters[containerId].quoteType = e.target.value;
    renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
  });
  document.getElementById(containerId+'-filter-class').addEventListener('change', e => {
    tableFilters[containerId].classification = e.target.value;
    renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
  });
  document.getElementById(containerId+'-filter-customer').addEventListener('change', e => {
    tableFilters[containerId].customer = e.target.value;
    renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
  });
  const clearBtn = document.getElementById(containerId+'-filter-clear');
  if (clearBtn) clearBtn.addEventListener('click', (e) => {
    e.preventDefault();
    tableFilters[containerId] = { quoteType: 'All', classification: 'All', customer: 'All' };
    renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
  });

  const tbody = document.getElementById(containerId+'-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="14" style="text-align:center;color:var(--text-muted);padding:20px">No lines match this filter.</td></tr>`;
  }
  rows.forEach(({q,l,flags,edit}) => {
    const key = lineKey(q,l);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><button class="drill-btn" data-quote="${q.quoteNo}" data-line="${l.lineNo}" title="View quote detail" style="background:var(--cream);border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:4px 8px;font-size:12px;">&#8599;</button></td>
      <td>${flags.map(f=>`<span class="flag ${f.cls} flag-clickable" data-flag-label="${f.label}" title="Click to filter to this flag">${f.label}</span><br/>`).join('') || '<span class="flag ok">On track</span>'}</td>
      <td><a href="#" class="customer-link" data-custno="${q.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${q.customer}</a><br/><span style="color:var(--text-muted);font-size:11px">${q.custNo}</span></td>
      <td><a href="#" class="quote-link" data-quote="${q.quoteNo}" data-line="${l.lineNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.quoteNo}</a><br/><span style="color:var(--text-muted);font-size:11px">Line ${l.lineNo} &middot; ${q.status}</span></td>
      <td>${l.item}<br/><span style="color:var(--text-muted);font-size:11px">${l.desc}</span></td>
      <td>${l.qty}</td>
      <td>${fmt$(l.lineAmount)}<br/><span style="color:var(--text-muted);font-size:11px">Quote total ${fmt$(q.quoteTotal)}${q.moreLinesValue ? ' (+'+fmt$(q.moreLinesValue)+' not itemized here \u2014 freight and/or lines not captured in this snapshot)' : ''}</span></td>
      <td>${l.stock!=null ? (l.stock === 0 ? '<span style="color:var(--red);font-weight:600">0</span>' : l.stock) : '<span style="color:var(--text-muted)">\u2014</span>'}</td>
      <td><span class="badge">${l.itemClassification}</span>${l.itemDaysSince!=null ? `<br/><span style="color:var(--text-muted);font-size:11px">${l.itemDaysSince}d since ordered</span>` : (l.itemClassification==='New Business' ? '<br/><span style="color:var(--text-muted);font-size:11px">no order history</span>' : '')}</td>
      <td>${q.owner}</td>
      <td>${q.followUpDate || '<span style="color:var(--red)">none set</span>'}<br/><span style="color:var(--text-muted);font-size:11px">${q.followUpCode||'\u2014'}</span></td>
      <td><select data-key="${key}" data-field="quoteType">
            <option value="" ${edit.quoteType===''?'selected':''}></option>
            <option value="Bid" ${edit.quoteType==='Bid'?'selected':''}>Bid</option>
            <option value="Buy" ${edit.quoteType==='Buy'?'selected':''}>Buy</option>
          </select></td>
      <td><input type="number" data-key="${key}" data-field="targetPrice" value="${edit.targetPrice}" placeholder="$"/></td>
      <td><textarea data-key="${key}" data-field="comments" placeholder="Notes...">${edit.comments}</textarea></td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('change', async e => {
      const k = e.target.dataset.key, f = e.target.dataset.field;
      if (!editState[k]) editState[k] = { quoteType:"", targetPrice:"", comments:"" };
      editState[k][f] = e.target.value;
      await saveEdits();
      renderQuoteTable(containerId, quoteList, titleHtml, subHtml); // re-render this table to refresh flags
    });
  });
  tbody.querySelectorAll('.drill-btn').forEach(btn => {
    btn.addEventListener('click', () => openDetail(btn.dataset.quote, Number(btn.dataset.line)));
  });
  tbody.querySelectorAll('.flag-clickable').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const label = el.dataset.flagLabel;
      const cur = tableFilters[containerId].quick;
      tableFilters[containerId].quick = (cur && cur.kind === 'flag' && cur.label === label) ? null : { kind: 'flag', label };
      renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
    });
  });
  tbody.querySelectorAll('.quote-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.quote, Number(a.dataset.line)); });
  });
  tbody.querySelectorAll('.customer-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openCustomerDetail(a.dataset.custno); });
  });
}

let conversionDateFilter = { from: '', to: '' };

function renderConversion() {
  const panel = document.getElementById('panel-conversion');

  // combine active + archive, tag each with outcome
  const activeRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => activeRows.push({q, l, outcome:'Open', edit:getEdit(lineKey(q,l))})));
  const archiveRows = [];
  ARCHIVE.forEach(q => q.lines.forEach(l => archiveRows.push({q, l, outcome:q.outcome, edit:{quoteType:''}})));
  let allRows = activeRows.concat(archiveRows);

  // date range filter on dueDate
  if (conversionDateFilter.from) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate >= conversionDateFilter.from);
  if (conversionDateFilter.to) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate <= conversionDateFilter.to);

  const wonRows = allRows.filter(r => r.outcome === 'Won');
  const wonValue = wonRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const totalValue = allRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const wonQuoteNos = new Set(ARCHIVE.filter(q=>q.outcome==='Won').map(q=>q.quoteNo));
  const totalQuoteNos = new Set([...QUOTES.map(q=>q.quoteNo), ...ARCHIVE.map(q=>q.quoteNo)]);

  // rep leaderboard: most quoted (all-time, all statuses) + win rate
  const byRep = {};
  allRows.forEach(({q,l,outcome}) => {
    byRep[q.owner] = byRep[q.owner] || {quotedLines:0, quotedValue:0, wonLines:0, wonValue:0, quoteNos:new Set()};
    byRep[q.owner].quotedLines += 1;
    byRep[q.owner].quotedValue += l.lineAmount;
    byRep[q.owner].quoteNos.add(q.quoteNo);
    if (outcome === 'Won') { byRep[q.owner].wonLines += 1; byRep[q.owner].wonValue += l.lineAmount; }
  });
  const repRows = Object.entries(byRep).map(([rep,d]) => ({
    rep, quotes: d.quoteNos.size, quotedValue: d.quotedValue,
    winRateValue: d.quotedValue ? (d.wonValue/d.quotedValue*100) : 0,
    wonValue: d.wonValue
  })).sort((a,b) => b.quotedValue - a.quotedValue);

  // conversion by quote type (Bid/Buy/blank)
  const byType = {};
  allRows.forEach(({l,edit,outcome}) => {
    const t = edit.quoteType || '(not set)';
    byType[t] = byType[t] || {quoted:0, won:0};
    byType[t].quoted += l.lineAmount;
    if (outcome === 'Won') byType[t].won += l.lineAmount;
  });

  // conversion by classification
  const byClass = {};
  allRows.forEach(({l,outcome}) => {
    byClass[l.itemClassification] = byClass[l.itemClassification] || {quoted:0, won:0};
    byClass[l.itemClassification].quoted += l.lineAmount;
    if (outcome === 'Won') byClass[l.itemClassification].won += l.lineAmount;
  });

  const pct = (num, den) => den ? ((num/den)*100).toFixed(1)+'%' : '\u2014';

  panel.innerHTML = `
    <div class="section-title">Conversion</div>
    <div class="section-sub">Active + Archive combined. Date range filters by Due Date (the closest proxy available to a true quote-creation date in this pull). Real conversion is thin right now: only ${wonQuoteNos.size} of ${totalQuoteNos.size} tracked quotes have a confirmed Won outcome in Business Central. Confirmed against real revenue for the same accounts, same time window (since the ERP upgrade to the current SQIE quote numbering, April 2026): $12,643,122.95 in actual revenue vs. $42,695.67 in confirmed Won quotes \u2014 0.34%. See Data Quality for the full breakdown.</div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted)">DATE RANGE (Due Date):</span>
      <label style="font-size:12px;color:var(--text-muted)">From <input type="date" id="conv-date-from" value="${conversionDateFilter.from}" style="margin-left:4px"/></label>
      <label style="font-size:12px;color:var(--text-muted)">To <input type="date" id="conv-date-to" value="${conversionDateFilter.to}" style="margin-left:4px"/></label>
      ${(conversionDateFilter.from||conversionDateFilter.to) ? `<a href="#" id="conv-date-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear</a>` : ''}
    </div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total tracked value</div></div>
      <div class="kpi"><div class="val">${fmt$(wonValue)}</div><div class="lbl">Won value</div></div>
      <div class="kpi"><div class="val">${pct(wonValue,totalValue)}</div><div class="lbl">$ conversion (Won \u00f7 total)</div></div>
      <div class="kpi"><div class="val">${wonQuoteNos.size}</div><div class="lbl">Won quotes</div></div>
    </div>

    <div class="card">
      <b style="font-size:13px">Rep leaderboard \u2014 most quoted &amp; win rate by value</b>
      <table style="margin-top:8px"><thead><tr><th>Rep</th><th>Quotes</th><th>Quoted Value</th><th>Won Value</th><th>Win Rate ($)</th></tr></thead>
      <tbody>${repRows.map(r=>`<tr><td>${r.rep}</td><td>${r.quotes}</td><td>${fmt$(r.quotedValue)}</td><td>${fmt$(r.wonValue)}</td><td>${r.winRateValue.toFixed(1)}%</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Quote Type</b>
      <table style="margin-top:8px"><thead><tr><th>Quote Type</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byType).sort((a,b)=>b[1].quoted-a[1].quoted).map(([t,d])=>`<tr><td><span class="badge">${t}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Classification (Existing / Winback / New Business)</b>
      <table style="margin-top:8px"><thead><tr><th>Classification</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byClass).sort((a,b)=>b[1].quoted-a[1].quoted).map(([c,d])=>`<tr><td><span class="badge">${c}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="roadmap-card" style="margin-top:14px"><b>Why there's no "Lost" conversion rate</b>Business Central's lostCode field is populated on quotes that are still open (status stays "Quote Issued"/"Quote WIP") &mdash; reps are tagging a risk reason without ever closing the quote. There's no reliable way to compute a true Lost bucket until quotes actually get closed out in BC. See Data Quality for the full note.</div>
  `;
  document.getElementById('conv-date-from').addEventListener('change', e => { conversionDateFilter.from = e.target.value; renderConversion(); });
  document.getElementById('conv-date-to').addEventListener('change', e => { conversionDateFilter.to = e.target.value; renderConversion(); });
  const clearBtn = document.getElementById('conv-date-clear');
  if (clearBtn) clearBtn.addEventListener('click', (e) => { e.preventDefault(); conversionDateFilter = {from:'',to:''}; renderConversion(); });
}

function funnelStage(q) {
  if (q.invoiced) return { label: 'Shipped/Invoiced', color: '#D9EAD3' };
  if (q.orderExists) return { label: 'Order Created \u2014 not yet shipped', color: '#FFF3CD' };
  return { label: 'Won (order not found)', color: '#D9EAD3' };
}

      <div class="kpi"><div class="val">${q.followUpDate || '\u2014'}</div><div class="lbl">Follow-up date</div></div>
      <div class="kpi"><div class="val">${q.expirationDate}</div><div class="lbl">Expiration</div></div>
      <div class="kpi"><div class="val">${q.classification}</div><div class="lbl">Customer-level status (${q.daysSinceLastOrder!=null ? q.daysSinceLastOrder+'d since last order' : 'no order history'})</div></div>
    </div>
    <div style="font-weight:700;font-size:13px;margin:14px 0 8px">All lines on this quote${q.moreLinesValue ? ' <span style="color:var(--text-muted);font-weight:400;font-size:11px">(+'+fmt$(q.moreLinesValue)+' in additional lines not captured in this snapshot)</span>' : ''}</div>
    <table>
      <thead><tr><th>Line</th><th>Item</th><th>Qty</th><th>Unit Price</th><th>Line Value</th><th>Classification</th><th>Stock</th><th>Quote Type</th><th>Target Price</th><th>Comments</th></tr></thead>
      <tbody id="modal-lines-tbody"></tbody>
    </table>
    <div style="margin-top:14px;font-size:11px;color:var(--text-muted)">Editing here updates the same record as the Queue and Rep View tables &mdash; it's one shared store, not a separate copy.</div>

  `;
  const tbody = modal.querySelector('#modal-lines-tbody');
  sortedLines.forEach(l => {
    const key = lineKey(q,l);
    const edit = getEdit(key);
    const tr = document.createElement('tr');
    if (l.lineNo === focusLineNo) tr.style.background = '#FFF3E8';
    tr.innerHTML = `
      <td>${l.lineNo}</td>
      <td>${l.item}<br/><span style="color:var(--text-muted);font-size:11px">${l.desc}</span></td>
      <td>${l.qty}</td>
      <td>${fmt$(l.unitPrice)}</td>
      <td>${fmt$(l.lineAmount)}</td>
      <td><span class="badge">${l.itemClassification}</span></td>
      <td>${l.stock!=null ? l.stock : '\u2014'}</td>
      <td><select data-key="${key}" data-field="quoteType">
            <option value="" ${edit.quoteType===''?'selected':''}></option>
            <option value="Bid" ${edit.quoteType==='Bid'?'selected':''}>Bid</option>
            <option value="Buy" ${edit.quoteType==='Buy'?'selected':''}>Buy</option>
          </select></td>
      <td><input type="number" data-key="${key}" data-field="targetPrice" value="${edit.targetPrice}" placeholder="$"/></td>
      <td><textarea data-key="${key}" data-field="comments" placeholder="Notes...">${edit.comments}</textarea></td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('change', async e => {
      const k = e.target.dataset.key, f = e.target.dataset.field;
      if (!editState[k]) editState[k] = { quoteType:"", targetPrice:"", comments:"" };
      editState[k][f] = e.target.value;
      await saveEdits();
      renderQueue();
      if (document.getElementById('rep-table-container')) renderRepTable();
    });
  });
  modal.querySelector('#qoc-modal-close').addEventListener('click', closeDetail);
  const back = modal.querySelector('#back-to-customer');
  if (back) back.addEventListener('click', (e) => { e.preventDefault(); openCustomerDetail(lastCustomerView); });
  modalBackdrop.style.display = 'flex';
}

function openCustomerDetail(custNo) {
  lastCustomerView = custNo;
  const custQuotes = QUOTES.filter(q => q.custNo === custNo);
  if (!custQuotes.length) return;
  const customerName = custQuotes[0].customer;
  const owner = custQuotes[0].owner;
  const totalValue = custQuotes.reduce((s,q)=>s+q.quoteTotal,0);
  const modalBackdrop = document.getElementById('qoc-modal-backdrop');
  const modal = document.getElementById('qoc-modal');
  const sorted = custQuotes.slice().sort((a,b)=>b.quoteTotal-a.quoteTotal);
  modal.innerHTML = `
    <button id="qoc-modal-close" style="position:absolute;top:14px;right:14px;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text-muted)">&times;</button>
    <div style="font-size:18px;font-weight:700;color:var(--nav)">${customerName} <span style="color:var(--text-muted);font-weight:400;font-size:13px">${custNo}</span></div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:14px">Owner: ${owner} &middot; ${custQuotes.length} active $5K+ quote${custQuotes.length===1?'':'s'}</div>
    <div class="qoc-kpis" style="grid-template-columns:repeat(3,1fr)">
      <div class="kpi"><div class="val">${custQuotes.length}</div><div class="lbl">Active quotes</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total value</div></div>
      <div class="kpi"><div class="val">${custQuotes[0].classification}</div><div class="lbl">Customer status (${custQuotes[0].daysSinceLastOrder!=null ? custQuotes[0].daysSinceLastOrder+'d since order' : 'no history'})</div></div>
    </div>
    <div style="font-weight:700;font-size:13px;margin:14px 0 8px">All quotes for this customer</div>
    <table>
      <thead><tr><th>Quote</th><th>Status</th><th>Value</th><th>Lines</th><th>Follow-Up</th><th>Owner</th></tr></thead>
      <tbody id="customer-quotes-tbody"></tbody>
    </table>
  `;
  const tbody = modal.querySelector('#customer-quotes-tbody');
  sorted.forEach(q => {

    tr.innerHTML = `
      <td><a href="#" class="open-quote-from-customer" data-quote="${q.quoteNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.quoteNo}</a></td>
      <td>${q.status}</td>
      <td>${fmt$(q.quoteTotal)}</td>
      <td>${q.lines.length}</td>
      <td>${q.followUpDate || '<span style="color:var(--red)">none set</span>'}</td>
      <td>${q.owner}</td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.open-quote-from-customer').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.quote, null, custNo); });
  });
  modal.querySelector('#qoc-modal-close').addEventListener('click', closeDetail);
  modalBackdrop.style.display = 'flex';
}

function buildCoachingPanel(q) {
  const edit0 = getEdit(lineKey(q, q.lines[0]));
  const topLine = q.lines.slice().sort((a,b)=>b.lineAmount-a.lineAmount)[0];
  const fu = q.followUpDate ? daysBetween(q.followUpDate) : null;

  const qQuestions = [];
  qQuestions.push(edit0.quoteType ? `Confirmed as a <b>${edit0.quoteType}</b> \u2014 does the evidence on file still support that?` : `Is this a <b>Bid or a Buy</b>? Quote Type isn't set yet.`);
  qQuestions.push(q.classification === 'Winback' || q.lines.some(l=>l.itemClassification==='Winback') ? `This has Winback lines \u2014 what changed, and why did we stop getting this business?` : `What's the project or application driving this quote? (Confirm [Application/Project] with the customer \u2014 not captured in this pull.)`);
  qQuestions.push(`When is the expected award date? Expiration on file is <b>${q.expirationDate}</b>.`);

  const uQuestions = [];
  uQuestions.push(`How will ${q.customer} decide who wins this? Confirm price vs. other criteria with the customer.`);
  uQuestions.push(topLine.stock === 0 ? `Top line (<b>${topLine.item}</b>) shows <b>zero stock</b> \u2014 confirm lead time before presenting.` : `Stock on the top line (<b>${topLine.item}</b>) is ${topLine.stock}. Confirm that still covers the quoted quantity.`);

  const oQuestions = [];
  oQuestions.push(`Have all lines worth escalating been reviewed? Highest-value line here is <b>${fmt$(topLine.lineAmount)}</b> (${topLine.item}).`);
  if (q.moreLinesValue) oQuestions.push(`${fmt$(q.moreLinesValue)} on this quote isn't itemized in this view (freight or lines outside this pull) \u2014 confirm the full picture in BC directly.`);

  const tQuestions = [];
  tQuestions.push(`What's the value story beyond price for ${q.customer}? (Availability, lead time, support \u2014 confirm which applies with the customer.)`);

  const eQuestions = [];
  eQuestions.push(fu === null ? `<b>No Follow Up Date set.</b> Establish one before the next contact \u2014 never leave without a scheduled next step.` : fu < 0 ? `Follow-up is <b>overdue by ${Math.abs(fu)} day${Math.abs(fu)===1?'':'s'}</b>. What's the next action, and by when?` : fu === 0 ? `Follow-up is <b>due today</b>. What's the next action?` : `Follow-up scheduled for ${q.followUpDate}. Confirm that's still the right date.`);
  eQuestions.push(`Has the outcome been documented? Current BC status: <b>${q.status}</b>.`);

  return `
    <div class="card" style="margin-top:18px;background:var(--cream)">
      <b style="font-size:13px;color:var(--nav)">QUOTE + VALUE coaching \u2014 grounded in what's on file for this quote</b>
      <div class="section-sub" style="margin-top:4px">Phrased as questions to confirm with the customer or in BC \u2014 nothing here is invented.</div>
      <div style="margin-top:10px;font-size:12px">
        <div style="margin-bottom:8px"><b>Q \u2014 Qualify</b><ul style="margin:4px 0 0 18px">${qQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>U \u2014 Understand</b><ul style="margin:4px 0 0 18px">${uQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>O \u2014 Optimize</b><ul style="margin:4px 0 0 18px">${oQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>T \u2014 Tailor</b><ul style="margin:4px 0 0 18px">${tQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><b>E \u2014 Execute</b><ul style="margin:4px 0 0 18px">${eQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
    </div>
  `;
}

let managerQuick = null; // { kind: 'overdue'|'missingFU'|'flag', owner?, label? }

function renderManager() {
  const panel = document.getElementById('panel-manager');
  const byOwner = {};
  QUOTES.forEach(q => {
    byOwner[q.owner] = byOwner[q.owner] || { value: 0, count: 0, overdue: 0, missingFU: 0, zeroActivity: 0 };
    byOwner[q.owner].value += q.quoteTotal;
    byOwner[q.owner].count += 1;
    if (q.followUpDate && daysBetween(q.followUpDate) < 0) byOwner[q.owner].overdue += 1;
    if (!q.followUpDate) byOwner[q.owner].missingFU += 1;
  });
  const activeCustNos = new Set(QUOTES.map(q => q.custNo));
  ALL_ACCOUNTS.forEach(a => { if (!activeCustNos.has(a.custNo)) { byOwner[a.owner] = byOwner[a.owner] || { value:0, count:0, overdue:0, missingFU:0, zeroActivity:0 }; byOwner[a.owner].zeroActivity += 1; } });
  const repRows = Object.entries(byOwner).sort((a,b)=>b[1].value-a[1].value);

  // exception-based coaching queue: every line with at least one real flag, ranked by severity then value
  let queueRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => {
    const edit = getEdit(lineKey(q,l));
    const flags = computeFlags(q, edit);
    if (flags.length) queueRows.push({q, l, flags});
  }));
  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  queueRows.sort((a,b) => rank(a.flags)-rank(b.flags) || b.l.lineAmount-a.l.lineAmount);

  let filteredQueue = queueRows;
  let quickLabel = null;
  if (managerQuick) {
    if (managerQuick.kind === 'overdue') { filteredQueue = queueRows.filter(({q}) => q.followUpDate && daysBetween(q.followUpDate) < 0 && q.owner === managerQuick.owner); quickLabel = 'Overdue — ' + managerQuick.owner; }
    else if (managerQuick.kind === 'missingFU') { filteredQueue = queueRows.filter(({q}) => !q.followUpDate && q.owner === managerQuick.owner); quickLabel = 'Missing Follow-Up — ' + managerQuick.owner; }
    else if (managerQuick.kind === 'flag') { filteredQueue = queueRows.filter(({flags}) => flags.some(f => f.label === managerQuick.label)); quickLabel = managerQuick.label; }
  }
  const topQueue = filteredQueue.slice(0, 15);

  panel.innerHTML = `
    <div class="section-title">Manager View</div>
    <div class="section-sub">Team rollup and exception-based coaching queue across Adam, Kelli, Jerik, and Spencer's assigned accounts. Click an Overdue/Missing Follow-Up count below, or a flag badge in the queue, to filter the coaching queue.</div>
    <div class="card">
      <b style="font-size:13px">Team rollup by rep</b>
      <table style="margin-top:10px"><thead><tr><th>Rep</th><th>$5K+ Quotes</th><th>Active Value</th><th>Overdue</th><th>Missing Follow-Up</th><th>Zero-Activity Accounts</th></tr></thead>
      <tbody>${repRows.map(([owner,d])=>`<tr><td>${owner}</td><td>${d.count}</td><td>${fmt$(d.value)}</td><td>${d.overdue ? '<span class="flag overdue flag-clickable mgr-quick" data-quick-kind="overdue" data-quick-owner="'+owner+'">'+d.overdue+'</span>' : '0'}</td><td>${d.missingFU ? '<span class="flag missing flag-clickable mgr-quick" data-quick-kind="missingFU" data-quick-owner="'+owner+'">'+d.missingFU+'</span>' : '0'}</td><td>${d.zeroActivity || 0}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <b style="font-size:13px">Coaching queue &mdash; exceptions only, highest dollar value first (top 15 of ${filteredQueue.length}${quickLabel ? ' filtered' : ''})</b>
      <div class="section-sub" style="margin-top:4px">The 5 Manager Review questions: (1) Is this a Bid or a Buy, and what's the evidence? (2) How will the customer decide who wins? (3) What supports the pricing or discount being asked? (4) What's the story and value proposition? (5) What's the next action, by when, and what outcome are we trying to achieve?</div>
      ${quickLabel ? `<div class="showing-indicator">Showing: ${quickLabel} (${filteredQueue.length}) <a href="#" id="mgr-quick-clear" title="Clear this filter">&times;</a></div>` : ''}
      ${topQueue.map(({q,l,flags}) => `
        <div style="border-top:1px solid var(--border);padding:10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <a href="#" class="mgr-quote-link" data-quote="${q.quoteNo}" data-line="${l.lineNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.customer}</a>
            &mdash; ${q.quoteNo} &mdash; ${fmt$(l.lineAmount)} (${l.item}) &mdash; ${q.owner}<br/>
            <span style="font-size:12px;color:var(--text-muted)">Follow-up: ${q.followUpDate || 'none set'} (${q.followUpCode||'no code'}) &middot; Classification: ${l.itemClassification} &middot; Quote Type: ${getEdit(lineKey(q,l)).quoteType || 'not set'}</span>
          </div>
          <div style="text-align:right;white-space:nowrap">${flags.map(f=>`<span class="flag ${f.cls} flag-clickable mgr-flag" data-flag-label="${f.label}">${f.label}</span>`).join(' ')}</div>
        </div>`).join('')}
    </div>
  `;
  panel.querySelectorAll('.mgr-quote-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.quote, Number(a.dataset.line)); });
  });
  panel.querySelectorAll('.mgr-quick').forEach(el => {
    el.addEventListener('click', () => {
      const kind = el.dataset.quickKind, owner = el.dataset.quickOwner;
      managerQuick = (managerQuick && managerQuick.kind === kind && managerQuick.owner === owner) ? null : { kind, owner };
      renderManager();
    });
  });
  panel.querySelectorAll('.mgr-flag').forEach(el => {
    el.addEventListener('click', () => {
      const label = el.dataset.flagLabel;
      managerQuick = (managerQuick && managerQuick.kind === 'flag' && managerQuick.label === label) ? null : { kind: 'flag', label };
      renderManager();
    });
  });
  const mgrClear = document.getElementById('mgr-quick-clear');
  if (mgrClear) mgrClear.addEventListener('click', (e) => { e.preventDefault(); managerQuick = null; renderManager(); });
}

let lostQuick = null; // { kind: 'missingReason'|'missingLost'|'code', value? }

function renderLost() {
  const panel = document.getElementById('panel-lost');
  const lostRows = QUOTES.filter(q => q.lostCode);

  const missingReason = lostRows.filter(q => q.lostCode && !q.reasonCode);
  const missingLostCode = QUOTES.filter(q => q.reasonCode && !q.lostCode);
  const totalValue = lostRows.reduce((s,q) => s + q.quoteTotal, 0);

  let rows = lostRows;
  let quickLabel = null;
  if (lostQuick) {
    if (lostQuick.kind === 'missingReason') { rows = rows.filter(q => !q.reasonCode); quickLabel = 'Missing Reason Code'; }
    else if (lostQuick.kind === 'missingLost') { rows = missingLostCode; quickLabel = 'Missing Lost Code (has Reason Code)'; }
    else if (lostQuick.kind === 'code') { rows = rows.filter(q => q.lostCode === lostQuick.value); quickLabel = 'Lost Code: ' + lostQuick.value; }
  }

  // sort: flagged (missing reasonCode) first, then quoteTotal descending
  rows = rows.slice().sort((a,b) => {
    const aFlag = a.lostCode && !a.reasonCode ? 0 : 1;
    const bFlag = b.lostCode && !b.reasonCode ? 0 : 1;
    if (aFlag !== bFlag) return aFlag - bFlag;
    return b.quoteTotal - a.quoteTotal;
  });

  const codeBreakdown = {};
  lostRows.forEach(q => { codeBreakdown[q.lostCode] = (codeBreakdown[q.lostCode]||0) + 1; });
  const codeEntries = Object.entries(codeBreakdown).sort((a,b) => b[1]-a[1]);

  panel.innerHTML = `
    <div class="section-title">Lost Quotes</div>
    <div class="section-sub">Every active $5K+ quote with a <code>lostCode</code> set, pulled per-rep (same method as My Quote Queue). Status will still show Quote Issued/WIP &mdash; Business Central never actually closes these out (see Data Quality). Rows missing a Reason Code alongside their Lost Code are flagged and sorted first.</div>
    <div class="qoc-kpis">
      <div class="kpi warn"><div class="val">${lostRows.length}</div><div class="lbl">Lost-coded quotes</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total lost-coded value</div></div>
      <div class="kpi qoc-quick ${missingReason.length?'warn':''} ${lostQuick&&lostQuick.kind==='missingReason'?'qoc-quick-active':''}" data-quick="missingReason"><div class="val">${missingReason.length}</div><div class="lbl">Missing Reason Code</div></div>
      <div class="kpi qoc-quick ${missingLostCode.length?'warn':''} ${lostQuick&&lostQuick.kind==='missingLost'?'qoc-quick-active':''}" data-quick="missingLost"><div class="val">${missingLostCode.length}</div><div class="lbl">Reason Code set, Lost Code blank</div></div>
    </div>
    ${quickLabel ? `<div class="showing-indicator">Showing: ${quickLabel} (${rows.length}) <a href="#" id="lost-quick-clear" title="Clear this filter">&times;</a></div>` : ''}
    <div class="card">
      <b style="font-size:13px">Lost code breakdown &mdash; click a code to filter</b>
      <div style="margin-top:8px">${codeEntries.map(([code,n]) => `<span class="badge flag-clickable lost-code-badge" data-code="${code}" style="margin-right:6px;margin-bottom:6px;display:inline-block;${lostQuick&&lostQuick.kind==='code'&&lostQuick.value===code?'background:var(--accent);color:#fff':''}">${code} (${n})</span>`).join('')}</div>
    </div>
    <div style="overflow-x:auto"><table>
      <thead><tr><th></th><th>Quote #</th><th>Customer</th><th>Owner</th><th>Quote Total</th><th>Lost Code</th><th>Reason Code</th><th>Status</th><th></th></tr></thead>
      <tbody>
        ${rows.map(q => {
          const flagged = q.lostCode && !q.reasonCode;
          return `<tr${flagged ? ' style="background:#FFF3E8"' : ''}>
            <td><button class="drill-btn" data-quote="${q.quoteNo}" data-line="${q.lines[0]?q.lines[0].lineNo:0}" style="background:var(--cream);border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:4px 8px;font-size:12px;">&#8599;</button></td>
            <td><a href="#" class="lost-quote-link" data-quote="${q.quoteNo}" data-line="${q.lines[0]?q.lines[0].lineNo:0}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.quoteNo}</a></td>
            <td>${q.customer}</td>
            <td>${q.owner}</td>
            <td>${fmt$(q.quoteTotal)}</td>
            <td><span class="badge">${q.lostCode || '—'}</span></td>
            <td>${q.reasonCode ? '<span class="badge">'+q.reasonCode+'</span>' : '<span class="flag missing">Missing</span>'}</td>
            <td>${q.status}</td>
            <td>${flagged ? '<span class="flag missing">lostCode w/o reasonCode</span>' : ''}</td>
          </tr>`;
        }).join('') || '<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:20px">No lost-coded quotes match this filter.</td></tr>'}
      </tbody>
    </table></div>
  `;
  panel.querySelectorAll('.qoc-quick').forEach(el => {
    el.addEventListener('click', () => {
      const kind = el.dataset.quick;
      lostQuick = (lostQuick && lostQuick.kind === kind) ? null : { kind };
      renderLost();
    });
  });
  panel.querySelectorAll('.lost-code-badge').forEach(el => {
    el.addEventListener('click', () => {
      const code = el.dataset.code;
      lostQuick = (lostQuick && lostQuick.kind === 'code' && lostQuick.value === code) ? null : { kind: 'code', value: code };
      renderLost();
    });
  });
  const lostClear = document.getElementById('lost-quick-clear');
  if (lostClear) lostClear.addEventListener('click', (e) => { e.preventDefault(); lostQuick = null; renderLost(); });
  panel.querySelectorAll('.drill-btn, .lost-quote-link').forEach(el => {
    el.addEventListener('click', (e) => { e.preventDefault(); openDetail(el.dataset.quote, Number(el.dataset.line)); });
  });
}

function renderCustomers() {
  const panel = document.getElementById('panel-customers');

  // combine active + archive per customer
  const byCust = {};
  QUOTES.forEach(q => {
    byCust[q.custNo] = byCust[q.custNo] || { name: q.customer, owner: q.owner, lineCount: 0, quotedValue: 0, wonValue: 0, quoteNos: new Set() };
    byCust[q.custNo].lineCount += q.lines.length;
    byCust[q.custNo].quotedValue += q.quoteTotal;
    byCust[q.custNo].quoteNos.add(q.quoteNo);
  });
  ARCHIVE.forEach(q => {
    byCust[q.custNo] = byCust[q.custNo] || { name: q.customer, owner: q.owner, lineCount: 0, quotedValue: 0, wonValue: 0, quoteNos: new Set() };
    byCust[q.custNo].lineCount += q.lines.length;
    byCust[q.custNo].quotedValue += q.quoteTotal;
    byCust[q.custNo].quoteNos.add(q.quoteNo);
    if (q.outcome === 'Won') byCust[q.custNo].wonValue += q.quoteTotal;
  });

  const custRows = Object.entries(byCust).map(([custNo,d]) => ({
    custNo, ...d,
    conversion: d.quotedValue ? (d.wonValue/d.quotedValue*100) : 0
  }));
  custRows.sort((a,b) => b.lineCount - a.lineCount);

  const n = custRows.length;
  const top20Count = Math.max(1, Math.round(n * 0.2));
  const highActivity = custRows.slice(0, top20Count);
  const lowActivity = custRows.slice(-top20Count).reverse();

  const activeCustNos = new Set(Object.keys(byCust));
  const zeroActivity = ALL_ACCOUNTS.filter(a => !activeCustNos.has(a.custNo));
  const zeroByOwner = {};
  zeroActivity.forEach(a => { zeroByOwner[a.owner] = (zeroByOwner[a.owner]||0) + 1; });

  panel.innerHTML = `
    <div class="section-title">Customers</div>
    <div class="section-sub">${n} customers with active $5K+ quotes right now, out of ${ALL_ACCOUNTS.length} total accounts on the team's account package. High/low activity is top 20% / bottom 20% by quote-line count among the ${n} with activity.</div>

      <div class="kpi warn"><div class="val">${zeroActivity.length}</div><div class="lbl">Zero active quotes</div></div>
      <div class="kpi"><div class="val">${ALL_ACCOUNTS.length}</div><div class="lbl">Total accounts</div></div>

    </div>
    <div class="card" style="border-color:var(--red)">

      <div class="section-sub" style="margin-top:4px;margin-bottom:8px">No quote on file at $5,000+ right now. These are the true "why aren't we quoting this account at all" candidates \u2014 different from low activity, which at least has something moving.</div>
      <div style="margin-bottom:10px;font-size:12px;color:var(--text-muted)">By owner: ${Object.entries(zeroByOwner).sort((a,b)=>b[1]-a[1]).map(([o,c])=>`${o}: <b>${c}</b>`).join(' &nbsp;|&nbsp; ')}</div>
      <div style="max-height:320px;overflow-y:auto">
      <table><thead><tr><th>Customer</th><th>Account #</th><th>Owner</th></tr></thead>
      <tbody>${zeroActivity.slice().sort((a,b)=>a.owner.localeCompare(b.owner)||a.name.localeCompare(b.name)).map(a=>`<tr><td>${a.name}</td><td>${a.custNo}</td><td>${a.owner}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>
    <div class="card">
      <b style="font-size:13px">High activity \u2014 top 20% by line count</b>
      <table style="margin-top:8px"><thead><tr><th>Customer</th><th>Owner</th><th>Quotes</th><th>Lines</th><th>Value</th><th>Conversion</th></tr></thead>
      <tbody>${highActivity.map(c=>`<tr><td><a href="#" class="cust-link" data-custno="${c.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${c.name}</a></td><td>${c.owner}</td><td>${c.quoteNos.size}</td><td>${c.lineCount}</td><td>${fmt$(c.quotedValue)}</td><td>${c.conversion?c.conversion.toFixed(1)+'%':'\u2014'}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <b style="font-size:13px">Low activity (but not zero) \u2014 bottom 20% by line count</b>
      <div class="section-sub" style="margin-top:4px;margin-bottom:8px">Has at least one active $5K+ quote, but not much.</div>
      <table><thead><tr><th>Customer</th><th>Owner</th><th>Quotes</th><th>Lines</th><th>Value</th></tr></thead>
      <tbody>${lowActivity.map(c=>`<tr><td><a href="#" class="cust-link" data-custno="${c.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${c.name}</a></td><td>${c.owner}</td><td>${c.quoteNos.size}</td><td>${c.lineCount}</td><td>${fmt$(c.quotedValue)}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <b style="font-size:13px">All active customers \u2014 sortable by conversion</b>
      <table style="margin-top:8px"><thead><tr><th>Customer</th><th>Owner</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${custRows.slice().sort((a,b)=>b.conversion-a.conversion).map(c=>`<tr><td><a href="#" class="cust-link" data-custno="${c.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${c.name}</a></td><td>${c.owner}</td><td>${fmt$(c.quotedValue)}</td><td>${fmt$(c.wonValue)}</td><td>${c.conversion?c.conversion.toFixed(1)+'%':'\u2014'}</td></tr>`).join('')}</tbody></table>
    </div>
  `;
  panel.querySelectorAll('.cust-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openCustomerDetail(a.dataset.custno); });

function renderDQ() {
  const panel = document.getElementById('panel-dq');
  const issues = [];
  QUOTES.forEach(q => {
    if (!q.followUpDate) issues.push({sev:'high', text:`${q.quoteNo} (${q.customer}, ${fmt$(q.quoteTotal)}) has no Follow Up Date set at all.`});
    if (q.followUpDate && !q.followUpCode) issues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has a Follow Up Date but no Follow Up Code set.`});
    if (!q.followUpSalesperson) issues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has no Follow Up Salesperson assigned.`});
    if (normalizeOwner(q.owner) !== q.bcSalesperson) issues.push({sev:'high', text:`${q.quoteNo} (${q.customer}) is owned by ${q.owner} on the account package, but BC's Salesperson Code is ${q.bcSalesperson} \u2014 worth confirming who's actually working this.`});
  });
  issues.push({sev:'high', text:`Customer number collision found in SalesModel: C132371 resolves to both "Epirus" (active, 5 days since last order) and an unrelated legacy record "Environmental Dimensions Inc" (dormant since 2017). Same pattern on C129074 ("Anduril Industries" vs. a dormant "Hope College" record). Any join on customer number alone \u2014 without also checking the name \u2014 risks silently picking the wrong record.`});
  issues.push({sev:'high', text:`The original snapshot pull was capped at the most recent 2,000 LCOM quotes system-wide. Direct per-account lookups for all four reps recovered 69 additional active $5K+ quotes that fell outside that window \u2014 most dramatically a $1,181,986 V-Tron Electronics quote and a $954,912 Lockheed Martin quote, both invisible in the original pull. Anyone relying on the capped general pull instead of per-rep account lookups would have badly undercounted every rep's real pipeline, not just Jerik's.`});
  issues.push({sev:'high', text:`RE-VERIFIED on this refresh: same "SQ" \u2192 "SQIE" quote-numbering split as before. Fair comparison, same window as the SQIE system's actual lifespan (since April 2026): $12,643,122.95 in real revenue vs. $42,695.67 in confirmed Won SQIE quotes across the team's 133 accounts \u2014 0.34% (previously measured 0.33%; consistent). Confirmed via the company-wide Converted-to-Order pull (no $5K floor \u2014 see next item) cross-checked against salesOrders.quoteNo and invoices.quoteNo: exactly 5 Won matches for this team (Epirus, Penn Cable Assembly, Advanced Interconnect Manufacturing, Celestica LLC, Tobyhanna Army Depot), no hidden additional wins found.`});
  issues.push({sev:'high', text:`Confirmed on this refresh: the Won/Archive pull must run company-wide with NO $5,000 floor, separately from the $5K+ active-quote pull. Two of this refresh's 5 Won records \u2014 Advanced Interconnect Manufacturing ($4,375.07) and a newly surfaced Celestica LLC quote ($1,611.35) \u2014 are under the $5K active-quote threshold and would have been invisible if Won records were sourced from the same per-rep $5K+ query used for the active queue.`});
  issues.push({sev:'med', text:`Legacy "SQ"-numbered invoice pull refreshed: 491 invoices matched to the team's accounts, totaling $1,300,223.10, spanning documentDate 2023-01-03 through today \u2014 wider than the previous pull's April\u2013August 2026 window because this refresh's two-directional (asc/desc) date sweep reached further back. Legacy backlog is still actively invoicing as of this pull (most recent legacy-quote invoice dated 2026-08-25, the day of this refresh). Most of what's actually closing for these accounts right now is still pre-upgrade backlog, not new SQIE-quoted business.`});
  issues.push({sev:'high', text:`RE-VERIFIED on this refresh, same pattern as before: Business Central's lostCode field still cannot be used to compute a "Lost" bucket. All 21 of this pull's $5K+ quotes with a lostCode set (DEMANDCHG, NORESPX4, BUDGETARY, PROJ-DEL, PROJ-LOST, MOQ, EXPIRED, PROJ-CX, DISTY-CHAN, PRICING) still show status "Quote Issued", "Quote WIP", or "Pending Approval" \u2014 none are actually closed. Reps are tagging a risk reason without ever formally closing the quote out. Real Lost-based conversion tracking needs a process change (actually closing quotes as Lost), not a data fix. See the new Lost Quotes view.`});
  issues.push({sev:'high', text:`New on this refresh: all 21 of the $5K+ quotes carrying a lostCode are ALSO missing reasonCode (21 of 21, 100%). lostCode and reasonCode appear to be maintained independently in this BC instance \u2014 reps are logging why a deal is at risk (lostCode) but not the more granular reason (reasonCode) in the same pass. Flagged first in the Lost Quotes view.`});
  issues.push({sev:'med', text:`This refresh classified every line at the customer level only (no item-level SalesModel pull was re-run this pass, to stay inside the connector's per-query row and time budget). That means Winback/Repeated No-Win in this refresh reads "hasn't this customer ordered in the window" rather than the more precise "hasn't this exact part been ordered" \u2014 a real precision step back from the prior build's item-level pass on its original 28 quotes, which is being surfaced here rather than silently dropped. The underlying SalesModel ItemKey/ItemNumber join bug (Section 3b of the build spec) still needs a real fix before item-level classification can be safely re-extended.`});
  issues.push({sev:'med', text:`On Jerik's account package, Lockheed Martin and Raytheon Company FASTX show most of their quote activity attributed to other salespeople (JNORMAND, JSIELICKI, SBOYDEN, WSTANDLEY, LMENDENHAL) rather than JWONG. His own code shows up consistently on Epic Technologies, MAKO Surgical, IDEXX, Marshall Electronics, Martin Marietta, and IPG Photonics. Worth confirming with him whether Lockheed/Raytheon are actively his to work day-to-day or shared/nominal on the account package.`});
  panel.innerHTML = `
    <div class="section-title">Data Quality</div>
    <div class="section-sub">Gaps found in the live pull &mdash; corrected in Business Central, not in this app.</div>
    <div class="card">
      ${issues.map(i => `<div class="dq-item"><span class="dq-sev" style="background:${i.sev==='high'?'var(--red)':'var(--yellow)'}">${i.sev.toUpperCase()}</span>${i.text}</div>`).join('') || '<div class="dq-item">No issues found in this snapshot.</div>'}
    </div>
    <div class="card">
      <b style="font-size:13px">Known unavailable fields (not invented)</b>
      <div class="dq-item">"Describe the Opportunity" \u2014 not present on salesHeader2 in this BC instance.</div>
      <div class="dq-item">Customer Part No., NCNR/freight flags, brand/region/department fields \u2014 not present on salesQuoteLine; these only appear once a quote converts to salesOrderLine.</div>
      <div class="dq-item">Demand Creation flag \u2014 no reliable connected source yet.</div>
    </div>
  `;
}

document.querySelectorAll('.qoc-tab').forEach(btn => {

    document.querySelectorAll('.qoc-tab').forEach(b=>b.classList.remove('active'));

    ['queue','reps','winback','norewin','conversion','manager','lost','customers','dq','archive','roadmap'].forEach(t => {
      document.getElementById('panel-'+t).style.display = (t === btn.dataset.tab) ? 'block' : 'none';
    });
  });
});

document.getElementById('snapshot-note').innerHTML =
  "<b>Live data snapshot &mdash; refreshed " + TODAY.toISOString().slice(0,10) + "</b> &mdash; 101 active $5,000+ quotes ($3.74M) across Adam, Kelli, Jerik, and Spencer's assigned accounts, pulled per-rep from Business Central Explorer and cross-checked against SalesModel order history. " +
  "21 of those quotes carry a lostCode, and every one of them is still sitting in Quote Issued/WIP status in BC (see Lost Quotes and Data Quality). Pulled per-rep, not broadly, to avoid BC's 2,000-row query cap silently dropping data.";

(async () => {
