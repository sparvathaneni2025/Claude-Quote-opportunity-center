<style>
  :root {
    --bg: #FAF7F2;
    --nav: #2B2B2B;
    --accent: #C1541C;
    --card: #FFFFFF;
    --cream: #FFF9F2;
    --border: #E5DDD3;
    --text: #2B2B2B;
    --text-muted: #7A7267;
    --red: #C1392B;
    --orange: #C1541C;
    --yellow: #B8860B;
    --green: #4C7A3D;
    --gray: #9B9186;
  }
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #qoc { background: var(--bg); color: var(--text); border-radius: 12px; overflow: hidden; }
  .qoc-nav { background: var(--nav); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .qoc-nav .brand { font-weight: 700; font-size: 15px; margin-right: 16px; color: #fff; letter-spacing: 0.3px; }
  .qoc-tab { background: transparent; border: none; color: #cfc9c0; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .qoc-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .qoc-tab:hover:not(.active) { background: #3d3d3d; color: #fff; }
  .qoc-body { padding: 20px; }
  .qoc-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .val { font-size: 22px; font-weight: 700; color: var(--nav); }
  .kpi .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .kpi.warn .val { color: var(--red); }
  .kpi-filter { cursor: pointer; transition: box-shadow 0.1s, border-color 0.1s; }
  .kpi-filter:hover { border-color: var(--accent); }
  .kpi-filter-active { border: 2px solid var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .flag-filter { cursor: pointer; }
  .flag-filter:hover { opacity: 0.8; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; }
  thead th { background: var(--cream); text-align: left; padding: 10px 8px; font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid var(--border); }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: #FFFBF6; }
  .flag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .flag.overdue { background: var(--red); }
  .flag.today { background: var(--orange); }
  .flag.missing { background: var(--yellow); }
  .flag.ok { background: var(--green); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: #EFE6DA; color: var(--nav); font-weight: 600; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 32px; }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--nav); }
  .section-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .dq-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .dq-item:last-child { border-bottom: none; }
  .dq-sev { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 8px; }
  .roadmap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .roadmap-card { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--text-muted); font-size: 12px; background: var(--cream); }
  .roadmap-card b { display: block; color: var(--nav); font-size: 13px; margin-bottom: 4px; }
  .save-status { font-size: 11px; color: var(--green); margin-left: 8px; }
  .refresh-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .snapshot-note { font-size: 11px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
</style>

<div id="qoc">
  <div class="qoc-nav">

    <button class="qoc-tab" data-tab="archive">Archive</button>
    <button class="qoc-tab" data-tab="roadmap">Roadmap</button>

    <div id="panel-conversion" style="display:none"></div>
    <div id="panel-manager" style="display:none"></div>
    <div id="panel-lost" style="display:none"></div>
    <div id="panel-customers" style="display:none"></div>
    <div id="panel-dq" style="display:none"></div>
    <div id="panel-archive" style="display:none"></div>
    <div id="panel-roadmap" style="display:none"></div>
  </div>
</div>

const TODAY = new Date("2026-09-15");
const STORAGE_KEY = "qoc-line-edits-v1";
let editState = {}; // key: quoteNo|lineNo -> {quoteType, targetPrice, comments}

function lineKey(q, l) { return q.quoteNo + "|" + l.lineNo; }
function daysBetween(dateStr) {
  const d = new Date(dateStr);
  return Math.round((d - TODAY) / 86400000);
}
function fmt$(n) { return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }

function computeFlags(q, edit) {
  const flags = [];
  if (!q.followUpDate) { flags.push({label: "Missing Follow-Up Date", cls: "missing"}); }
  else {
    const fu = daysBetween(q.followUpDate);
    if (fu < 0) flags.push({label: "Overdue " + Math.abs(fu) + "d", cls: "overdue"});
    else if (fu === 0) flags.push({label: "Due today", cls: "today"});
  }
  if (!q.followUpCode) flags.push({label: "Missing Follow-Up Code", cls: "missing"});
  if (!q.followUpSalesperson) flags.push({label: "Missing Follow-Up Rep", cls: "missing"});
  const exp = daysBetween(q.expirationDate);
  if (exp >= 0 && exp <= 5) flags.push({label: "Expires in " + exp + "d", cls: "today"});
  if (normalizeOwner(q.owner) !== q.bcSalesperson) {
    flags.push({label: "Owner \u2260 BC Salesperson", cls: "missing"});
  }
  if (edit && !edit.quoteType) flags.push({label: "Missing Bid/Buy", cls: "missing"});
  return flags;
}
function normalizeOwner(owner) {
  const map = {"Adam Purcell":"APURCELL","Kelli Jones":"KJONES","Jerik Wong":"JWONG","Spencer Doty":"SDOTY"};
  return map[owner] || owner;
}

// Interactive filters (v1): KPI tiles and inline flag badges are clickable filters across
// My Quote Queue, Rep View, Manager View, and Lost Quotes. Clicking normalizes a flag label
// down to one of these kinds; clicking the same kind again clears it. Only one active at a time.
function flagFilterKind(label) {
  if (label.startsWith('Overdue')) return 'Overdue';
  if (label === 'Due today') return 'Due Today';
  if (label.startsWith('Expires in')) return 'Expiring Soon';
  if (label.startsWith('Missing Follow-Up')) return 'Missing Follow-Up';
  if (label === 'Owner ≠ BC Salesperson') return 'Owner Mismatch';
  if (label === 'Missing Bid/Buy') return 'Missing Bid/Buy';
  return label;
}
function filterIndicatorHtml(idPrefix, label, count) {
  return `<span style="font-size:12px;color:var(--accent);font-weight:600">Showing: ${label} (${count})</span> <a href="#" id="${idPrefix}-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">&times; clear</a>`;
}

async function loadEdits() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) editState = JSON.parse(result.value);
  } catch (e) { editState = {}; }
}
async function saveEdits() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(editState)); } catch (e) {}
}
function getEdit(key) {
  return editState[key] || { quoteType: "", targetPrice: "", comments: "" };
}

const tableFilters = {}; // containerId -> { quoteType: 'All', classification: 'All', customer: 'All' }

function renderQuoteTable(containerId, quoteList, titleHtml, subHtml) {
  const panel = document.getElementById(containerId);
  if (!tableFilters[containerId]) tableFilters[containerId] = { quoteType: 'All', classification: 'All', customer: 'All', flagFilter: null };
  const filt = tableFilters[containerId];

  let rows = [];
  quoteList.forEach(q => {
    q.lines.forEach(l => {
      const edit = getEdit(lineKey(q,l));
      rows.push({q, l, flags: computeFlags(q, edit), edit});
    });
  });

  // apply filters
  if (filt.quoteType !== 'All') {
    rows = rows.filter(({edit}) => (edit.quoteType || '(blank)') === filt.quoteType);
  }
  if (filt.classification !== 'All') {
    rows = rows.filter(({l}) => l.itemClassification === filt.classification);
  }
  if (filt.customer !== 'All') {
    rows = rows.filter(({q}) => q.custNo === filt.customer);
  }
  if (filt.flagFilter) {
    rows = rows.filter(({flags}) => flags.some(f => flagFilterKind(f.label) === filt.flagFilter));
  }

  const customerOptions = [...new Map(quoteList.map(q => [q.custNo, q.customer])).entries()]
    .sort((a,b) => a[1].localeCompare(b[1]));

  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  rows.sort((a,b) => rank(a.flags) - rank(b.flags) || b.l.lineAmount - a.l.lineAmount);

  const overdueCount = quoteList.filter(q => q.followUpDate && daysBetween(q.followUpDate) < 0).length;
  const missingFUCount = quoteList.filter(q => !q.followUpDate).length;
  const todayCount = quoteList.filter(q => q.followUpDate && daysBetween(q.followUpDate) === 0).length;
  const totalValue = quoteList.reduce((s,q)=>s+q.quoteTotal,0);
  const expiringCount = quoteList.filter(q => { const e = daysBetween(q.expirationDate); return e >= 0 && e <= 5; }).length;
  const filteredValue = rows.reduce((s,{l})=>s+l.lineAmount,0);

  panel.innerHTML = `
    ${titleHtml}
    ${subHtml}
    <div class="qoc-kpis">
      <div class="kpi ${overdueCount?'warn':''} kpi-filter ${filt.flagFilter==='Overdue'?'kpi-filter-active':''}" data-flagkind="Overdue" title="Click to filter to Overdue rows"><div class="val">${overdueCount}</div><div class="lbl">Overdue follow-up</div></div>
      <div class="kpi ${todayCount?'warn':''} kpi-filter ${filt.flagFilter==='Due Today'?'kpi-filter-active':''}" data-flagkind="Due Today" title="Click to filter to Due Today rows"><div class="val">${todayCount}</div><div class="lbl">Due today</div></div>
      <div class="kpi ${missingFUCount?'warn':''} kpi-filter ${filt.flagFilter==='Missing Follow-Up'?'kpi-filter-active':''}" data-flagkind="Missing Follow-Up" title="Click to filter to Missing Follow-Up rows"><div class="val">${missingFUCount}</div><div class="lbl">Missing follow-up</div></div>
      <div class="kpi ${expiringCount?'warn':''} kpi-filter ${filt.flagFilter==='Expiring Soon'?'kpi-filter-active':''}" data-flagkind="Expiring Soon" title="Click to filter to Expiring Soon rows"><div class="val">${expiringCount}</div><div class="lbl">Expiring &le;5 days</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Active quote value</div></div>
      <div class="kpi"><div class="val">${quoteList.length}</div><div class="lbl">Quotes ($5K+)</div></div>
      <div class="kpi"><div class="val">${rows.length}</div><div class="lbl">Lines shown</div></div>
    </div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted)">FILTER:</span>
      <label style="font-size:12px;color:var(--text-muted)">Quote Type
        <select id="${containerId}-filter-type" style="margin-left:6px">
          <option value="All" ${filt.quoteType==='All'?'selected':''}>All</option>
          <option value="Bid" ${filt.quoteType==='Bid'?'selected':''}>Bid</option>
          <option value="Buy" ${filt.quoteType==='Buy'?'selected':''}>Buy</option>
          <option value="(blank)" ${filt.quoteType==='(blank)'?'selected':''}>Not set</option>
        </select>
      </label>
      <label style="font-size:12px;color:var(--text-muted)">Classification
        <select id="${containerId}-filter-class" style="margin-left:6px">
          <option value="All" ${filt.classification==='All'?'selected':''}>All</option>
          <option value="Existing Business" ${filt.classification==='Existing Business'?'selected':''}>Existing Business</option>
          <option value="Winback" ${filt.classification==='Winback'?'selected':''}>Winback</option>
          <option value="New Business" ${filt.classification==='New Business'?'selected':''}>New Business</option>
        </select>
      </label>
      <label style="font-size:12px;color:var(--text-muted)">Customer
        <select id="${containerId}-filter-customer" style="margin-left:6px;max-width:220px">
          <option value="All" ${filt.customer==='All'?'selected':''}>All</option>
          ${customerOptions.map(([custNo,name]) => `<option value="${custNo}" ${filt.customer===custNo?'selected':''}>${name}</option>`).join('')}
        </select>
      </label>
      ${(filt.quoteType!=='All'||filt.classification!=='All'||filt.customer!=='All') ? `<span style="font-size:12px;color:var(--accent);font-weight:600">${fmt$(filteredValue)} in filtered view</span> <a href="#" id="${containerId}-filter-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear filters</a>` : ''}
      ${filt.flagFilter ? filterIndicatorHtml(containerId+'-flagfilter', filt.flagFilter, rows.length) : ''}
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th></th><th>Flags</th><th>Customer</th><th>Quote / Line</th><th>Item</th><th>Qty</th><th>Line Value</th>
        <th>Stock</th><th>Classification</th><th>Owner</th><th>Follow-Up</th><th>Quote Type</th><th>Target Price</th><th>Comments</th>
      </tr></thead>
      <tbody id="${containerId}-tbody"></tbody>
    </table>
    </div>
  `;
  document.getElementById(containerId+'-filter-type').addEventListener('change', e => {
    tableFilters[containerId].quoteType = e.target.value;
    renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
  });

let conversionDateFilter = { from: '', to: '' };

function renderConversion() {
  const panel = document.getElementById('panel-conversion');

  // combine active + archive, tag each with outcome
  const activeRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => activeRows.push({q, l, outcome:'Open', edit:getEdit(lineKey(q,l))})));
  const archiveRows = [];
  ARCHIVE.forEach(q => q.lines.forEach(l => archiveRows.push({q, l, outcome:q.outcome, edit:{quoteType:''}})));
  let allRows = activeRows.concat(archiveRows);

  // date range filter on dueDate
  if (conversionDateFilter.from) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate >= conversionDateFilter.from);
  if (conversionDateFilter.to) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate <= conversionDateFilter.to);

  const wonRows = allRows.filter(r => r.outcome === 'Won');
  const wonValue = wonRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const totalValue = allRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const wonQuoteNos = new Set(ARCHIVE.filter(q=>q.outcome==='Won').map(q=>q.quoteNo));
  const totalQuoteNos = new Set([...QUOTES.map(q=>q.quoteNo), ...ARCHIVE.map(q=>q.quoteNo)]);

  // rep leaderboard: most quoted (all-time, all statuses) + win rate
  const byRep = {};
  allRows.forEach(({q,l,outcome}) => {
    byRep[q.owner] = byRep[q.owner] || {quotedLines:0, quotedValue:0, wonLines:0, wonValue:0, quoteNos:new Set()};
    byRep[q.owner].quotedLines += 1;
    byRep[q.owner].quotedValue += l.lineAmount;
    byRep[q.owner].quoteNos.add(q.quoteNo);
    if (outcome === 'Won') { byRep[q.owner].wonLines += 1; byRep[q.owner].wonValue += l.lineAmount; }
  });
  const repRows = Object.entries(byRep).map(([rep,d]) => ({
    rep, quotes: d.quoteNos.size, quotedValue: d.quotedValue,
    winRateValue: d.quotedValue ? (d.wonValue/d.quotedValue*100) : 0,
    wonValue: d.wonValue
  })).sort((a,b) => b.quotedValue - a.quotedValue);

  // conversion by quote type (Bid/Buy/blank)
  const byType = {};
  allRows.forEach(({l,edit,outcome}) => {
    const t = edit.quoteType || '(not set)';
    byType[t] = byType[t] || {quoted:0, won:0};
    byType[t].quoted += l.lineAmount;
    if (outcome === 'Won') byType[t].won += l.lineAmount;
  });

  // conversion by classification
  const byClass = {};
  allRows.forEach(({l,outcome}) => {
    byClass[l.itemClassification] = byClass[l.itemClassification] || {quoted:0, won:0};
    byClass[l.itemClassification].quoted += l.lineAmount;
    if (outcome === 'Won') byClass[l.itemClassification].won += l.lineAmount;
  });

  const pct = (num, den) => den ? ((num/den)*100).toFixed(1)+'%' : '\u2014';

  panel.innerHTML = `
    <div class="section-title">Conversion</div>
    <div class="section-sub">Active + Archive combined. Date range filters by Due Date (the closest proxy available to a true quote-creation date in this pull). Real conversion is thin right now: only ${wonQuoteNos.size} of ${totalQuoteNos.size} tracked quotes have a confirmed Won outcome in Business Central. Debugged and confirmed against real revenue for the same accounts, same time window (since the ERP upgrade to the current SQIE quote numbering, April 2026): $14.26M in actual revenue vs. $42,715.06 in confirmed Won quotes \u2014 0.30%. See Data Quality for the full breakdown, including an earlier version of this comparison that was corrected.</div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted)">DATE RANGE (Due Date):</span>
      <label style="font-size:12px;color:var(--text-muted)">From <input type="date" id="conv-date-from" value="${conversionDateFilter.from}" style="margin-left:4px"/></label>
      <label style="font-size:12px;color:var(--text-muted)">To <input type="date" id="conv-date-to" value="${conversionDateFilter.to}" style="margin-left:4px"/></label>
      ${(conversionDateFilter.from||conversionDateFilter.to) ? `<a href="#" id="conv-date-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear</a>` : ''}
    </div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total tracked value</div></div>
      <div class="kpi"><div class="val">${fmt$(wonValue)}</div><div class="lbl">Won value</div></div>
      <div class="kpi"><div class="val">${pct(wonValue,totalValue)}</div><div class="lbl">$ conversion (Won \u00f7 total)</div></div>
      <div class="kpi"><div class="val">${wonQuoteNos.size}</div><div class="lbl">Won quotes</div></div>
    </div>

    <div class="card">
      <b style="font-size:13px">Rep leaderboard \u2014 most quoted &amp; win rate by value</b>
      <table style="margin-top:8px"><thead><tr><th>Rep</th><th>Quotes</th><th>Quoted Value</th><th>Won Value</th><th>Win Rate ($)</th></tr></thead>
      <tbody>${repRows.map(r=>`<tr><td>${r.rep}</td><td>${r.quotes}</td><td>${fmt$(r.quotedValue)}</td><td>${fmt$(r.wonValue)}</td><td>${r.winRateValue.toFixed(1)}%</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Quote Type</b>
      <table style="margin-top:8px"><thead><tr><th>Quote Type</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byType).sort((a,b)=>b[1].quoted-a[1].quoted).map(([t,d])=>`<tr><td><span class="badge">${t}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Classification (Existing / Winback / New Business)</b>
      <table style="margin-top:8px"><thead><tr><th>Classification</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byClass).sort((a,b)=>b[1].quoted-a[1].quoted).map(([c,d])=>`<tr><td><span class="badge">${c}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="roadmap-card" style="margin-top:14px"><b>Why there's no "Lost" conversion rate</b>Business Central's lostCode field is populated on quotes that are still open (status stays "Quote Issued"/"Quote WIP"/even "Pending Approval") &mdash; reps are tagging a risk reason without ever closing the quote. Re-checked on this refresh: 29 of the team's 116 active $5K+ quotes have a lostCode set, and every single one is still open. There's no reliable way to compute a true Lost bucket until quotes actually get closed out in BC. See Data Quality for the full note.</div>
  `;
  document.getElementById('conv-date-from').addEventListener('change', e => { conversionDateFilter.from = e.target.value; renderConversion(); });
  document.getElementById('conv-date-to').addEventListener('change', e => { conversionDateFilter.to = e.target.value; renderConversion(); });
  const clearBtn = document.getElementById('conv-date-clear');
  if (clearBtn) clearBtn.addEventListener('click', (e) => { e.preventDefault(); conversionDateFilter = {from:'',to:''}; renderConversion(); });
}

function buildCoachingPanel(q) {
  const edit0 = getEdit(lineKey(q, q.lines[0]));
  const topLine = q.lines.slice().sort((a,b)=>b.lineAmount-a.lineAmount)[0];
  const fu = q.followUpDate ? daysBetween(q.followUpDate) : null;

  const qQuestions = [];
  qQuestions.push(edit0.quoteType ? `Confirmed as a <b>${edit0.quoteType}</b> \u2014 does the evidence on file still support that?` : `Is this a <b>Bid or a Buy</b>? Quote Type isn't set yet.`);
  qQuestions.push(q.classification === 'Winback' || q.lines.some(l=>l.itemClassification==='Winback') ? `This has Winback lines \u2014 what changed, and why did we stop getting this business?` : `What's the project or application driving this quote? (Confirm [Application/Project] with the customer \u2014 not captured in this pull.)`);
  qQuestions.push(`When is the expected award date? Expiration on file is <b>${q.expirationDate}</b>.`);

  const uQuestions = [];
  uQuestions.push(`How will ${q.customer} decide who wins this? Confirm price vs. other criteria with the customer.`);
  uQuestions.push(topLine.stock === 0 ? `Top line (<b>${topLine.item}</b>) shows <b>zero stock</b> \u2014 confirm lead time before presenting.` : `Stock on the top line (<b>${topLine.item}</b>) is ${topLine.stock}. Confirm that still covers the quoted quantity.`);

  const oQuestions = [];
  oQuestions.push(`Have all lines worth escalating been reviewed? Highest-value line here is <b>${fmt$(topLine.lineAmount)}</b> (${topLine.item}).`);
  if (q.moreLinesValue) oQuestions.push(`${fmt$(q.moreLinesValue)} on this quote isn't itemized in this view (freight or lines outside this pull) \u2014 confirm the full picture in BC directly.`);

  const tQuestions = [];
  tQuestions.push(`What's the value story beyond price for ${q.customer}? (Availability, lead time, support \u2014 confirm which applies with the customer.)`);

  const eQuestions = [];
  eQuestions.push(fu === null ? `<b>No Follow Up Date set.</b> Establish one before the next contact \u2014 never leave without a scheduled next step.` : fu < 0 ? `Follow-up is <b>overdue by ${Math.abs(fu)} day${Math.abs(fu)===1?'':'s'}</b>. What's the next action, and by when?` : fu === 0 ? `Follow-up is <b>due today</b>. What's the next action?` : `Follow-up scheduled for ${q.followUpDate}. Confirm that's still the right date.`);
  eQuestions.push(`Has the outcome been documented? Current BC status: <b>${q.status}</b>.`);

  return `
    <div class="card" style="margin-top:18px;background:var(--cream)">
      <b style="font-size:13px;color:var(--nav)">QUOTE + VALUE coaching \u2014 grounded in what's on file for this quote</b>
      <div class="section-sub" style="margin-top:4px">Phrased as questions to confirm with the customer or in BC \u2014 nothing here is invented.</div>
      <div style="margin-top:10px;font-size:12px">
        <div style="margin-bottom:8px"><b>Q \u2014 Qualify</b><ul style="margin:4px 0 0 18px">${qQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>U \u2014 Understand</b><ul style="margin:4px 0 0 18px">${uQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>O \u2014 Optimize</b><ul style="margin:4px 0 0 18px">${oQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>T \u2014 Tailor</b><ul style="margin:4px 0 0 18px">${tQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><b>E \u2014 Execute</b><ul style="margin:4px 0 0 18px">${eQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
    </div>
  `;
}

let managerFlagFilter = null;
function renderManager() {
  const panel = document.getElementById('panel-manager');
  const byOwner = {};
  QUOTES.forEach(q => {
    byOwner[q.owner] = byOwner[q.owner] || { value: 0, count: 0, overdue: 0, missingFU: 0, zeroActivity: 0 };
    byOwner[q.owner].value += q.quoteTotal;
    byOwner[q.owner].count += 1;
    if (q.followUpDate && daysBetween(q.followUpDate) < 0) byOwner[q.owner].overdue += 1;
    if (!q.followUpDate) byOwner[q.owner].missingFU += 1;
  });
  const activeCustNos = new Set(QUOTES.map(q => q.custNo));
  ALL_ACCOUNTS.forEach(a => { if (!activeCustNos.has(a.custNo)) { byOwner[a.owner] = byOwner[a.owner] || { value:0, count:0, overdue:0, missingFU:0, zeroActivity:0 }; byOwner[a.owner].zeroActivity += 1; } });
  const repRows = Object.entries(byOwner).sort((a,b)=>b[1].value-a[1].value);

  const teamOverdue = QUOTES.filter(q => q.followUpDate && daysBetween(q.followUpDate) < 0).length;
  const teamToday = QUOTES.filter(q => q.followUpDate && daysBetween(q.followUpDate) === 0).length;
  const teamMissingFU = QUOTES.filter(q => !q.followUpDate).length;
  const teamExpiring = QUOTES.filter(q => { const e = daysBetween(q.expirationDate); return e >= 0 && e <= 5; }).length;

  // exception-based coaching queue: every line with at least one real flag, ranked by severity then value
  let queueRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => {
    const edit = getEdit(lineKey(q,l));
    const flags = computeFlags(q, edit);
    if (flags.length) queueRows.push({q, l, flags});
  }));
  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  queueRows.sort((a,b) => rank(a.flags)-rank(b.flags) || b.l.lineAmount-a.l.lineAmount);
  const filteredQueueRows = managerFlagFilter
    ? queueRows.filter(({flags}) => flags.some(f => flagFilterKind(f.label) === managerFlagFilter))
    : null;
  const displayQueue = filteredQueueRows || queueRows.slice(0, 15);
  const queueHeader = filteredQueueRows
    ? filterIndicatorHtml('mgr-flagfilter', managerFlagFilter, filteredQueueRows.length)
    : `top 15 of ${queueRows.length}`;

  panel.innerHTML = `
    <div class="section-title">Manager View</div>
    <div class="section-sub">Team rollup and exception-based coaching queue across Adam, Kelli, Jerik, and Spencer's assigned accounts.</div>
    <div class="qoc-kpis">
      <div class="kpi ${teamOverdue?'warn':''} kpi-filter ${managerFlagFilter==='Overdue'?'kpi-filter-active':''}" data-flagkind="Overdue" title="Click to filter the coaching queue to Overdue rows"><div class="val">${teamOverdue}</div><div class="lbl">Overdue follow-up</div></div>
      <div class="kpi ${teamToday?'warn':''} kpi-filter ${managerFlagFilter==='Due Today'?'kpi-filter-active':''}" data-flagkind="Due Today" title="Click to filter the coaching queue to Due Today rows"><div class="val">${teamToday}</div><div class="lbl">Due today</div></div>
      <div class="kpi ${teamMissingFU?'warn':''} kpi-filter ${managerFlagFilter==='Missing Follow-Up'?'kpi-filter-active':''}" data-flagkind="Missing Follow-Up" title="Click to filter the coaching queue to Missing Follow-Up rows"><div class="val">${teamMissingFU}</div><div class="lbl">Missing follow-up</div></div>
      <div class="kpi ${teamExpiring?'warn':''} kpi-filter ${managerFlagFilter==='Expiring Soon'?'kpi-filter-active':''}" data-flagkind="Expiring Soon" title="Click to filter the coaching queue to Expiring Soon rows"><div class="val">${teamExpiring}</div><div class="lbl">Expiring &le;5 days</div></div>
    </div>
    <div class="card">
      <b style="font-size:13px">Team rollup by rep</b>
      <table style="margin-top:10px"><thead><tr><th>Rep</th><th>$5K+ Quotes</th><th>Active Value</th><th>Overdue</th><th>Missing Follow-Up</th><th>Zero-Activity Accounts</th></tr></thead>
      <tbody>${repRows.map(([owner,d])=>`<tr><td>${owner}</td><td>${d.count}</td><td>${fmt$(d.value)}</td><td>${d.overdue ? '<span class="flag overdue flag-filter" data-flagkind="Overdue">'+d.overdue+'</span>' : '0'}</td><td>${d.missingFU ? '<span class="flag missing flag-filter" data-flagkind="Missing Follow-Up">'+d.missingFU+'</span>' : '0'}</td><td>${d.zeroActivity || 0}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <b style="font-size:13px">Coaching queue &mdash; exceptions only, highest dollar value first (${queueHeader})</b>
      <div class="section-sub" style="margin-top:4px">The 5 Manager Review questions: (1) Is this a Bid or a Buy, and what's the evidence? (2) How will the customer decide who wins? (3) What supports the pricing or discount being asked? (4) What's the story and value proposition? (5) What's the next action, by when, and what outcome are we trying to achieve?</div>
      ${displayQueue.map(({q,l,flags}) => `
        <div style="border-top:1px solid var(--border);padding:10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <a href="#" class="mgr-quote-link" data-quote="${q.quoteNo}" data-line="${l.lineNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.customer}</a>
            &mdash; ${q.quoteNo} &mdash; ${fmt$(l.lineAmount)} (${l.item}) &mdash; ${q.owner}<br/>
            <span style="font-size:12px;color:var(--text-muted)">Follow-up: ${q.followUpDate || 'none set'} (${q.followUpCode||'no code'}) &middot; Classification: ${l.itemClassification} &middot; Quote Type: ${getEdit(lineKey(q,l)).quoteType || 'not set'}</span>
          </div>
          <div style="text-align:right;white-space:nowrap">${flags.map(f=>`<span class="flag ${f.cls} flag-filter" data-flagkind="${flagFilterKind(f.label)}">${f.label}</span>`).join(' ')}</div>
        </div>`).join('') || '<div style="padding:14px 0;color:var(--text-muted);font-size:13px">No exceptions match this filter.</div>'}
    </div>
  `;
  panel.querySelectorAll('.mgr-quote-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.quote, Number(a.dataset.line)); });
  });
  panel.querySelectorAll('.kpi-filter[data-flagkind], .flag-filter[data-flagkind]').forEach(el => {
    el.addEventListener('click', () => {
      const kind = el.dataset.flagkind;
      managerFlagFilter = (managerFlagFilter === kind) ? null : kind;
      renderManager();
    });
  });
  const flagClearBtn = document.getElementById('mgr-flagfilter-clear');
  if (flagClearBtn) flagClearBtn.addEventListener('click', (e) => { e.preventDefault(); managerFlagFilter = null; renderManager(); });
}

let lostShowFlaggedOnly = false;
function renderLost() {
  const panel = document.getElementById('panel-lost');
  const lostQuotes = QUOTES.filter(q => q.lostCode && q.lostCode.trim() !== '');
  const isFlagged = q => !q.reasonCode || q.reasonCode.trim() === '';
  const flaggedCount = lostQuotes.filter(isFlagged).length;
  const totalValue = lostQuotes.reduce((s,q)=>s+q.quoteTotal,0);

  let rows = lostShowFlaggedOnly ? lostQuotes.filter(isFlagged) : lostQuotes.slice();
  rows.sort((a,b) => (isFlagged(b)-isFlagged(a)) || (b.quoteTotal - a.quoteTotal));

  panel.innerHTML = `
    <div class="section-title">Lost Quotes</div>
    <div class="section-sub">Quotes with a lostCode set, pulled per-rep the same way as the active queue (never a broad company-wide pull). "Status" will still show an open BC status (Quote Issued / Quote WIP / Pending Approval) &mdash; Business Central doesn't formally close a quote when a Lost reason is tagged. That's a known limitation, not a bug in this view &mdash; see Data Quality.</div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${lostQuotes.length}</div><div class="lbl">Lost-tagged quotes</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total value</div></div>
      <div class="kpi ${flaggedCount?'warn':''} kpi-filter ${lostShowFlaggedOnly?'kpi-filter-active':''}" data-flagkind="missing-reason" title="Click to filter to rows missing a Reason Code"><div class="val">${flaggedCount}</div><div class="lbl">Missing Reason Code</div></div>
    </div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      ${lostShowFlaggedOnly ? filterIndicatorHtml('lost-flagfilter', 'Missing Reason Code', rows.length) : '<span style="font-size:12px;color:var(--text-muted)">Flagged rows (Lost Code set, Reason Code blank &mdash; or vice versa) sort first, then by Quote Total descending.</span>'}
    </div>
    <div style="overflow-x:auto">
    <table>
      <thead><tr>
        <th></th><th>Flag</th><th>Customer</th><th>Quote</th><th>Owner</th><th>Quote Total</th><th>Lost Code</th><th>Reason Code</th><th>Status</th>
      </tr></thead>
      <tbody id="lost-tbody"></tbody>
    </table>
    </div>
  `;
  panel.querySelectorAll('.kpi-filter[data-flagkind]').forEach(el => {
    el.addEventListener('click', () => { lostShowFlaggedOnly = !lostShowFlaggedOnly; renderLost(); });
  });
  const flagClearBtn = document.getElementById('lost-flagfilter-clear');
  if (flagClearBtn) flagClearBtn.addEventListener('click', (e) => { e.preventDefault(); lostShowFlaggedOnly = false; renderLost(); });

  const tbody = document.getElementById('lost-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="9" style="text-align:center;color:var(--text-muted);padding:20px">No lost-tagged quotes match this filter.</td></tr>`;
  }
  rows.forEach(q => {
    const flagged = isFlagged(q);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><button class="drill-btn" data-quote="${q.quoteNo}" data-line="${q.lines[0] ? q.lines[0].lineNo : ''}" title="View quote detail" style="background:var(--cream);border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:4px 8px;font-size:12px;">&#8599;</button></td>
      <td>${flagged ? `<span class="flag missing flag-filter" data-flagkind="missing-reason" title="Click to filter to Missing Reason Code rows">Missing Reason Code</span>` : '<span class="flag ok">Both set</span>'}</td>
      <td><a href="#" class="customer-link" data-custno="${q.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${q.customer}</a><br/><span style="color:var(--text-muted);font-size:11px">${q.custNo}</span></td>
      <td><a href="#" class="quote-link" data-quote="${q.quoteNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.quoteNo}</a></td>
      <td>${q.owner}</td>
      <td>${fmt$(q.quoteTotal)}</td>
      <td>${q.lostCode || '<span style="color:var(--red)">blank</span>'}</td>
      <td>${q.reasonCode && q.reasonCode.trim() ? q.reasonCode : '<span style="color:var(--red)">blank</span>'}</td>
      <td>${q.status}</td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('.drill-btn').forEach(btn => {
    btn.addEventListener('click', () => openDetail(btn.dataset.quote, btn.dataset.line ? Number(btn.dataset.line) : null));
  });
  tbody.querySelectorAll('.quote-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.quote, null); });
  });
  tbody.querySelectorAll('.customer-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openCustomerDetail(a.dataset.custno); });
  });
  tbody.querySelectorAll('.flag-filter').forEach(el => {
    el.addEventListener('click', () => { lostShowFlaggedOnly = !lostShowFlaggedOnly; renderLost(); });
  });
}

function renderCustomers() {
  const panel = document.getElementById('panel-customers');

  // combine active + archive per customer
  const byCust = {};
  QUOTES.forEach(q => {
    byCust[q.custNo] = byCust[q.custNo] || { name: q.customer, owner: q.owner, lineCount: 0, quotedValue: 0, wonValue: 0, quoteNos: new Set() };
    byCust[q.custNo].lineCount += q.lines.length;
    byCust[q.custNo].quotedValue += q.quoteTotal;
    byCust[q.custNo].quoteNos.add(q.quoteNo);
  });
  ARCHIVE.forEach(q => {
    byCust[q.custNo] = byCust[q.custNo] || { name: q.customer, owner: q.owner, lineCount: 0, quotedValue: 0, wonValue: 0, quoteNos: new Set() };
    byCust[q.custNo].lineCount += q.lines.length;
    byCust[q.custNo].quotedValue += q.quoteTotal;
    byCust[q.custNo].quoteNos.add(q.quoteNo);
    if (q.outcome === 'Won') byCust[q.custNo].wonValue += q.quoteTotal;
  });

  const custRows = Object.entries(byCust).map(([custNo,d]) => ({
    custNo, ...d,
    conversion: d.quotedValue ? (d.wonValue/d.quotedValue*100) : 0
  }));
  custRows.sort((a,b) => b.lineCount - a.lineCount);

  const n = custRows.length;
  const top20Count = Math.max(1, Math.round(n * 0.2));
  const highActivity = custRows.slice(0, top20Count);
  const lowActivity = custRows.slice(-top20Count).reverse();

  const activeCustNos = new Set(Object.keys(byCust));
  const zeroActivity = ALL_ACCOUNTS.filter(a => !activeCustNos.has(a.custNo));
  const zeroByOwner = {};
  zeroActivity.forEach(a => { zeroByOwner[a.owner] = (zeroByOwner[a.owner]||0) + 1; });

  panel.innerHTML = `
    <div class="section-title">Customers</div>
    <div class="section-sub">${n} customers with active $5K+ quotes right now, out of ${ALL_ACCOUNTS.length} total accounts on the team's account package. High/low activity is top 20% / bottom 20% by quote-line count among the ${n} with activity.</div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${n}</div><div class="lbl">Active customers</div></div>
      <div class="kpi warn"><div class="val">${zeroActivity.length}</div><div class="lbl">Zero active quotes</div></div>
      <div class="kpi"><div class="val">${ALL_ACCOUNTS.length}</div><div class="lbl">Total accounts</div></div>
      <div class="kpi"><div class="val">${top20Count}</div><div class="lbl">Top 20% threshold</div></div>
    </div>
    <div class="card" style="border-color:var(--red)">
      <b style="font-size:13px;color:var(--red)">Zero active quotes \u2014 ${zeroActivity.length} of ${ALL_ACCOUNTS.length} accounts (${(zeroActivity.length/ALL_ACCOUNTS.length*100).toFixed(0)}%)</b>
      <div class="section-sub" style="margin-top:4px;margin-bottom:8px">No quote on file at $5,000+ right now. These are the true "why aren't we quoting this account at all" candidates \u2014 different from low activity, which at least has something moving.</div>
      <div style="margin-bottom:10px;font-size:12px;color:var(--text-muted)">By owner: ${Object.entries(zeroByOwner).sort((a,b)=>b[1]-a[1]).map(([o,c])=>`${o}: <b>${c}</b>`).join(' &nbsp;|&nbsp; ')}</div>
      <div style="max-height:320px;overflow-y:auto">
      <table><thead><tr><th>Customer</th><th>Account #</th><th>Owner</th></tr></thead>
      <tbody>${zeroActivity.slice().sort((a,b)=>a.owner.localeCompare(b.owner)||a.name.localeCompare(b.name)).map(a=>`<tr><td>${a.name}</td><td>${a.custNo}</td><td>${a.owner}</td></tr>`).join('')}</tbody></table>
      </div>
    </div>
    <div class="card">
      <b style="font-size:13px">High activity \u2014 top 20% by line count</b>
      <table style="margin-top:8px"><thead><tr><th>Customer</th><th>Owner</th><th>Quotes</th><th>Lines</th><th>Value</th><th>Conversion</th></tr></thead>
      <tbody>${highActivity.map(c=>`<tr><td><a href="#" class="cust-link" data-custno="${c.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${c.name}</a></td><td>${c.owner}</td><td>${c.quoteNos.size}</td><td>${c.lineCount}</td><td>${fmt$(c.quotedValue)}</td><td>${c.conversion?c.conversion.toFixed(1)+'%':'\u2014'}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <b style="font-size:13px">Low activity (but not zero) \u2014 bottom 20% by line count</b>
      <div class="section-sub" style="margin-top:4px;margin-bottom:8px">Has at least one active $5K+ quote, but not much.</div>
      <table><thead><tr><th>Customer</th><th>Owner</th><th>Quotes</th><th>Lines</th><th>Value</th></tr></thead>
      <tbody>${lowActivity.map(c=>`<tr><td><a href="#" class="cust-link" data-custno="${c.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${c.name}</a></td><td>${c.owner}</td><td>${c.quoteNos.size}</td><td>${c.lineCount}</td><td>${fmt$(c.quotedValue)}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <b style="font-size:13px">All active customers \u2014 sortable by conversion</b>
      <table style="margin-top:8px"><thead><tr><th>Customer</th><th>Owner</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${custRows.slice().sort((a,b)=>b.conversion-a.conversion).map(c=>`<tr><td><a href="#" class="cust-link" data-custno="${c.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${c.name}</a></td><td>${c.owner}</td><td>${fmt$(c.quotedValue)}</td><td>${fmt$(c.wonValue)}</td><td>${c.conversion?c.conversion.toFixed(1)+'%':'\u2014'}</td></tr>`).join('')}</tbody></table>
    </div>
  `;
  panel.querySelectorAll('.cust-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openCustomerDetail(a.dataset.custno); });
  });
}

function renderDQ() {
  const panel = document.getElementById('panel-dq');
  const issues = [];
  QUOTES.forEach(q => {
    if (!q.followUpDate) issues.push({sev:'high', text:`${q.quoteNo} (${q.customer}, ${fmt$(q.quoteTotal)}) has no Follow Up Date set at all.`});
    if (q.followUpDate && !q.followUpCode) issues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has a Follow Up Date but no Follow Up Code set.`});
    if (!q.followUpSalesperson) issues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has no Follow Up Salesperson assigned.`});
    if (normalizeOwner(q.owner) !== q.bcSalesperson) issues.push({sev:'high', text:`${q.quoteNo} (${q.customer}) is owned by ${q.owner} on the account package, but BC's Salesperson Code is ${q.bcSalesperson} \u2014 worth confirming who's actually working this.`});
  });
  issues.push({sev:'high', text:`Customer number collision found in SalesModel: C132371 resolves to both "Epirus" (active, 5 days since last order) and an unrelated legacy record "Environmental Dimensions Inc" (dormant since 2017). Same pattern on C129074 ("Anduril Industries" vs. a dormant "Hope College" record). This refresh found a third example: C151561 resolves to both "Pano AI" (active, 7 days since last order) and a dormant single-transaction record "Phantom Intelligence" (one order in 2018). Any join on customer number alone \u2014 without also checking the name \u2014 risks silently picking the wrong record.`});
  issues.push({sev:'high', text:`The original snapshot pull was capped at the most recent 2,000 LCOM quotes system-wide. Direct per-account lookups for all four reps recovered 69 additional active $5K+ quotes that fell outside that window \u2014 most dramatically a $1,181,986 V-Tron Electronics quote and a $954,912 Lockheed Martin quote, both invisible in the original pull. On this refresh, the Lockheed Martin quote (SQIE0015681) is still open at the same $954,912 value, but the $1,181,986 V-Tron Electronics quote is gone entirely \u2014 not active, not Won \u2014 under any status for that customer (L103069 now shows only two much smaller open quotes, $50,101.38 and $6,297.31). It most likely expired past its due date without being formally closed, which is itself more evidence for the Lost-closing-habit issue below. Anyone relying on the capped general pull instead of per-rep account lookups would have badly undercounted every rep's real pipeline, not just Jerik's.`});
  issues.push({sev:'high', text:`DEBUGGED, CORRECTED, AND CONFIRMED (re-verified on refresh): Infinite recently upgraded Business Central versions; quote numbering changed from the old system's "SQ" prefix to the current "SQIE" prefix at that point (same business, same accounts \u2014 just a new quote numbering scheme starting ~April 2026). My first pass compared Won-quote value against ALL-TIME revenue ($70.3M going back years), which was an unfair comparison against a 4-month-old quote system \u2014 corrected. Fair comparison, same time window as the SQIE system's actual lifespan (since April 2026): $14.26M in real revenue vs. $42,715.06 in confirmed Won SQIE quotes across the team's accounts \u2014 0.30%. This refresh's Won count grew from 3 to 6 quotes (cross-checked via salesOrders.quoteNo and invoices.quoteNo, independent of the quote's own status field) and found no hidden additional wins beyond those 6. The sub-1% gap is real and not a measurement artifact \u2014 it's most likely explained by the Lost-closing habit gap below, and possibly by orders being created without going through BC's formal quote-to-order conversion action.`});
  issues.push({sev:'med', text:`Added to Archive: 476 invoices for the team's accounts, totaling $1,256,125.79, invoicing between January 2023 and September 2026 against legacy "SQ"-numbered quotes from before the BC upgrade (this refresh's pull reached much further back than the prior one, which only covered April\u2013August 2026). This isn't a one-time transition blip \u2014 it's still happening as of this pull, with a legacy invoice posted on 2026-09-15 itself. It means most of what's actually closing right now for these accounts is pre-upgrade backlog, not new SQIE-quoted business.`});
  issues.push({sev:'high', text:`Business Central's lostCode field cannot be used to compute a "Lost" bucket. Re-checked this refresh: of the team's 116 active $5K+ LCOM quotes, 29 have a lostCode set (DEMANDCHG, PRICING, PROJ-LOST, EXPIRED, BUDGETARY, NORESPX4, MOQ, DISTY-CHAN, PROJ-CX, PROJ-DEL) \u2014 every single one still shows an open status (Quote Issued, Quote WIP, or Pending Approval), none are actually closed. Reps are tagging a risk reason without ever formally closing the quote out. Real Lost-based conversion tracking needs a process change (actually closing quotes as Lost), not a data fix.`});
  issues.push({sev:'med', text:`The companion reasonCode field is populated on zero of the team's 116 active $5K+ quotes (vs. 29 with lostCode set) \u2014 it appears to be entirely unused in practice, not just underused. If reasonCode was meant to capture more detail than lostCode (or vice versa), reps aren't using whichever field this is; worth confirming with T-Jay whether one of the two fields should be retired from the quote-entry process.`});
  issues.push({sev:'med', text:`Item-level classification (the precise "hasn't ordered this exact part in X days" check that found the Domaille Engineering Winback pattern) is best-effort and covers a small subset this refresh: 7 items on Anduril Industries' two highest-value active quotes, confirmed via SalesModel f_Transaction (all came back "Existing Business", most recently ordered 1\u201369 days ago). A further check on Lockheed Martin, Ksaria, and Advanced Interconnect's highest-value line items found zero transaction history for those specific parts under those customers \u2014 genuinely New Business at the item level despite the customer being active overall \u2014 and those were set accordingly. The remaining active lines fall back to customer-level classification, which is accurate about overall account activity but less precise about any single part. The underlying join issue (item key/item number resolution breaking under a multi-item grouped query) is avoidable by filtering to a handful of items per query, but that keeps full coverage impractical at this query budget.`});
  issues.push({sev:'med', text:`On Jerik's account package, Lockheed Martin and Raytheon Company FASTX still show most of their quote activity attributed to other salespeople (JNORMAND, JSIELICKI, SBOYDEN, WSTANDLEY, LMENDENHAL) rather than JWONG \u2014 unchanged on this refresh. His own code shows up consistently on Epic Technologies, MAKO Surgical, IDEXX, Marshall Electronics, Martin Marietta, and IPG Photonics. Worth confirming with him whether Lockheed/Raytheon are actively his to work day-to-day or shared/nominal on the account package.`});
  panel.innerHTML = `
    <div class="section-title">Data Quality</div>
    <div class="section-sub">Gaps found in the live pull &mdash; corrected in Business Central, not in this app.</div>
    <div class="card">
      ${issues.map(i => `<div class="dq-item"><span class="dq-sev" style="background:${i.sev==='high'?'var(--red)':'var(--yellow)'}">${i.sev.toUpperCase()}</span>${i.text}</div>`).join('') || '<div class="dq-item">No issues found in this snapshot.</div>'}
    </div>
    <div class="card">
      <b style="font-size:13px">Known unavailable fields (not invented)</b>
      <div class="dq-item">"Describe the Opportunity" \u2014 not present on salesHeader2 in this BC instance.</div>
      <div class="dq-item">Customer Part No., NCNR/freight flags, brand/region/department fields \u2014 not present on salesQuoteLine; these only appear once a quote converts to salesOrderLine.</div>
      <div class="dq-item">Demand Creation flag \u2014 no reliable connected source yet.</div>
    </div>
  `;
}

    <div class="roadmap-grid">

document.querySelectorAll('.qoc-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.qoc-tab').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    ['queue','reps','winback','norewin','conversion','manager','lost','customers','dq','archive','roadmap'].forEach(t => {
      document.getElementById('panel-'+t).style.display = (t === btn.dataset.tab) ? 'block' : 'none';
    });
  });
});

document.getElementById('snapshot-note').innerHTML =
  "<b>Live data snapshot (refreshed 2026-09-15)</b> &mdash; 116 active $5,000+ quotes ($6.6M) across Adam, Kelli, Jerik, and Spencer's assigned accounts, pulled from Business Central Explorer and cross-checked against SalesModel order history. " +
  "Per-rep account-list lookups were used throughout (never a broad company-wide pull) to avoid the connector's 2,000-row cap silently dropping data. See Data Quality for details, including this refresh's findings.";

(async () => {
  await loadEdits();
  renderQueue();
  renderReps();
  renderWinback();
  renderNoRewin();
  renderConversion();
  renderManager();
  renderLost();
  renderCustomers();

  renderArchive();
  renderRoadmap();

</script>
