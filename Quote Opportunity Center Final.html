<style>
  :root {
    --bg: #FAF7F2;
    --nav: #2B2B2B;
    --accent: #C1541C;
    --card: #FFFFFF;
    --cream: #FFF9F2;
    --border: #E5DDD3;
    --text: #2B2B2B;
    --text-muted: #7A7267;
    --red: #C1392B;
    --orange: #C1541C;
    --yellow: #B8860B;
    --green: #4C7A3D;
    --gray: #9B9186;
  }
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #qoc { background: var(--bg); color: var(--text); border-radius: 12px; overflow: hidden; }
  .qoc-nav { background: var(--nav); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .qoc-nav .brand { font-weight: 700; font-size: 15px; margin-right: 16px; color: #fff; letter-spacing: 0.3px; }
  .qoc-tab { background: transparent; border: none; color: #cfc9c0; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .qoc-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .qoc-tab:hover:not(.active) { background: #3d3d3d; color: #fff; }
  .qoc-body { padding: 20px; }
  .qoc-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .val { font-size: 22px; font-weight: 700; color: var(--nav); }
  .kpi .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .kpi.warn .val { color: var(--red); }
  .kpi.clickable { cursor: pointer; transition: border-color .12s, box-shadow .12s, transform .12s; }
  .kpi.clickable:hover { border-color: var(--accent); box-shadow: 0 2px 6px rgba(193,84,28,0.14); transform: translateY(-1px); }
  .kpi.clickable .lbl::after { content: " \2192"; color: var(--accent); opacity: 0; }
  .kpi.clickable:hover .lbl::after { opacity: 1; }
  .kpi.kpi-active { border-color: var(--accent); border-width: 2px; background: var(--cream); }
  .kpi.kpi-active .lbl::after { content: " \2713"; color: var(--accent); opacity: 1; }
  .filter-banner { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; margin-bottom: 12px; font-size: 12px; font-weight: 600; }
  .filter-banner .x { background: rgba(255,255,255,0.22); border: none; color: #fff; border-radius: 50%; width: 20px; height: 20px; line-height: 1; cursor: pointer; font-size: 13px; font-weight: 700; padding: 0; }
  .filter-banner .x:hover { background: rgba(255,255,255,0.4); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; }
  thead th { background: var(--cream); text-align: left; padding: 10px 8px; font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid var(--border); }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: #FFFBF6; }
  .flag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .flag.overdue { background: var(--red); }
  .flag.today { background: var(--orange); }
  .flag.missing { background: var(--yellow); }
  .flag.ok { background: var(--green); }
  .flag.clickable { cursor: pointer; border: 1px solid transparent; }
  .flag.clickable:hover { filter: brightness(1.15); border-color: var(--nav); }
  .flag.flag-active { outline: 2px solid var(--nav); outline-offset: 1px; }
  .count-link { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 2px; }
  .count-link:hover { color: var(--accent); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: #EFE6DA; color: var(--nav); font-weight: 600; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 32px; }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--nav); }
  .section-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .dq-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .dq-item:last-child { border-bottom: none; }
  .dq-sev { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 8px; }
  .roadmap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .roadmap-card { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--text-muted); font-size: 12px; background: var(--cream); }
  .roadmap-card b { display: block; color: var(--nav); font-size: 13px; margin-bottom: 4px; }
  .save-status { font-size: 11px; color: var(--green); margin-left: 8px; }
  .refresh-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .snapshot-note { font-size: 11px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
</style>

const TODAY = new Date("2026-10-01");
const STORAGE_KEY = "qoc-line-edits-v1";
let editState = {}; // key: quoteNo|lineNo -> {quoteType, targetPrice, comments}

function lineKey(q, l) { return q.quoteNo + "|" + l.lineNo; }
function daysBetween(dateStr) {
  const d = new Date(dateStr);
  return Math.round((d - TODAY) / 86400000);
}
function fmt$(n) { return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }

function computeFlags(q, edit) {
  const flags = [];
  if (!q.followUpDate) { flags.push({key: "missingFU", label: "Missing Follow-Up Date", cls: "missing"}); }
  else {
    const fu = daysBetween(q.followUpDate);
    if (fu < 0) flags.push({key: "overdue", label: "Overdue " + Math.abs(fu) + "d", cls: "overdue"});
    else if (fu === 0) flags.push({key: "today", label: "Due today", cls: "today"});
  }
  if (!q.followUpCode) flags.push({key: "missingCode", label: "Missing Follow-Up Code", cls: "missing"});
  if (!q.followUpSalesperson) flags.push({key: "missingRep", label: "Missing Follow-Up Rep", cls: "missing"});
  const exp = daysBetween(q.expirationDate);
  if (exp >= 0 && exp <= 5) flags.push({key: "expiring", label: "Expires in " + exp + "d", cls: "today"});
  if (normalizeOwner(q.owner) !== q.bcSalesperson) {
    flags.push({key: "ownerMismatch", label: "Owner \u2260 BC Salesperson", cls: "missing"});
  }
  if (edit && !edit.quoteType) flags.push({key: "missingType", label: "Missing Bid/Buy", cls: "missing"});
  // BC's own disposition field says this quote is already closed, even though `status` still reads open.
  if (CLOSED_QUOTE_STATUSES.includes(q.quoteStatus)) {
    flags.push({key: "bcClosed", label: "BC: " + q.quoteStatus, cls: "overdue"});
  }
  return flags;
}
const CLOSED_QUOTE_STATUSES = ["Closed-Lost", "Closed-Won", "Cancelled"];

// ---- Interactive flag filters (clickable KPI tiles + inline flag badges).
// v1: exactly one flag filter active at a time, per view. Clicking the active one toggles it off.
const FLAG_LABELS = {
  overdue: "Overdue",
  today: "Due today",
  missingFU: "Missing follow-up date",
  missingCode: "Missing follow-up code",
  missingRep: "Missing follow-up rep",
  expiring: "Expiring \u22645 days",
  ownerMismatch: "Owner \u2260 BC salesperson",
  missingType: "Missing Bid/Buy",
  bcClosed: "BC says already closed",
  lostNoReason: "Lost code, no reason code",
  reasonNoLost: "Reason code, no lost code",
  codeMismatch: "Lost/reason code mismatch"
};
function flagLabel(key) { return FLAG_LABELS[key] || key; }
// Returns the new filter value after a click: same key toggles off, a different key replaces it.
function toggleFlag(current, key) { return current === key ? null : key; }
function kpiAttrs(key, activeKey) {
  return `class="kpi clickable${activeKey === key ? ' kpi-active' : ''}" data-flag="${key}" role="button" tabindex="0" title="Click to filter to ${flagLabel(key)}"`;
}
function filterBanner(label, shownCount, extra) {
  return `<div class="filter-banner"><span>Showing: ${label} (${shownCount})</span>${
    extra ? `<span style="font-weight:400;opacity:.85">${extra}</span>` : ''
  }<button class="x" data-clear-filter="1" title="Clear filter" aria-label="Clear filter">&times;</button></div>`;
}
// Wires every [data-flag] element and the banner's clear button inside `root`.
// `apply(key|null)` should store the new filter value and re-render the view.
function wireFlagFilters(root, currentKey, apply) {
  root.querySelectorAll('[data-flag]').forEach(el => {
    const fire = e => { e.preventDefault(); apply(toggleFlag(currentKey, el.dataset.flag)); };
    el.addEventListener('click', fire);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') fire(e); });
  });
  const clear = root.querySelector('[data-clear-filter]');
  if (clear) clear.addEventListener('click', e => { e.preventDefault(); apply(null); });
}
function normalizeOwner(owner) {
  const map = {"Adam Purcell":"APURCELL","Kelli Jones":"KJONES","Jerik Wong":"JWONG","Spencer Doty":"SDOTY"};
  return map[owner] || owner;
}

async function loadEdits() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) editState = JSON.parse(result.value);
  } catch (e) { editState = {}; }
}
async function saveEdits() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(editState)); } catch (e) {}
}
function getEdit(key) {
  return editState[key] || { quoteType: "", targetPrice: "", comments: "" };
}

const tableFilters = {}; // containerId -> { quoteType: 'All', classification: 'All', customer: 'All' }

function renderQuoteTable(containerId, quoteList, titleHtml, subHtml) {
  const panel = document.getElementById(containerId);
  if (!tableFilters[containerId]) tableFilters[containerId] = { quoteType: 'All', classification: 'All', customer: 'All', flag: null };
  const filt = tableFilters[containerId];

  let rows = [];
  quoteList.forEach(q => {
    q.lines.forEach(l => {
      const edit = getEdit(lineKey(q,l));
      rows.push({q, l, flags: computeFlags(q, edit), edit});
    });
  });

  // apply the clickable flag filter first, so the banner count reflects the dropdowns too
  if (filt.flag) rows = rows.filter(({flags}) => flags.some(f => f.key === filt.flag));

  // apply filters
  if (filt.quoteType !== 'All') {
    rows = rows.filter(({edit}) => (edit.quoteType || '(blank)') === filt.quoteType);
  }
  if (filt.classification !== 'All') {
    rows = rows.filter(({l}) => l.itemClassification === filt.classification);
  }
  if (filt.customer !== 'All') {
    rows = rows.filter(({q}) => q.custNo === filt.customer);
  }

  const customerOptions = [...new Map(quoteList.map(q => [q.custNo, q.customer])).entries()]
    .sort((a,b) => a[1].localeCompare(b[1]));

  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  rows.sort((a,b) => rank(a.flags) - rank(b.flags) || b.l.lineAmount - a.l.lineAmount);

  const overdueCount = quoteList.filter(q => q.followUpDate && daysBetween(q.followUpDate) < 0).length;
  const missingFUCount = quoteList.filter(q => !q.followUpDate).length;
  const todayCount = quoteList.filter(q => q.followUpDate && daysBetween(q.followUpDate) === 0).length;
  const totalValue = quoteList.reduce((s,q)=>s+q.quoteTotal,0);
  const expiringCount = quoteList.filter(q => { const e = daysBetween(q.expirationDate); return e >= 0 && e <= 5; }).length;
  const missingTypeCount = quoteList.filter(q => q.lines.some(l => !getEdit(lineKey(q,l)).quoteType)).length;
  const bcClosed = quoteList.filter(q => CLOSED_QUOTE_STATUSES.includes(q.quoteStatus));
  const bcClosedCount = bcClosed.length;
  const bcClosedValue = bcClosed.reduce((s,q)=>s+q.quoteTotal,0);
  const working = quoteList.filter(q => q.quoteStatus === 'Working');
  const workingCount = working.length;
  const workingValue = working.reduce((s,q)=>s+q.quoteTotal,0);
  const filteredValue = rows.reduce((s,{l})=>s+l.lineAmount,0);
  const shownQuotes = new Set(rows.map(({q}) => q.quoteNo)).size;

  panel.innerHTML = `
    ${titleHtml}
    ${subHtml}
    <div class="qoc-kpis">
      <div ${kpiAttrs('overdue', filt.flag)}><div class="val" style="${overdueCount?'color:var(--red)':''}">${overdueCount}</div><div class="lbl">Overdue follow-up</div></div>
      <div ${kpiAttrs('today', filt.flag)}><div class="val" style="${todayCount?'color:var(--red)':''}">${todayCount}</div><div class="lbl">Due today</div></div>
      <div ${kpiAttrs('missingFU', filt.flag)}><div class="val" style="${missingFUCount?'color:var(--red)':''}">${missingFUCount}</div><div class="lbl">Missing follow-up</div></div>
      <div ${kpiAttrs('expiring', filt.flag)}><div class="val" style="${expiringCount?'color:var(--red)':''}">${expiringCount}</div><div class="lbl">Expiring &le;5 days</div></div>
      <div ${kpiAttrs('missingType', filt.flag)}><div class="val" style="${missingTypeCount?'color:var(--red)':''}">${missingTypeCount}</div><div class="lbl">Missing Bid/Buy</div></div>
      <div ${kpiAttrs('bcClosed', filt.flag)}><div class="val" style="${bcClosedCount?'color:var(--red)':''}">${bcClosedCount}</div><div class="lbl">BC says already closed</div></div>
      <div class="kpi"><div class="val">${workingCount}</div><div class="lbl">Genuinely working</div></div>
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Quote value in view</div></div>
      <div class="kpi"><div class="val">${quoteList.length}</div><div class="lbl">Quotes ($5K+)</div></div>
      <div class="kpi"><div class="val">${rows.length}</div><div class="lbl">Lines shown</div></div>
    </div>
    ${bcClosedCount ? `<div class="card" style="border-color:var(--red);border-width:2px;background:#FFF4F0">
      <b style="font-size:13px;color:var(--red)">⚠ ${bcClosedCount} of these ${quoteList.length} quotes are already closed in Business Central &mdash; ${fmt$(bcClosedValue)} of the ${fmt$(totalValue)} shown.</b>
      <div class="section-sub" style="margin-top:4px;margin-bottom:0">They stay listed because BC's <code>status</code> field still reads Quote Issued / Quote WIP, which is what the $5K+ active pull keys on. But BC's separate <code>quoteStatus</code> field &mdash; the one that actually gets maintained &mdash; says ${Object.entries(quoteList.reduce((m,q)=>(CLOSED_QUOTE_STATUSES.includes(q.quoteStatus)&&(m[q.quoteStatus]=(m[q.quoteStatus]||0)+1),m),{})).map(([k,n])=>`<b>${n} ${k}</b>`).join(', ')}. Only <b>${workingCount}</b> (${fmt$(workingValue)}) are genuinely still working. Click the red tile above to see the closed ones, or see Data Quality for the full evidence.</div>
    </div>` : ''}
    ${filt.flag ? filterBanner(flagLabel(filt.flag), rows.length, `${rows.length} line${rows.length===1?'':'s'} on ${shownQuotes} quote${shownQuotes===1?'':'s'} &middot; ${fmt$(filteredValue)}`) : ''}
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:12px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">

  wireFlagFilters(panel, filt.flag, key => {
    tableFilters[containerId].flag = key;
    renderQuoteTable(containerId, quoteList, titleHtml, subHtml);

  const tbody = document.getElementById(containerId+'-tbody');
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="14" style="text-align:center;color:var(--text-muted);padding:20px">No lines match this filter.</td></tr>`;

    tr.innerHTML = `
      <td><button class="drill-btn" data-quote="${q.quoteNo}" data-line="${l.lineNo}" title="View quote detail" style="background:var(--cream);border:1px solid var(--border);border-radius:6px;cursor:pointer;padding:4px 8px;font-size:12px;">&#8599;</button></td>
      <td>${flags.map(f=>`<span class="flag ${f.cls} clickable${filt.flag===f.key?' flag-active':''}" data-flag="${f.key}" role="button" tabindex="0" title="Click to filter to ${flagLabel(f.key)}">${f.label}</span><br/>`).join('') || '<span class="flag ok">On track</span>'}</td>
      <td><a href="#" class="customer-link" data-custno="${q.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${q.customer}</a><br/><span style="color:var(--text-muted);font-size:11px">${q.custNo}</span></td>
      <td><a href="#" class="quote-link" data-quote="${q.quoteNo}" data-line="${l.lineNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.quoteNo}</a><br/><span style="color:var(--text-muted);font-size:11px">Line ${l.lineNo} &middot; ${q.status}</span></td>
      <td>${l.item}<br/><span style="color:var(--text-muted);font-size:11px">${l.desc}</span></td>
      <td>${l.qty}</td>
      <td>${fmt$(l.lineAmount)}<br/><span style="color:var(--text-muted);font-size:11px">Quote total ${fmt$(q.quoteTotal)}${q.moreLinesValue ? ' (+'+fmt$(q.moreLinesValue)+' not itemized here \u2014 freight and/or lines not captured in this snapshot)' : ''}</span></td>
      <td>${l.stock!=null ? (l.stock === 0 ? '<span style="color:var(--red);font-weight:600">0</span>' : l.stock) : '<span style="color:var(--text-muted)">\u2014</span>'}</td>
      <td><span class="badge">${l.itemClassification}</span>${l.itemDaysSince!=null ? `<br/><span style="color:var(--text-muted);font-size:11px">${l.itemDaysSince}d since ordered</span>` : (l.itemClassification==='New Business' ? '<br/><span style="color:var(--text-muted);font-size:11px">no order history</span>' : '')}</td>
      <td>${q.owner}</td>
      <td>${q.followUpDate || '<span style="color:var(--red)">none set</span>'}<br/><span style="color:var(--text-muted);font-size:11px">${q.followUpCode||'\u2014'}</span></td>
      <td><select data-key="${key}" data-field="quoteType">
            <option value="" ${edit.quoteType===''?'selected':''}></option>
            <option value="Bid" ${edit.quoteType==='Bid'?'selected':''}>Bid</option>
            <option value="Buy" ${edit.quoteType==='Buy'?'selected':''}>Buy</option>
          </select></td>
      <td><input type="number" data-key="${key}" data-field="targetPrice" value="${edit.targetPrice}" placeholder="$"/></td>
      <td><textarea data-key="${key}" data-field="comments" placeholder="Notes...">${edit.comments}</textarea></td>
    `;
    tbody.appendChild(tr);
  });
  tbody.querySelectorAll('[data-key]').forEach(el => {
    el.addEventListener('change', async e => {
      const k = e.target.dataset.key, f = e.target.dataset.field;
      if (!editState[k]) editState[k] = { quoteType:"", targetPrice:"", comments:"" };
      editState[k][f] = e.target.value;
      await saveEdits();
      renderQuoteTable(containerId, quoteList, titleHtml, subHtml); // re-render this table to refresh flags
    });
  });
  tbody.querySelectorAll('.drill-btn').forEach(btn => {
    btn.addEventListener('click', () => openDetail(btn.dataset.quote, Number(btn.dataset.line)));
  });
  tbody.querySelectorAll('.quote-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openDetail(a.dataset.quote, Number(a.dataset.line)); });
  });
  tbody.querySelectorAll('.customer-link').forEach(a => {
    a.addEventListener('click', (e) => { e.preventDefault(); openCustomerDetail(a.dataset.custno); });
  });
  // the inline badges only exist once the rows are in the DOM, so wire them separately
  wireFlagFilters(tbody, filt.flag, key => {
    tableFilters[containerId].flag = key;
    renderQuoteTable(containerId, quoteList, titleHtml, subHtml);
  });
}

    <div style="overflow-x:auto"><table>

let conversionDateFilter = { from: '', to: '' };

function renderConversion() {
  const panel = document.getElementById('panel-conversion');

  // combine active + archive, tag each with outcome
  const activeRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => activeRows.push({q, l, outcome:'Open', edit:getEdit(lineKey(q,l))})));
  const archiveRows = [];
  ARCHIVE.forEach(q => q.lines.forEach(l => archiveRows.push({q, l, outcome:q.outcome, edit:{quoteType:''}})));
  let allRows = activeRows.concat(archiveRows);

  // date range filter on dueDate
  if (conversionDateFilter.from) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate >= conversionDateFilter.from);
  if (conversionDateFilter.to) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate <= conversionDateFilter.to);

  const wonRows = allRows.filter(r => r.outcome === 'Won');
  const wonValue = wonRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const totalValue = allRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const wonQuoteNos = new Set(ARCHIVE.filter(q=>q.outcome==='Won').map(q=>q.quoteNo));
  const totalQuoteNos = new Set([...QUOTES.map(q=>q.quoteNo), ...ARCHIVE.map(q=>q.quoteNo)]);

  // rep leaderboard: most quoted (all-time, all statuses) + win rate
  const byRep = {};
  allRows.forEach(({q,l,outcome}) => {
    byRep[q.owner] = byRep[q.owner] || {quotedLines:0, quotedValue:0, wonLines:0, wonValue:0, quoteNos:new Set()};
    byRep[q.owner].quotedLines += 1;
    byRep[q.owner].quotedValue += l.lineAmount;
    byRep[q.owner].quoteNos.add(q.quoteNo);
    if (outcome === 'Won') { byRep[q.owner].wonLines += 1; byRep[q.owner].wonValue += l.lineAmount; }
  });
  const repRows = Object.entries(byRep).map(([rep,d]) => ({
    rep, quotes: d.quoteNos.size, quotedValue: d.quotedValue,
    winRateValue: d.quotedValue ? (d.wonValue/d.quotedValue*100) : 0,
    wonValue: d.wonValue
  })).sort((a,b) => b.quotedValue - a.quotedValue);

  // conversion by quote type (Bid/Buy/blank)
  const byType = {};
  allRows.forEach(({l,edit,outcome}) => {
    const t = edit.quoteType || '(not set)';
    byType[t] = byType[t] || {quoted:0, won:0};
    byType[t].quoted += l.lineAmount;
    if (outcome === 'Won') byType[t].won += l.lineAmount;
  });

  // conversion by classification
  const byClass = {};
  allRows.forEach(({l,outcome}) => {
    byClass[l.itemClassification] = byClass[l.itemClassification] || {quoted:0, won:0};
    byClass[l.itemClassification].quoted += l.lineAmount;
    if (outcome === 'Won') byClass[l.itemClassification].won += l.lineAmount;
  });

  const pct = (num, den) => den ? ((num/den)*100).toFixed(1)+'%' : '\u2014';

  panel.innerHTML = `
    <div class="section-title">Conversion</div>
    <div class="section-sub">Active + Archive combined. Date range filters by Due Date (the closest proxy available to a true quote-creation date in this pull). Won here means BC's <code>status = 'Converted to Order'</code> &mdash; ${wonQuoteNos.size} of ${totalQuoteNos.size} tracked quotes.</div>
    <div class="card" style="border-color:var(--red);border-width:2px;background:#FFF4F0">
      <b style="font-size:13px;color:var(--red)">\u26a0 Do not read a win rate off this tab yet &mdash; Won is undercounted.</b>
      <div class="section-sub" style="margin-top:4px;margin-bottom:0">This view counts Won as <code>status = 'Converted to Order'</code>, which is the documented method and was left intact by this refresh. But this refresh found that BC maintains the real disposition in a <b>different field</b>, <code>quoteStatus</code>, and that <code>Converted to Order</code> catches <b>only 3 of 45</b> quotes that <code>quoteStatus</code> marks <b>Closed-Won</b> &mdash; it misses 93% of them. Every conversion percentage below is therefore a floor, not an estimate. ${QUOTES.filter(q=>q.quoteStatus==='Closed-Won').length} quotes sitting in the active queue right now are already Closed-Won. Rebuilding these buckets on <code>quoteStatus</code> is the recommended fix; see Data Quality for the evidence.</div>
    </div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted)">DATE RANGE (Due Date):</span>
      <label style="font-size:12px;color:var(--text-muted)">From <input type="date" id="conv-date-from" value="${conversionDateFilter.from}" style="margin-left:4px"/></label>
      <label style="font-size:12px;color:var(--text-muted)">To <input type="date" id="conv-date-to" value="${conversionDateFilter.to}" style="margin-left:4px"/></label>
      ${(conversionDateFilter.from||conversionDateFilter.to) ? `<a href="#" id="conv-date-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear</a>` : ''}
    </div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total tracked value</div></div>
      <div class="kpi"><div class="val">${fmt$(wonValue)}</div><div class="lbl">Won value</div></div>
      <div class="kpi"><div class="val">${pct(wonValue,totalValue)}</div><div class="lbl">$ conversion (Won \u00f7 total)</div></div>
      <div class="kpi"><div class="val">${wonQuoteNos.size}</div><div class="lbl">Won quotes</div></div>
    </div>

    <div class="card">
      <b style="font-size:13px">Rep leaderboard \u2014 most quoted &amp; win rate by value</b>
      <table style="margin-top:8px"><thead><tr><th>Rep</th><th>Quotes</th><th>Quoted Value</th><th>Won Value</th><th>Win Rate ($)</th></tr></thead>
      <tbody>${repRows.map(r=>`<tr><td>${r.rep}</td><td>${r.quotes}</td><td>${fmt$(r.quotedValue)}</td><td>${fmt$(r.wonValue)}</td><td>${r.winRateValue.toFixed(1)}%</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Quote Type</b>
      <table style="margin-top:8px"><thead><tr><th>Quote Type</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byType).sort((a,b)=>b[1].quoted-a[1].quoted).map(([t,d])=>`<tr><td><span class="badge">${t}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Classification (Existing / Winback / New Business)</b>
      <table style="margin-top:8px"><thead><tr><th>Classification</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byClass).sort((a,b)=>b[1].quoted-a[1].quoted).map(([c,d])=>`<tr><td><span class="badge">${c}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="roadmap-card" style="margin-top:14px"><b>Why there's no "Lost" conversion rate</b>Business Central's lostCode field is populated on quotes that are still open (status stays "Quote Issued"/"Quote WIP") &mdash; reps are tagging a risk reason without ever closing the quote. There's no reliable way to compute a true Lost bucket until quotes actually get closed out in BC. See Data Quality for the full note.</div>
  `;
  document.getElementById('conv-date-from').addEventListener('change', e => { conversionDateFilter.from = e.target.value; renderConversion(); });
  document.getElementById('conv-date-to').addEventListener('change', e => { conversionDateFilter.to = e.target.value; renderConversion(); });
  const clearBtn = document.getElementById('conv-date-clear');
  if (clearBtn) clearBtn.addEventListener('click', (e) => { e.preventDefault(); conversionDateFilter = {from:'',to:''}; renderConversion(); });
}

function funnelStage(q) {
  if (q.invoiced) return { label: 'Shipped/Invoiced', color: '#D9EAD3' };
  if (q.orderExists) return { label: 'Order Created \u2014 not yet shipped', color: '#FFF3CD' };
  return { label: 'Won (order not found)', color: '#D9EAD3' };
}

let archiveDateFilter = { from: '', to: '' };

function renderArchive() {
  const panel = document.getElementById('panel-archive');

  // unify current (SQIE, from ARCHIVE) and legacy (pre-upgrade, from LEGACY_WON) into one row shape
  let rows = ARCHIVE.map(q => ({

    amount: q.quoteTotal, date: q.dueDate, stage: funnelStage(q), orderNo: q.orderNo, drillable: true, ref: q.quoteNo

    system: 'Legacy', quoteRef: w.quoteNo, customer: w.customer, custNo: w.custNo, owner: w.owner,
    amount: w.amount, date: w.documentDate, stage: { label: 'Shipped/Invoiced', color: '#D9EAD3' }, orderNo: w.invoiceNo, drillable: false, ref: w.invoiceNo
  })));

  let filtered = rows;
  if (archiveDateFilter.from) filtered = filtered.filter(r => r.date && r.date >= archiveDateFilter.from);
  if (archiveDateFilter.to) filtered = filtered.filter(r => r.date && r.date <= archiveDateFilter.to);
  filtered.sort((a,b) => (b.date||'').localeCompare(a.date||''));

  const totalValue = filtered.reduce((s,r)=>s+r.amount,0);
  const currentCount = filtered.filter(r=>r.system==='Current').length;
  const legacyCount = filtered.filter(r=>r.system==='Legacy').length;
  const allDates = rows.map(r=>r.date).filter(Boolean).sort();

  panel.innerHTML = `
    <div class="section-title">Archive</div>
    <div class="section-sub">Won business for the team's accounts, combining the current system's confirmed conversions (${ARCHIVE.length} quotes, ${fmt$(ARCHIVE.reduce((s,q)=>s+q.quoteTotal,0))}, cross-checked against status / order / invoice) ${LEGACY_WON.length

function buildCoachingPanel(q) {
  const edit0 = getEdit(lineKey(q, q.lines[0]));
  const topLine = q.lines.slice().sort((a,b)=>b.lineAmount-a.lineAmount)[0];
  const fu = q.followUpDate ? daysBetween(q.followUpDate) : null;

  const qQuestions = [];
  qQuestions.push(edit0.quoteType ? `Confirmed as a <b>${edit0.quoteType}</b> \u2014 does the evidence on file still support that?` : `Is this a <b>Bid or a Buy</b>? Quote Type isn't set yet.`);
  qQuestions.push(q.classification === 'Winback' || q.lines.some(l=>l.itemClassification==='Winback') ? `This has Winback lines \u2014 what changed, and why did we stop getting this business?` : `What's the project or application driving this quote? (Confirm [Application/Project] with the customer \u2014 not captured in this pull.)`);
  qQuestions.push(`When is the expected award date? Expiration on file is <b>${q.expirationDate}</b>.`);

  const uQuestions = [];
  uQuestions.push(`How will ${q.customer} decide who wins this? Confirm price vs. other criteria with the customer.`);
  uQuestions.push(topLine.stock === 0 ? `Top line (<b>${topLine.item}</b>) shows <b>zero stock</b> \u2014 confirm lead time before presenting.` : `Stock on the top line (<b>${topLine.item}</b>) is ${topLine.stock}. Confirm that still covers the quoted quantity.`);

  const oQuestions = [];
  oQuestions.push(`Have all lines worth escalating been reviewed? Highest-value line here is <b>${fmt$(topLine.lineAmount)}</b> (${topLine.item}).`);
  if (q.moreLinesValue) oQuestions.push(`${fmt$(q.moreLinesValue)} on this quote isn't itemized in this view (freight or lines outside this pull) \u2014 confirm the full picture in BC directly.`);

  const tQuestions = [];
  tQuestions.push(`What's the value story beyond price for ${q.customer}? (Availability, lead time, support \u2014 confirm which applies with the customer.)`);

  const eQuestions = [];
  eQuestions.push(fu === null ? `<b>No Follow Up Date set.</b> Establish one before the next contact \u2014 never leave without a scheduled next step.` : fu < 0 ? `Follow-up is <b>overdue by ${Math.abs(fu)} day${Math.abs(fu)===1?'':'s'}</b>. What's the next action, and by when?` : fu === 0 ? `Follow-up is <b>due today</b>. What's the next action?` : `Follow-up scheduled for ${q.followUpDate}. Confirm that's still the right date.`);
  eQuestions.push(`Has the outcome been documented? Current BC status: <b>${q.status}</b>.`);

  return `
    <div class="card" style="margin-top:18px;background:var(--cream)">
      <b style="font-size:13px;color:var(--nav)">QUOTE + VALUE coaching \u2014 grounded in what's on file for this quote</b>
      <div class="section-sub" style="margin-top:4px">Phrased as questions to confirm with the customer or in BC \u2014 nothing here is invented.</div>
      <div style="margin-top:10px;font-size:12px">
        <div style="margin-bottom:8px"><b>Q \u2014 Qualify</b><ul style="margin:4px 0 0 18px">${qQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>U \u2014 Understand</b><ul style="margin:4px 0 0 18px">${uQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>O \u2014 Optimize</b><ul style="margin:4px 0 0 18px">${oQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>T \u2014 Tailor</b><ul style="margin:4px 0 0 18px">${tQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><b>E \u2014 Execute</b><ul style="margin:4px 0 0 18px">${eQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
    </div>
  `;
}

let managerFilter = null; // flag key, or "rep:<owner>", or "rep:<owner>|<flagKey>"
function managerFilterLabel(f) {
  if (!f) return '';
  if (!f.startsWith('rep:')) return flagLabel(f);
  const [rep, key] = f.slice(4).split('|');
  return key ? `${rep} — ${flagLabel(key)}` : rep;
}
function managerRowMatches(f, row) {
  if (!f) return true;
  if (!f.startsWith('rep:')) return row.flags.some(x => x.key === f);
  const [rep, key] = f.slice(4).split('|');
  if (row.q.owner !== rep) return false;
  return key ? row.flags.some(x => x.key === key) : true;
}

function renderManager() {
  const panel = document.getElementById('panel-manager');
  const byOwner = {};
  QUOTES.forEach(q => {
    byOwner[q.owner] = byOwner[q.owner] || { value: 0, count: 0, overdue: 0, missingFU: 0, zeroActivity: 0 };
    byOwner[q.owner].value += q.quoteTotal;
    byOwner[q.owner].count += 1;
    if (q.followUpDate && daysBetween(q.followUpDate) < 0) byOwner[q.owner].overdue += 1;
    if (!q.followUpDate) byOwner[q.owner].missingFU += 1;
  });
  const activeCustNos = new Set(QUOTES.map(q => q.custNo));
  ALL_ACCOUNTS.forEach(a => { if (!activeCustNos.has(a.custNo)) { byOwner[a.owner] = byOwner[a.owner] || { value:0, count:0, overdue:0, missingFU:0, zeroActivity:0 }; byOwner[a.owner].zeroActivity += 1; } });
  const repRows = Object.entries(byOwner).sort((a,b)=>b[1].value-a[1].value);

  // exception-based coaching queue: every line with at least one real flag, ranked by severity then value
  let queueRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => {
    const edit = getEdit(lineKey(q,l));
    const flags = computeFlags(q, edit);
    if (flags.length) queueRows.push({q, l, flags});
  }));
  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  queueRows.sort((a,b) => rank(a.flags)-rank(b.flags) || b.l.lineAmount-a.l.lineAmount);

  const flagCount = key => queueRows.filter(r => r.flags.some(f => f.key === key)).length;
  const matched = queueRows.filter(r => managerRowMatches(managerFilter, r));
  // unfiltered, the queue is a top-15 digest; filtered, show every matching row
  const topQueue = managerFilter ? matched : queueRows.slice(0, 15);

  panel.innerHTML = `
    <div class="section-title">Manager View</div>
    <div class="section-sub">Team rollup and exception-based coaching queue across Adam, Kelli, Jerik, and Spencer's assigned accounts. Every count below is clickable &mdash; it filters the coaching queue to those lines.</div>
    <div class="qoc-kpis">
      <div ${kpiAttrs('overdue', managerFilter)}><div class="val" style="${flagCount('overdue')?'color:var(--red)':''}">${flagCount('overdue')}</div><div class="lbl">Overdue lines</div></div>
      <div ${kpiAttrs('today', managerFilter)}><div class="val" style="${flagCount('today')?'color:var(--red)':''}">${flagCount('today')}</div><div class="lbl">Due today</div></div>
      <div ${kpiAttrs('missingFU', managerFilter)}><div class="val" style="${flagCount('missingFU')?'color:var(--red)':''}">${flagCount('missingFU')}</div><div class="lbl">Missing follow-up</div></div>
      <div ${kpiAttrs('expiring', managerFilter)}><div class="val" style="${flagCount('expiring')?'color:var(--red)':''}">${flagCount('expiring')}</div><div class="lbl">Expiring &le;5 days</div></div>
      <div ${kpiAttrs('ownerMismatch', managerFilter)}><div class="val" style="${flagCount('ownerMismatch')?'color:var(--red)':''}">${flagCount('ownerMismatch')}</div><div class="lbl">Owner &ne; BC rep</div></div>
      <div ${kpiAttrs('missingType', managerFilter)}><div class="val" style="${flagCount('missingType')?'color:var(--red)':''}">${flagCount('missingType')}</div><div class="lbl">Missing Bid/Buy</div></div>

// ---- Lost Quotes (Section 7, item 11)
// Source: the same per-rep salesQuotes pull as the active set, keeping rows where lostCode is populated.
// The header `status` on these rows still reads Quote Issued / Quote WIP -- that is the known BC
// limitation (reps tag a lost reason without ever closing the quote), not a bug in this table.
let lostFilter = null; // flag key, or "code:<LOSTCODE>"
function lostFlags(r) {
  const flags = [];
  if (r.lostCode && !r.reasonCode) flags.push({key:'lostNoReason', label:'No reason code', cls:'overdue'});
  if (r.reasonCode && !r.lostCode) flags.push({key:'reasonNoLost', label:'No lost code', cls:'overdue'});
  return flags;
}
function lostFilterLabel(f) { return f && f.startsWith('code:') ? 'Lost code ' + f.slice(5) : flagLabel(f); }
function lostRowMatches(f, r, flags) {
  if (!f) return true;
  if (f.startsWith('code:')) return r.lostCode === f.slice(5);
  return flags.some(x => x.key === f);
}

  const panel = document.getElementById('panel-lost');
  const all = LOST_QUOTES.map(r => ({ r, flags: lostFlags(r) }));

  // flagged rows first, then quoteTotal descending
  const rows = all.filter(({r,flags}) => lostRowMatches(lostFilter, r, flags))
    .sort((a,b) => (b.flags.length?1:0) - (a.flags.length?1:0) || b.r.quoteTotal - a.r.quoteTotal);

function renderDQ() {

  });
  // ---- Section 5 findings, each RE-VERIFIED against this refresh. Evidence shown, not just the conclusion.
  const byQS = QUOTES.reduce((m,q)=>(m[q.quoteStatus||'(unknown)']=(m[q.quoteStatus||'(unknown)']||0)+1,m),{});
  const qsClosed = QUOTES.filter(q=>CLOSED_QUOTE_STATUSES.includes(q.quoteStatus));
  const qsWorking = QUOTES.filter(q=>q.quoteStatus==='Working');
  const lostClosedLost = LOST_QUOTES.filter(r=>r.quoteStatus==='Closed-Lost').length;

  findings.push({sev:'high', text:`<b>NEW THIS REFRESH \u2014 and it changes how this whole dashboard should be read. A previously recorded finding is now partly WRONG.</b><br/>
    The prior build concluded: <i>"there is no reliable way to compute a Lost bucket from current BC data."</i> <b>That conclusion is wrong.</b> Its observation was right \u2014 the <code>status</code> field really is never closed out \u2014 but BC records real disposition in a <b>separate header field on <code>salesQuotes</code> called <code>quoteStatus</code></b>, which nobody had looked at. It carries <code>Closed-Lost</code>, <code>Closed-Won</code>, <code>Working</code>, <code>On Hold</code>, <code>Cancelled</code>, and it is populated on <b>100% of the 223 quotes checked</b>.<br/><br/>
    <b>Evidence it is trustworthy:</b> across the 167 quotes whose lines also carry the field, header and line agree <b>100% \u2014 zero disagreements</b>. Only 1 quote of 223 (0.4%) has mixed values across its lines, so it behaves as a quote-level field. The header version is also strictly more complete: 3 quotes (SQIE0011872, SQIE0011873, SQIE0032792) have <b>no rows in <code>salesQuoteLines</code> at all</b> yet the header correctly reads Closed-Lost \u2014 a line-derived version would silently lose them. It agrees with <code>lostCode</code> on 123 of 124 cases (the exception: SQIE0007804, ${fmt$(145072)}, <code>lostCode=PROJ-DEL</code> but <code>quoteStatus=On Hold</code>), and <b>zero</b> quotes are Closed-Lost with an empty lostCode.<br/><br/>
    <b>What this means for the numbers on this page:</b> of the ${QUOTES.length} quotes in the "active $5K+" queue, <code>quoteStatus</code> says only <b>${qsWorking.length} are genuinely Working</b> (${fmt$(qsWorking.reduce((s,q)=>s+q.quoteTotal,0))}). The rest break down as ${Object.entries(byQS).sort((a,b)=>b[1]-a[1]).map(([k,n])=>`<b>${n}</b> ${k}`).join(', ')} \u2014 i.e. <b>${qsClosed.length} quotes worth ${fmt$(qsClosed.reduce((s,q)=>s+q.quoteTotal,0))} are already closed</b> and should not be being chased. They are flagged in red on every queue view.<br/><br/>
    <b>And for Won:</b> <code>status = 'Converted to Order'</code> catches only 3 of 45 Closed-Won quotes \u2014 it misses <b>93%</b> of them. The Archive and Conversion views on this dashboard are still built on <code>Converted to Order</code> (that is the documented method and was left intact), which means <b>they materially undercount Won</b>. Before anyone reads a win rate off the Conversion tab, this needs deciding.<br/><br/>
    <b>Recommendation:</b> rebuild the Won / Lost / Active buckets on <code>salesQuotes.quoteStatus</code>, not on <code>status</code>. That is a scope change beyond this refresh, so it has not been done unilaterally \u2014 but it is the single highest-value fix available here, and it does not require any process change by the reps, because the field is already being maintained.`});

  findings.push({sev:'high', text:`<b>RE-VERIFIED \u2014 still true, and larger than before: lost quotes are never formally closed <i>on the <code>status</code> field</i>.</b> ${lostTotal} quotes across the team's ${ALL_ACCOUNTS.length} accounts carry a populated <code>lostCode</code>, worth ${fmt$(lostValue)} in quoted value. <b>${lostOpen.length} of ${lostTotal} are still open in BC</b> \u2014 ${Object.entries(lostByStatus).map(([s,n])=>`${n} \u00d7 "${s}"`).join(', ')}. Not one has been closed out. The single largest is ${biggestLost ? `${biggestLost.quoteNo} (${biggestLost.customer}, ${fmt$(biggestLost.quoteTotal)}) tagged <b>${biggestLost.lostCode}</b> while sitting at status "${biggestLost.status}"` : 'n/a'}. Fixing <code>status</code> itself remains a <b>process matter</b> (reps/BC admin actually closing quotes) \u2014 but per the finding above, it is no longer a <i>blocker</i>, because <code>quoteStatus</code> already records the real answer: ${lostClosedLost} of these ${lostTotal} are formally <b>Closed-Lost</b> there. See the Lost Quotes tab, rightmost column.`});
  findings.push({sev:'high', text:`<b>NEW THIS REFRESH \u2014 <code>reasonCode</code> is empty on every single record.</b> Across all 734 quote headers pulled per rep (216 Adam, 201 Jerik, 174 Kelli, 143 Spencer \u2014 the complete unfiltered set for all ${ALL_ACCOUNTS.length} accounts, not a sample), <code>reasonCode</code> is the empty string on <b>100% of rows</b>. Zero populated values anywhere. Consequences: all ${lostNoReason} lost-coded quotes are flagged "lost code, no reason code" in the Lost Quotes tab \u2014 that flag is at 100%, not a handful of stragglers \u2014 and the mirror-image check (reason code set, lost code blank) found ${anyReason === 0 ? '<b>nothing, because it structurally cannot fire</b>' : anyReason + ' rows'}. <code>reasonCode</code> is not a usable field in this instance today; don't build reporting on it until it's actually being populated.`});
  findings.push({sev:'high', text:`<b>RE-VERIFIED \u2014 still true: "Converted to Order" means an order was created, not that it shipped or invoiced.</b> Of ${ARCHIVE.length} Won quotes, only <b>${wonShipped} show shipped = true</b> and <b>${wonInvoiced} have a posted invoice</b>. ${wonStalled.length ? `${wonStalled.length} (${wonStalled.map(q=>q.quoteNo).join(', ')}) have live Released orders that are neither shipped nor invoiced \u2014 the order exists and nothing has moved.` : ''} Track funnel stage, not a flat Won/Lost binary.`});
  findings.push({sev:'high', text:`<b>NEW THIS REFRESH \u2014 a refinement that corrects how to read the order cross-check.</b> ${wonNoOrderRow.length ? `${wonNoOrderRow.length} Won quotes (${wonNoOrderRow.map(q=>q.quoteNo).join(', ')}) have <b>no row at all in <code>salesOrders</code></b> \u2014 yet they do have posted invoices.` : 'Some Won quotes have no row in salesOrders yet do have posted invoices.'} Their orders were fully invoiced and therefore dropped out of the open <code>salesOrders</code> table. So: <b>absence from <code>salesOrders</code> is not evidence that a quote failed to convert</b>, and any ship-rate computed from <code>salesOrders</code> alone is biased downward, because the completed orders are exactly the ones missing. Invoices are the stronger completion signal; the order table only tells you about work still in flight. The prior build used order-absence as a conversion check \u2014 that was wrong and is corrected here.`});
  findings.push({sev:'med', text:`<b>RE-VERIFIED \u2014 the SQ / SQIE legacy split is real and still running.</b> Business Central's upgrade (~April 2026) changed quote numbering from the old <code>SQ</code> prefix to the current <code>SQIE</code> prefix. ${LEGACY_WON.length
  ? `This refresh found <b>${LEGACY_WON.length} legacy invoices totalling ${fmt$(legacyValue)}</b>${legacyDates.length ? ` posting between ${legacyDates[0]} and ${legacyDates[legacyDates.length-1]}` : ''}, against pre-upgrade SQ-numbered quotes \u2014 versus ${fmt$(currentWonValue)} in confirmed Won value on the current SQIE system.`
  : `<b>Legacy invoice detail is not loaded in this build</b> \u2014 the SQ-numbered pull is still being assembled, so the Archive tab currently shows only the ${ARCHIVE.length} current-system records (${fmt$(currentWonValue)}). Treat the Archive's totals as current-system only until the legacy rows land; do not read the absence of legacy records as an absence of legacy business.`} Most of what is actually closing for these accounts is still pre-upgrade backlog, not new SQIE-quoted business. Keep the two populations visually distinct (Archive's "System" column) rather than merging them into one number. The Archive date filter will be empty before the earliest legacy date above \u2014 that's the pull's reach, not an absence of business.`});
  findings.push({sev:'med', text:`<b>RE-VERIFIED \u2014 the 2,000-row cap did NOT bite this refresh, because of how the pull was done.</b> Every quote pull was made <b>per rep</b> against that rep's account list. The largest single response was 216 rows (Adam), then 201 (Jerik), 174 (Kelli), 143 (Spencer) \u2014 all far under the 2,000-row ceiling, so nothing was silently truncated. This is the method working, not the risk going away: a single company-wide pull would still hit the cap and drop rows with no error. Line coverage was independently checked \u2014 for all ${QUOTES.length + ARCHIVE.length} quotes, the sum of line amounts reconciles to the header total to the cent, and every quote returned its lines.`});
  findings.push({sev:'high', text:`<b>NEW THIS REFRESH \u2014 customer-level classification can no longer detect a winback at all.</b> Of the ${ALL_ACCOUNTS.length} assigned accounts, 124 have order history and <b>every one of them ordered within the last 170 days</b> (median 6 days). That leaves <b>0 accounts in the 366\u2013730 day "Winback" band and 0 over 730 days</b>; 9 have no history whatsoever. So the customer-level signal is saturated \u2014 current active quotes classify as ${Object.entries(classMix).map(([k,n])=>`${n} ${k}`).join(', ')}. ${itemWinback > 0 ? `Winback detection now rests entirely on the <b>item-level</b> check ("this customer stopped buying this specific part"), which found <b>${itemWinback} winback lines</b> across 4 distinct customer/part pairs — the clearest being L502375 / CA-3017-120, last ordered 2024-10-23 (708 days).` : `Item-level classification is the only remaining way to find a winback; see the note below on its status.`} Also worth knowing: 20 more customer/part pairs sit just past the 730-day cutoff with real history, the nearest at 734 and 815 days. If 730 is a judgement call rather than a hard rule, widening it slightly would roughly triple the winback list. Reading the Winback tab as "we have no winback opportunities" would be a misreading of a saturated metric.`});
  findings.push({sev:'med', text:`<b>RESOLVED THIS REFRESH \u2014 item-level classification now covers every line, and the SalesModel join bug is root-caused.</b> The prior build could only compute item-level classification ("has this customer stopped buying <i>this specific part</i>?") for 28 quotes, because a DAX join kept returning null item numbers. It is now computed for <b>all ${QUOTES.reduce((n,q)=>n+q.lines.length,0)} lines across all ${QUOTES.length} quotes</b> (369 distinct customer/item pairs; 262 had real order history, 107 were genuinely never ordered by that customer \u2014 spot-checked against row counts to rule out a join artifact).<br/>
    <b>The bug still reproduces, and we now know why:</b> grouping <code>SUMMARIZECOLUMNS</code> by <code>f_Transaction[ItemKey]</code> while computing <code>SELECTEDVALUE(d_Item[ItemNumber])</code> returns null for every row, because <code>d_Item</code> holds 2\u20134 rows per item number (one per source company) and <code>ItemKey</code> is company-prefixed, so the grouping never collapses the dimension to a single row and <code>SELECTEDVALUE</code> blanks out. <b>The shape that works</b> is to group by the dimension columns and filter with <code>TREATAS</code>: <code>SUMMARIZECOLUMNS(d_SellToCustomer[CustomerNumber], d_Item[ItemNumber], TREATAS({...}, d_SellToCustomer[CustomerNumber]), TREATAS({...}, d_Item[ItemNumber]), "LastOrderDate", CALCULATE(MAX(f_Transaction[OrderDate])))</code>. Recorded here so the next refresh doesn't rediscover it.<br/>
    <b>Caveat:</b> <code>MAX(f_Transaction[OrderDate])</code> is taken with no document-type filter. If <code>f_Transaction</code> mixes credit memos or returns in with sales, a return could in principle set a "last ordered" date. Worth confirming before these drive outbound calls.`});
  findings.push({sev:'high', text:`<b>NEW THIS REFRESH \u2014 the documented SalesModel join cannot actually be performed.</b> The build method says to join SalesModel to BC customer records on <b>both</b> Sell-to Customer Number and <b>Legacy Customer Number</b>, so that customers remapped during the ERP upgrade aren't wrongly marked lapsed. <b>No Legacy Customer Number column exists.</b> All 90 columns on <code>d_SellToCustomer</code> were checked, plus every table in the model for anything named legacy/old/prior/former/previous/orig/alternate/xref; the only "legacy" hit in the entire model is <code>Legacy Customers</code>, which is an <i>integer measure</i> (a count), not a number column. The nearest alternate keys \u2014 BillToCustomerNumber, CustomerKey, Account Number, UniversalCompanySiteID, POSCode \u2014 are none of them a legacy ERP number. <b>Consequence: any customer whose number changed in the upgrade is silently invisible to the history join</b>, and this cannot be fixed from this model. It needs a customer-number crosswalk from whoever ran the migration.`});
  findings.push({sev:'high', text:`<b>RE-VERIFIED and broader than previously recorded \u2014 customer numbers are not unique in SalesModel.</b> <b>22 of ${ALL_ACCOUNTS.length}</b> assigned customer numbers return more than one row. The known case still reproduces exactly: <b>C132371</b> returns both "Epirus" (ordering actively) and an unrelated dormant "Environmental Dimensions Inc" (last order 2017-12-08). It is not isolated \u2014 12 are recycled numbers mapping a live account to an unrelated dormant one (C132371 Epirus/Environmental Dimensions, C129074 Anduril/Hope College, C151561 Pano AI/Phantom Intelligence, C157166 MP Aero/Gip Technology, C148170 Amarok/RaceTronics, C151758 Techops/SBL Technologies, C106540 Zeido/Structured Media, C108736 AAA Communications/Mega Trans, C165450 PPC Broadband/Freestate Electronics, C118355 III Williams/Kcgy-Town Square, C105468 Coast Pneumatics/Kfmb Tv, C173625 Ian Reekie/Chris Burban), and 10 are blank-name junk twins. All 22 were resolved by exact name match against the account package, not by number. <b>Any join on customer number alone picks the wrong record roughly one time in six.</b> One to watch: C105468 \u2014 the correctly-matched row (Coast Pneumatics) has no history, while the discarded twin (Kfmb Tv) carries a 2008 date; the 2008 date almost certainly belongs to the unrelated record, so this account legitimately shows as no-history.`});
  findings.push({sev:'high', text:`<b>NEW THIS REFRESH \u2014 SalesModel encodes "no history" as sentinel values, not nulls.</b> <code>LastOrderDate</code> and <code>FirstOrderDate</code> come back as <b>1/1/1900</b> and <code>DaysSinceLastOrder</code> as <b>99999</b> on 21 rows. These are mapped to null here. Read naively, they would compute to roughly 46,000 days since last order and classify live accounts as ancient \u2014 or, worse, a 99999 in an average would quietly wreck any recency metric built on this table.`});
  findings.push({sev:'high', text:`<b>Owner \u2260 BC Salesperson on ${mismatch.length} of ${QUOTES.length} active quotes (${Math.round(mismatch.length/QUOTES.length*100)}%).</b> The account package says one rep owns the account; BC's Salesperson Code on the quote says someone else entered it. Codes appearing most often in place of the assigned rep: ${Object.entries(mismatch.reduce((m,q)=>(m[q.bcSalesperson||'(blank)']=(m[q.bcSalesperson||'(blank)']||0)+1,m),{})).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c,n])=>`<b>${c}</b> (${n})`).join(', ')}. At this rate it is not a handful of exceptions \u2014 either the account package or BC's salesperson assignment is systematically out of date, and follow-up routing is unreliable until that's reconciled. Use the Manager View's "Owner \u2260 BC rep" tile to work the list.`});
  panel.innerHTML = `
    <div class="section-title">Data Quality</div>
    <div class="section-sub">Gaps found in the live pull &mdash; these get corrected in Business Central, not in this app. Refreshed ${TODAY.toISOString().slice(0,10)}. The findings below were each <b>re-verified against this pull</b> rather than carried forward: items marked RE-VERIFIED still hold and show the current evidence; items marked NEW THIS REFRESH did not appear in the previous build.</div>
    <div class="card">
      <b style="font-size:13px">Systemic findings &mdash; ${findings.length} re-verified against this pull</b>
      ${findings.map(i => `<div class="dq-item"><span class="dq-sev" style="background:${i.sev==='high'?'var(--red)':'var(--yellow)'}">${i.sev.toUpperCase()}</span>${i.text}</div>`).join('')}
    </div>
    <div class="card">
      <details>
        <summary style="cursor:pointer;font-size:13px;font-weight:700;color:var(--nav)">Per-quote gaps &mdash; ${issues.length} individual records to fix in BC (click to expand)</summary>
        <div class="section-sub" style="margin-top:6px">Generated row by row from this pull: missing follow-up dates, missing follow-up codes, unassigned follow-up reps, and owner/salesperson mismatches. These are the individual instances behind the systemic findings above.</div>
        <div style="max-height:420px;overflow-y:auto">
        ${issues.map(i => `<div class="dq-item"><span class="dq-sev" style="background:${i.sev==='high'?'var(--red)':'var(--yellow)'}">${i.sev.toUpperCase()}</span>${i.text}</div>`).join('') || '<div class="dq-item">No per-quote gaps found in this snapshot.</div>'}
        </div>
      </details>
    </div>
    <div class="card">
      <b style="font-size:13px">Known unavailable fields (not invented)</b>
      <div class="dq-item">"Describe the Opportunity" \u2014 not present on salesHeader2 in this BC instance.</div>
      <div class="dq-item">Customer Part No., NCNR/freight flags, brand/region/department fields \u2014 not present on salesQuoteLine; these only appear once a quote converts to salesOrderLine.</div>
      <div class="dq-item">Demand Creation flag \u2014 no reliable connected source yet.</div>
    </div>
  `;
}

    <div class="section-sub">Built so far: Queue, Rep View, filters (Quote Type, Classification, Customer), <b>clickable KPI and flag-badge filters on every working view</b>, Stock, quote-line drill-down, customer drill-down, item-level classification, Winback, Repeated No-Win, Conversion with date range and rep leaderboard, Customers (including zero-activity accounts), exception-based Manager coaching queue, QUOTE+VALUE coaching panel, <b>Lost Quotes</b>, Archive, Data Quality.</div>
    <div class="roadmap-grid">
      <div class="roadmap-card" style="border-color:var(--accent);border-style:solid"><b>Rebuild Won/Lost/Active on <code>quoteStatus</code></b>The highest-value open item, and newly possible. BC already maintains real disposition in <code>salesQuotes.quoteStatus</code>; <code>status</code> does not. Doing this fixes the undercounted Conversion tab and clears ${QUOTES.filter(q=>CLOSED_QUOTE_STATUSES.includes(q.quoteStatus)).length} already-closed quotes out of the working queue. Needs a decision, not a process change.</div>
      <div class="roadmap-card"><b>Close quotes on the <code>status</code> field too</b>${LOST_QUOTES.filter(r=>['Quote Issued','Quote WIP','Pending Approval'].includes(r.status)).length} of ${LOST_QUOTES.length} lost-coded quotes still read open on <code>status</code>. Less urgent now that <code>quoteStatus</code> is known to be reliable, but it keeps misleading anyone reading BC directly.</div>
      <div class="roadmap-card"><b>Populate <code>reasonCode</code></b>It is empty on 100% of records pulled. Until it is actually filled in, the "why did we lose it" half of the Lost Quotes tab stays blank and no lost-reason analysis is possible.</div>
      <div class="roadmap-card"><b>Legacy customer-number crosswalk</b>SalesModel has no Legacy Customer Number column, so customers remapped in the ERP upgrade can't be matched to their own history. Needs a crosswalk from whoever ran the migration.</div>
