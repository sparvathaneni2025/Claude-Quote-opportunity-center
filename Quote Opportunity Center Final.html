<style>
  :root {
    --bg: #FAF7F2;
    --nav: #2B2B2B;
    --accent: #C1541C;
    --card: #FFFFFF;
    --cream: #FFF9F2;
    --border: #E5DDD3;
    --text: #2B2B2B;
    --text-muted: #7A7267;
    --red: #C1392B;
    --orange: #C1541C;
    --yellow: #B8860B;
    --green: #4C7A3D;
    --gray: #9B9186;
  }
  * { box-sizing: border-box; font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  #qoc { background: var(--bg); color: var(--text); border-radius: 12px; overflow: hidden; }
  .qoc-nav { background: var(--nav); color: #fff; padding: 14px 20px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .qoc-nav .brand { font-weight: 700; font-size: 15px; margin-right: 16px; color: #fff; letter-spacing: 0.3px; }
  .qoc-tab { background: transparent; border: none; color: #cfc9c0; padding: 8px 14px; border-radius: 8px; font-size: 13px; cursor: pointer; }
  .qoc-tab.active { background: var(--accent); color: #fff; font-weight: 600; }
  .qoc-tab:hover:not(.active) { background: #3d3d3d; color: #fff; }
  .qoc-body { padding: 20px; }
  .qoc-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .kpi { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
  .kpi .val { font-size: 22px; font-weight: 700; color: var(--nav); }
  .kpi .lbl { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .kpi.warn .val { color: var(--red); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; }
  thead th { background: var(--cream); text-align: left; padding: 10px 8px; font-weight: 600; color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; border-bottom: 2px solid var(--border); }
  tbody td { padding: 10px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tbody tr:hover { background: #FFFBF6; }
  .flag { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #fff; margin-bottom: 3px; }
  .flag.overdue { background: var(--red); }
  .flag.today { background: var(--orange); }
  .flag.missing { background: var(--yellow); }
  .flag.ok { background: var(--green); }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: 11px; background: #EFE6DA; color: var(--nav); font-weight: 600; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; border: 1px solid var(--border); border-radius: 6px; padding: 4px 6px; font-size: 12px; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 32px; }
  .section-title { font-size: 16px; font-weight: 700; margin: 0 0 4px; color: var(--nav); }
  .section-sub { font-size: 12px; color: var(--text-muted); margin: 0 0 14px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
  .dq-item { padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .dq-item:last-child { border-bottom: none; }
  .dq-sev { font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; color: #fff; margin-right: 8px; }
  .roadmap-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px,1fr)); gap: 12px; }
  .roadmap-card { border: 1px dashed var(--border); border-radius: 10px; padding: 14px; color: var(--text-muted); font-size: 12px; background: var(--cream); }
  .roadmap-card b { display: block; color: var(--nav); font-size: 13px; margin-bottom: 4px; }
  .qf-kpi:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  .qf-kpi.qf-active { background: var(--accent); }
  .qf-kpi.qf-active .val, .qf-kpi.qf-active .lbl { color: #fff; }
  .qf-indicator { display: inline-flex; align-items: center; gap: 8px; background: var(--nav); color: #fff; font-size: 12px; font-weight: 600; padding: 6px 12px; border-radius: 8px; margin-bottom: 12px; }
  .qf-indicator a { color: #fff; text-decoration: none; font-weight: 700; }
  .flag.qf-clickable { cursor: pointer; }
  .save-status { font-size: 11px; color: var(--green); margin-left: 8px; }
  .refresh-btn { background: var(--accent); color: #fff; border: none; border-radius: 8px; padding: 8px 16px; font-size: 12px; font-weight: 600; cursor: pointer; }
  .snapshot-note { font-size: 11px; color: var(--text-muted); background: var(--cream); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 16px; }
</style>

<div id="qoc">

    <button class="qoc-tab" data-tab="archive">Archive</button>
    <button class="qoc-tab" data-tab="roadmap">Roadmap</button>
  </div>
  <div class="qoc-body">
    <div class="snapshot-note" id="snapshot-note"></div>

    <div id="panel-dq" style="display:none"></div>
    <div id="panel-archive" style="display:none"></div>
    <div id="panel-roadmap" style="display:none"></div>
  </div>
</div>
<div id="qoc-modal-backdrop" style="display:none;position:fixed;inset:0;background:rgba(30,26,22,0.55);z-index:9999;align-items:center;justify-content:center;padding:24px;">

const TODAY = new Date("2026-09-15");
const STORAGE_KEY = "qoc-line-edits-v1";
let editState = {}; // key: quoteNo|lineNo -> {quoteType, targetPrice, comments}

function lineKey(q, l) { return q.quoteNo + "|" + l.lineNo; }
function daysBetween(dateStr) {
  const d = new Date(dateStr);
  return Math.round((d - TODAY) / 86400000);
}
function fmt$(n) { return "$" + Number(n).toLocaleString(undefined, {minimumFractionDigits:2, maximumFractionDigits:2}); }

function computeFlags(q, edit) {
  const flags = [];
  if (!q.followUpDate) { flags.push({label: "Missing Follow-Up Date", cls: "missing", key: "missingFUDate"}); }
  else {
    const fu = daysBetween(q.followUpDate);
    if (fu < 0) flags.push({label: "Overdue " + Math.abs(fu) + "d", cls: "overdue", key: "overdue"});
    else if (fu === 0) flags.push({label: "Due today", cls: "today", key: "today"});
  }
  if (!q.followUpCode) flags.push({label: "Missing Follow-Up Code", cls: "missing", key: "missingFUCode"});
  if (!q.followUpSalesperson) flags.push({label: "Missing Follow-Up Rep", cls: "missing", key: "missingFURep"});
  const exp = daysBetween(q.expirationDate);
  if (exp >= 0 && exp <= 5) flags.push({label: "Expires in " + exp + "d", cls: "today", key: "expiring"});
  if (normalizeOwner(q.owner) !== q.bcSalesperson) {
    flags.push({label: "Owner \u2260 BC Salesperson", cls: "missing", key: "ownerMismatch"});
  }
  if (edit && !edit.quoteType) flags.push({label: "Missing Bid/Buy", cls: "missing", key: "missingBidBuy"});
  return flags;
}
// Quick-filter definitions shared by clickable KPI tiles and inline flag badges (interactive filters, v1: one active filter per view).
const QUICK_FILTER_LABELS = {
  overdue: "Overdue", today: "Due Today", missingFUDate: "Missing Follow-Up",
  expiring: "Expiring \u22645 days", missingFUCode: "Missing Follow-Up Code",
  missingFURep: "Missing Follow-Up Rep", ownerMismatch: "Owner \u2260 BC Salesperson",
  missingBidBuy: "Missing Bid/Buy", lostMissingReason: "Lost \u2014 missing lostCode/reasonCode"
};
function rowHasFlagKey(flags, key) { return flags.some(f => f.key === key); }
function normalizeOwner(owner) {
  const map = {"Adam Purcell":"APURCELL","Kelli Jones":"KJONES","Jerik Wong":"JWONG","Spencer Doty":"SDOTY"};
  return map[owner] || owner;
}

async function loadEdits() {
  try {
    const result = await window.storage.get(STORAGE_KEY);
    if (result && result.value) editState = JSON.parse(result.value);
  } catch (e) { editState = {}; }
}
async function saveEdits() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(editState)); } catch (e) {}
}
function getEdit(key) {
  return editState[key] || { quoteType: "", targetPrice: "", comments: "" };
}

const tableFilters = {}; // containerId -> { quoteType: 'All', classification: 'All', customer: 'All' }

  let rows = [];

    q.lines.forEach(l => {

  const clearBtn = document.getElementById(containerId+'-filter-clear');

let conversionDateFilter = { from: '', to: '' };

function renderConversion() {
  const panel = document.getElementById('panel-conversion');

  // combine active + archive, tag each with outcome
  const activeRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => activeRows.push({q, l, outcome:'Open', edit:getEdit(lineKey(q,l))})));
  const archiveRows = [];
  ARCHIVE.forEach(q => q.lines.forEach(l => archiveRows.push({q, l, outcome:q.outcome, edit:{quoteType:''}})));
  let allRows = activeRows.concat(archiveRows);

  // date range filter on dueDate
  if (conversionDateFilter.from) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate >= conversionDateFilter.from);
  if (conversionDateFilter.to) allRows = allRows.filter(({q}) => q.dueDate && q.dueDate <= conversionDateFilter.to);

  const wonRows = allRows.filter(r => r.outcome === 'Won');
  const wonValue = wonRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const totalValue = allRows.reduce((s,r)=>s+r.l.lineAmount,0);
  const wonQuoteNos = new Set(ARCHIVE.filter(q=>q.outcome==='Won').map(q=>q.quoteNo));
  const totalQuoteNos = new Set([...QUOTES.map(q=>q.quoteNo), ...ARCHIVE.map(q=>q.quoteNo)]);

  // rep leaderboard: most quoted (all-time, all statuses) + win rate
  const byRep = {};
  allRows.forEach(({q,l,outcome}) => {
    byRep[q.owner] = byRep[q.owner] || {quotedLines:0, quotedValue:0, wonLines:0, wonValue:0, quoteNos:new Set()};
    byRep[q.owner].quotedLines += 1;
    byRep[q.owner].quotedValue += l.lineAmount;
    byRep[q.owner].quoteNos.add(q.quoteNo);
    if (outcome === 'Won') { byRep[q.owner].wonLines += 1; byRep[q.owner].wonValue += l.lineAmount; }
  });
  const repRows = Object.entries(byRep).map(([rep,d]) => ({
    rep, quotes: d.quoteNos.size, quotedValue: d.quotedValue,
    winRateValue: d.quotedValue ? (d.wonValue/d.quotedValue*100) : 0,
    wonValue: d.wonValue
  })).sort((a,b) => b.quotedValue - a.quotedValue);

  // conversion by quote type (Bid/Buy/blank)
  const byType = {};
  allRows.forEach(({l,edit,outcome}) => {
    const t = edit.quoteType || '(not set)';
    byType[t] = byType[t] || {quoted:0, won:0};
    byType[t].quoted += l.lineAmount;
    if (outcome === 'Won') byType[t].won += l.lineAmount;
  });

  // conversion by classification
  const byClass = {};
  allRows.forEach(({l,outcome}) => {
    byClass[l.itemClassification] = byClass[l.itemClassification] || {quoted:0, won:0};
    byClass[l.itemClassification].quoted += l.lineAmount;
    if (outcome === 'Won') byClass[l.itemClassification].won += l.lineAmount;
  });

  const pct = (num, den) => den ? ((num/den)*100).toFixed(1)+'%' : '\u2014';

  panel.innerHTML = `
    <div class="section-title">Conversion</div>
    <div class="section-sub">Active + Archive combined. Date range filters by Due Date (the closest proxy available to a true quote-creation date in this pull). Real conversion is thin right now: only ${wonQuoteNos.size} of ${totalQuoteNos.size} tracked quotes have a confirmed Won outcome in Business Central. Refreshed against real revenue for the same accounts, same time window (since the ERP upgrade to the current SQIE quote numbering, April 2026): $14.49M in actual revenue vs. $36,709.25 in confirmed Won quotes \u2014 0.25%. See Data Quality for the full breakdown, including an earlier version of this comparison that was corrected.</div>
    <div style="display:flex;gap:16px;align-items:center;margin-bottom:14px;flex-wrap:wrap;background:var(--cream);border:1px solid var(--border);border-radius:8px;padding:10px 14px;">
      <span style="font-size:12px;font-weight:600;color:var(--text-muted)">DATE RANGE (Due Date):</span>
      <label style="font-size:12px;color:var(--text-muted)">From <input type="date" id="conv-date-from" value="${conversionDateFilter.from}" style="margin-left:4px"/></label>
      <label style="font-size:12px;color:var(--text-muted)">To <input type="date" id="conv-date-to" value="${conversionDateFilter.to}" style="margin-left:4px"/></label>
      ${(conversionDateFilter.from||conversionDateFilter.to) ? `<a href="#" id="conv-date-clear" style="font-size:12px;color:var(--text-muted);text-decoration:underline">clear</a>` : ''}
    </div>
    <div class="qoc-kpis">
      <div class="kpi"><div class="val">${fmt$(totalValue)}</div><div class="lbl">Total tracked value</div></div>
      <div class="kpi"><div class="val">${fmt$(wonValue)}</div><div class="lbl">Won value</div></div>
      <div class="kpi"><div class="val">${pct(wonValue,totalValue)}</div><div class="lbl">$ conversion (Won \u00f7 total)</div></div>
      <div class="kpi"><div class="val">${wonQuoteNos.size}</div><div class="lbl">Won quotes</div></div>
    </div>

    <div class="card">
      <b style="font-size:13px">Rep leaderboard \u2014 most quoted &amp; win rate by value</b>
      <table style="margin-top:8px"><thead><tr><th>Rep</th><th>Quotes</th><th>Quoted Value</th><th>Won Value</th><th>Win Rate ($)</th></tr></thead>
      <tbody>${repRows.map(r=>`<tr><td>${r.rep}</td><td>${r.quotes}</td><td>${fmt$(r.quotedValue)}</td><td>${fmt$(r.wonValue)}</td><td>${r.winRateValue.toFixed(1)}%</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Quote Type</b>
      <table style="margin-top:8px"><thead><tr><th>Quote Type</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byType).sort((a,b)=>b[1].quoted-a[1].quoted).map(([t,d])=>`<tr><td><span class="badge">${t}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="card">
      <b style="font-size:13px">Conversion by Classification (Existing / Winback / New Business)</b>
      <table style="margin-top:8px"><thead><tr><th>Classification</th><th>Quoted Value</th><th>Won Value</th><th>Conversion</th></tr></thead>
      <tbody>${Object.entries(byClass).sort((a,b)=>b[1].quoted-a[1].quoted).map(([c,d])=>`<tr><td><span class="badge">${c}</span></td><td>${fmt$(d.quoted)}</td><td>${fmt$(d.won)}</td><td>${pct(d.won,d.quoted)}</td></tr>`).join('')}</tbody></table>
    </div>

    <div class="roadmap-card" style="margin-top:14px"><b>Why there's no "Lost" conversion rate</b>Business Central's lostCode field is populated on quotes that are still open (status stays "Quote Issued"/"Quote WIP") &mdash; reps are tagging a risk reason without ever closing the quote. There's no reliable way to compute a true Lost bucket until quotes actually get closed out in BC. See Data Quality for the full note.</div>
  `;
  document.getElementById('conv-date-from').addEventListener('change', e => { conversionDateFilter.from = e.target.value; renderConversion(); });
  document.getElementById('conv-date-to').addEventListener('change', e => { conversionDateFilter.to = e.target.value; renderConversion(); });
  const clearBtn = document.getElementById('conv-date-clear');
  if (clearBtn) clearBtn.addEventListener('click', (e) => { e.preventDefault(); conversionDateFilter = {from:'',to:''}; renderConversion(); });
}

function funnelStage(q) {
  if (q.invoiced) return { label: 'Shipped/Invoiced', color: '#D9EAD3' };
  if (q.orderExists) return { label: 'Order Created \u2014 not yet shipped', color: '#FFF3CD' };
  return { label: 'Won (order not found)', color: '#D9EAD3' };
}

function buildCoachingPanel(q) {
  const edit0 = getEdit(lineKey(q, q.lines[0]));
  const topLine = q.lines.slice().sort((a,b)=>b.lineAmount-a.lineAmount)[0];
  const fu = q.followUpDate ? daysBetween(q.followUpDate) : null;

  const qQuestions = [];
  qQuestions.push(edit0.quoteType ? `Confirmed as a <b>${edit0.quoteType}</b> \u2014 does the evidence on file still support that?` : `Is this a <b>Bid or a Buy</b>? Quote Type isn't set yet.`);
  qQuestions.push(q.classification === 'Winback' || q.lines.some(l=>l.itemClassification==='Winback') ? `This has Winback lines \u2014 what changed, and why did we stop getting this business?` : `What's the project or application driving this quote? (Confirm [Application/Project] with the customer \u2014 not captured in this pull.)`);
  qQuestions.push(`When is the expected award date? Expiration on file is <b>${q.expirationDate}</b>.`);

  const uQuestions = [];
  uQuestions.push(`How will ${q.customer} decide who wins this? Confirm price vs. other criteria with the customer.`);
  uQuestions.push(topLine.stock === 0 ? `Top line (<b>${topLine.item}</b>) shows <b>zero stock</b> \u2014 confirm lead time before presenting.` : `Stock on the top line (<b>${topLine.item}</b>) is ${topLine.stock}. Confirm that still covers the quoted quantity.`);

  const oQuestions = [];
  oQuestions.push(`Have all lines worth escalating been reviewed? Highest-value line here is <b>${fmt$(topLine.lineAmount)}</b> (${topLine.item}).`);
  if (q.moreLinesValue) oQuestions.push(`${fmt$(q.moreLinesValue)} on this quote isn't itemized in this view (freight or lines outside this pull) \u2014 confirm the full picture in BC directly.`);

  const tQuestions = [];
  tQuestions.push(`What's the value story beyond price for ${q.customer}? (Availability, lead time, support \u2014 confirm which applies with the customer.)`);

  const eQuestions = [];
  eQuestions.push(fu === null ? `<b>No Follow Up Date set.</b> Establish one before the next contact \u2014 never leave without a scheduled next step.` : fu < 0 ? `Follow-up is <b>overdue by ${Math.abs(fu)} day${Math.abs(fu)===1?'':'s'}</b>. What's the next action, and by when?` : fu === 0 ? `Follow-up is <b>due today</b>. What's the next action?` : `Follow-up scheduled for ${q.followUpDate}. Confirm that's still the right date.`);
  eQuestions.push(`Has the outcome been documented? Current BC status: <b>${q.status}</b>.`);

  return `
    <div class="card" style="margin-top:18px;background:var(--cream)">
      <b style="font-size:13px;color:var(--nav)">QUOTE + VALUE coaching \u2014 grounded in what's on file for this quote</b>
      <div class="section-sub" style="margin-top:4px">Phrased as questions to confirm with the customer or in BC \u2014 nothing here is invented.</div>
      <div style="margin-top:10px;font-size:12px">
        <div style="margin-bottom:8px"><b>Q \u2014 Qualify</b><ul style="margin:4px 0 0 18px">${qQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>U \u2014 Understand</b><ul style="margin:4px 0 0 18px">${uQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>O \u2014 Optimize</b><ul style="margin:4px 0 0 18px">${oQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div style="margin-bottom:8px"><b>T \u2014 Tailor</b><ul style="margin:4px 0 0 18px">${tQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
        <div><b>E \u2014 Execute</b><ul style="margin:4px 0 0 18px">${eQuestions.map(x=>`<li>${x}</li>`).join('')}</ul></div>
      </div>
    </div>
  `;
}

let managerQuickFilter = null; // { owner?: string, key?: string, label: string } — one active filter at a time
function setManagerQuickFilter(next) {
  const same = managerQuickFilter && next && managerQuickFilter.owner === next.owner && managerQuickFilter.key === next.key;
  managerQuickFilter = same ? null : next;
  renderManager();
}
function renderManager() {
  const panel = document.getElementById('panel-manager');
  const byOwner = {};
  QUOTES.forEach(q => {
    byOwner[q.owner] = byOwner[q.owner] || { value: 0, count: 0, overdue: 0, missingFU: 0, zeroActivity: 0 };
    byOwner[q.owner].value += q.quoteTotal;
    byOwner[q.owner].count += 1;
    if (q.followUpDate && daysBetween(q.followUpDate) < 0) byOwner[q.owner].overdue += 1;
    if (!q.followUpDate) byOwner[q.owner].missingFU += 1;
  });
  const activeCustNos = new Set(QUOTES.map(q => q.custNo));
  ALL_ACCOUNTS.forEach(a => { if (!activeCustNos.has(a.custNo)) { byOwner[a.owner] = byOwner[a.owner] || { value:0, count:0, overdue:0, missingFU:0, zeroActivity:0 }; byOwner[a.owner].zeroActivity += 1; } });
  const repRows = Object.entries(byOwner).sort((a,b)=>b[1].value-a[1].value);

  // exception-based coaching queue: every line with at least one real flag, ranked by severity then value
  let queueRows = [];
  QUOTES.forEach(q => q.lines.forEach(l => {
    const edit = getEdit(lineKey(q,l));
    const flags = computeFlags(q, edit);
    if (flags.length) queueRows.push({q, l, flags});
  }));
  const rank = f => f.some(x=>x.cls==='overdue') ? 0 : f.some(x=>x.cls==='today') ? 1 : f.some(x=>x.cls==='missing') ? 2 : 3;
  queueRows.sort((a,b) => rank(a.flags)-rank(b.flags) || b.l.lineAmount-a.l.lineAmount);

  let shownQueue = queueRows;
  if (managerQuickFilter) {
    shownQueue = queueRows.filter(({q,flags}) =>
      (!managerQuickFilter.owner || q.owner === managerQuickFilter.owner) &&
      (!managerQuickFilter.key || rowHasFlagKey(flags, managerQuickFilter.key))
    );
  }
  const topQueue = managerQuickFilter ? shownQueue : shownQueue.slice(0, 15);

  panel.innerHTML = `
    <div class="section-title">Manager View</div>
    <div class="section-sub">Team rollup and exception-based coaching queue across Adam, Kelli, Jerik, and Spencer's assigned accounts.</div>
    <div class="card">
      <b style="font-size:13px">Team rollup by rep</b>
      <table style="margin-top:10px"><thead><tr><th>Rep</th><th>$5K+ Quotes</th><th>Active Value</th><th>Overdue</th><th>Missing Follow-Up</th><th>Zero-Activity Accounts</th></tr></thead>
      <tbody>${repRows.map(([owner,d])=>`<tr><td>${owner}</td><td>${d.count}</td><td>${fmt$(d.value)}</td><td>${d.overdue ? `<span class="flag overdue qf-clickable" data-owner="${owner}" data-quickkey="overdue" title="Click to filter coaching queue">${d.overdue}</span>` : '0'}</td><td>${d.missingFU ? `<span class="flag missing qf-clickable" data-owner="${owner}" data-quickkey="missingFUDate" title="Click to filter coaching queue">${d.missingFU}</span>` : '0'}</td><td>${d.zeroActivity || 0}</td></tr>`).join('')}</tbody></table>
    </div>
    <div class="card">
      <b style="font-size:13px">Coaching queue &mdash; exceptions only, highest dollar value first ${managerQuickFilter ? `(${shownQueue.length} matching filter)` : `(top 15 of ${queueRows.length})`}</b>
      <div class="section-sub" style="margin-top:4px">The 5 Manager Review questions: (1) Is this a Bid or a Buy, and what's the evidence? (2) How will the customer decide who wins? (3) What supports the pricing or discount being asked? (4) What's the story and value proposition? (5) What's the next action, by when, and what outcome are we trying to achieve?</div>
      ${managerQuickFilter ? `<div class="qf-indicator" style="margin-top:8px">Showing: ${managerQuickFilter.owner ? managerQuickFilter.owner+' — ' : ''}${QUICK_FILTER_LABELS[managerQuickFilter.key] || 'All flags'} (${shownQueue.length}) <a href="#" id="mgr-quick-clear" title="Clear filter">&times;</a></div>` : ''}
      ${topQueue.map(({q,l,flags}) => `
        <div style="border-top:1px solid var(--border);padding:10px 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px">
          <div>
            <a href="#" class="mgr-quote-link" data-quote="${q.quoteNo}" data-line="${l.lineNo}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.customer}</a>
            &mdash; ${q.quoteNo} &mdash; ${fmt$(l.lineAmount)} (${l.item}) &mdash; ${q.owner}<br/>
            <span style="font-size:12px;color:var(--text-muted)">Follow-up: ${q.followUpDate || 'none set'} (${q.followUpCode||'no code'}) &middot; Classification: ${l.itemClassification} &middot; Quote Type: ${getEdit(lineKey(q,l)).quoteType || 'not set'}</span>
          </div>
          <div style="text-align:right;white-space:nowrap">${flags.map(f=>`<span class="flag ${f.cls} qf-clickable" data-quickkey="${f.key}" title="Click to filter coaching queue">${f.label}</span>`).join(' ')}</div>
        </div>`).join('')}
    </div>
  `;
  panel.querySelectorAll('.mgr-quote-link').forEach(a => {

  });

  if (mgrClear) mgrClear.addEventListener('click', (e) => { e.preventDefault(); managerQuickFilter = null; renderManager(); });
}

let lostQuickFilter = null; // 'flagged' | null — one active filter at a time
function renderLost() {
  const panel = document.getElementById('panel-lost');
  // Same per-rep pull as the active queue (Section 4) — quotes with a lostCode still show status
  // Quote Issued/WIP (known BC limitation: lost quotes are never formally closed, see Data Quality).
  let rows = QUOTES.filter(q => q.lostCode || q.reasonCode);
  rows.forEach(q => { q._flagged = (!!q.lostCode) !== (!!q.reasonCode); });
  const flaggedCount = rows.filter(q => q._flagged).length;

  let shown = rows;
  if (lostQuickFilter === 'flagged') shown = rows.filter(q => q._flagged);
  shown = shown.slice().sort((a,b) => (b._flagged - a._flagged) || (b.quoteTotal - a.quoteTotal));

  const totalValue = rows.reduce((s,q)=>s+q.quoteTotal,0);

          <td><a href="#" class="quote-link" data-quote="${q.quoteNo}" data-line="${q.lines[0] ? q.lines[0].lineNo : ''}" style="color:var(--accent);font-weight:600;text-decoration:underline;cursor:pointer">${q.quoteNo}</a></td>
          <td><a href="#" class="customer-link" data-custno="${q.custNo}" style="color:var(--nav);font-weight:700;text-decoration:underline;cursor:pointer">${q.customer}</a></td>
          <td>${q.owner}</td>
          <td>${fmt$(q.quoteTotal)}</td>
          <td>${q.lostCode || '<span style="color:var(--red)">blank</span>'}</td>
          <td>${q.reasonCode || '<span style="color:var(--red)">blank</span>'}</td>

  const byCust = {};
  QUOTES.forEach(q => {
    byCust[q.custNo] = byCust[q.custNo] || { name: q.customer, owner: q.owner, lineCount: 0, quotedValue: 0, wonValue: 0, quoteNos: new Set() };
    byCust[q.custNo].lineCount += q.lines.length;
    byCust[q.custNo].quotedValue += q.quoteTotal;
    byCust[q.custNo].quoteNos.add(q.quoteNo);

  ARCHIVE.forEach(q => {
    byCust[q.custNo] = byCust[q.custNo] || { name: q.customer, owner: q.owner, lineCount: 0, quotedValue: 0, wonValue: 0, quoteNos: new Set() };
    byCust[q.custNo].lineCount += q.lines.length;
    byCust[q.custNo].quotedValue += q.quoteTotal;
    byCust[q.custNo].quoteNos.add(q.quoteNo);

      <div style="max-height:320px;overflow-y:auto">
      <table><thead><tr><th>Customer</th><th>Account #</th><th>Owner</th></tr></thead>

    </div>

function renderDQ() {
  const panel = document.getElementById('panel-dq');
  const issues = [];
  QUOTES.forEach(q => {
    if (!q.followUpDate) issues.push({sev:'high', text:`${q.quoteNo} (${q.customer}, ${fmt$(q.quoteTotal)}) has no Follow Up Date set at all.`});
    if (q.followUpDate && !q.followUpCode) issues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has a Follow Up Date but no Follow Up Code set.`});
    if (!q.followUpSalesperson) issues.push({sev:'med', text:`${q.quoteNo} (${q.customer}) has no Follow Up Salesperson assigned.`});
    if (normalizeOwner(q.owner) !== q.bcSalesperson) issues.push({sev:'high', text:`${q.quoteNo} (${q.customer}) is owned by ${q.owner} on the account package, but BC's Salesperson Code is ${q.bcSalesperson} \u2014 worth confirming who's actually working this.`});
  });
